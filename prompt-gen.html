<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKEN-SAVER PROMPT STUDIO</title>
    <style>
        /* ファミコン風ベースカラーとフォント設定 */
        body { 
            background: #E8D0A0; /* ファミコンのコントローラー風ゴールド/クリーム */
            color: #000; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 15px; 
            margin: 0; 
            box-sizing: border-box; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* ヘッダー (ファミコンレッド) */
        .header { 
            text-align: center; 
            font-size: 1.5rem; 
            font-weight: 900;
            margin-bottom: 15px; 
            background: #980000; /* えんじ色 */
            color: #fff; 
            border: 4px solid #000; 
            padding: 10px;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
        }

        /* テキストエリアと出力エリア */
        textarea, #output { 
            width: 100%; 
            background: #000; 
            color: #fff; 
            border: 4px solid #000; 
            padding: 12px; 
            box-sizing: border-box; 
            margin-bottom: 10px; 
            resize: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 0;
            box-shadow: 4px 4px 0px #000;
            font-family: 'Courier New', Courier, monospace;
        }
        
        textarea { height: 120px; }
        textarea:focus { outline: none; border-color: #980000; }

        #output { 
            height: 160px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            line-height: 1.4; 
        }
        
        /* 6つのボタンを集約するグリッドレイアウト */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        /* レトロなボタンデザイン */
        .btn {
            padding: 10px 5px;
            background: #E4E4E4; /* コントローラーのグレー */
            color: #000;
            border: 4px solid #000;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            text-align: center;
            border-radius: 0;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Courier New', Courier, monospace;
        }
        
        /* 押し込み時の挙動 */
        .btn:active { 
            transform: translate(3px, 3px); 
            box-shadow: 0px 0px 0px #000; 
        }
        
        /* 実行ボタン (大きめのファミコンレッド) */
        .btn-action { 
            background: #980000; 
            color: #fff; 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1rem; 
            margin-bottom: 10px;
        }

        /* モーダル (設定画面) */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 10; 
        }
        
        .modal-content {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #E8D0A0;
            border: 6px solid #000;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
            box-shadow: 8px 8px 0px #000;
        }

        .modal-content h3 { 
            color: #fff; 
            background: #000; 
            padding: 5px; 
            margin-top: 0; 
            text-align: center; 
            border: 4px solid #000;
        }
        
        .modal-content input, .modal-content textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;
            background: #fff; color: #000; border: 4px solid #000; font-weight: bold; border-radius: 0;
        }
        
        .modal-content label { 
            color: #000; font-weight: bold; display: block; margin-bottom: 5px; 
        }
    </style>
</head>
<body>

<div class="header">PROMPT OPTIMIZER</div>

<textarea id="userInput" placeholder="AIに何をさせたいですか？"></textarea>

<div class="btn-grid">
    <button class="btn" onclick="insertTeikei(1)">定型 1</button>
    <button class="btn" onclick="insertTeikei(2)">定型 2</button>
    <button class="btn" onclick="insertTeikei(3)">定型 3</button>
    <button class="btn" onclick="openModal('modal-teikei')" style="background: #aaccff;">📝 登録</button>
    <button class="btn" onclick="copyOutput()" style="background: #aaccff;">📋 コピー</button>
    <button class="btn" onclick="openModal('modal-api')" style="background: #cccccc;">⚙️ 設定</button>
</div>

<button class="btn btn-action" onclick="generatePrompt()">START (生成)</button>

<div id="output"></div>

<div id="modal-teikei" class="modal-overlay">
    <div class="modal-content">
        <h3>定型文の登録</h3>
        <label>定型 1</label>
        <textarea id="teikei1" rows="2" placeholder="例：Pythonで記述して"></textarea>
        
        <label>定型 2</label>
        <textarea id="teikei2" rows="2" placeholder="例：エラーハンドリングも含めて"></textarea>
        
        <label>定型 3</label>
        <textarea id="teikei3" rows="2" placeholder="例：初心者向けにコメントを多めに"></textarea>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="flex: 1; background: #980000; color: #fff;" onclick="saveTeikei()">SAVE</button>
            <button class="btn" style="flex: 1;" onclick="closeModal('modal-teikei')">CLOSE</button>
        </div>
    </div>
</div>

<div id="modal-api" class="modal-overlay">
    <div class="modal-content">
        <h3>API SETTINGS</h3>
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="flex: 1; background: #980000; color: #fff;" onclick="saveApiKey()">SAVE KEY</button>
            <button class="btn" style="flex: 1;" onclick="closeModal('modal-api')">CLOSE</button>
        </div>
    </div>
</div>

<script>
    window.onload = () => {
        document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
        for(let i=1; i<=3; i++) {
            document.getElementById('teikei'+i).value = localStorage.getItem('teikei'+i) || '';
        }
    };

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveApiKey() {
        localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
        closeModal('modal-api');
        alert('API Key Saved!');
    }

    function saveTeikei() {
        for(let i=1; i<=3; i++) {
            localStorage.setItem('teikei'+i, document.getElementById('teikei'+i).value);
        }
        closeModal('modal-teikei');
        alert('定型文を保存しました！');
    }

    function insertTeikei(num) {
        const val = localStorage.getItem('teikei'+num);
        if(!val) {
            alert(`定型 ${num} が未登録です。「📝 登録」ボタンから設定してください。`);
            return;
        }
        const ta = document.getElementById('userInput');
        ta.value = ta.value ? ta.value + '\n' + val : val;
        ta.scrollTop = ta.scrollHeight;
    }

    async function generatePrompt() {
        const input = document.getElementById('userInput').value;
        const key = localStorage.getItem('gemini_key');
        if(!key) { alert('API設定からGemini API Keyを入力してください。'); return; }
        if(!input) { alert('目的を入力してください。'); return; }

        const outputDiv = document.getElementById('output');
        outputDiv.innerText = "Generating optimized prompt...";

        const fixedConstraints = 
            "Constraint: English strictly.\n" +
            "Constraint: No greetings, no explanations, no filler.\n" +
            "Constraint: Provide raw artifact only.\n" +
            "Task: ";

        const promptForGemini = `
あなたはプロンプトエンジニアです。以下の「ユーザーの目的」を、他のAIに実行させるための、極限までトークンを節約した英語の指示文（短い命令形やキーワードの羅列）に翻訳・要約してください。
挨拶や説明は一切不要で、純粋な英語のタスク指示のみを出力してください。

ユーザーの目的: ${input}
`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: promptForGemini }] }],
                    generationConfig: { temperature: 0.2 }
                })
            });
            const data = await res.json();
            const optimizedTask = data.candidates[0].content.parts[0].text.trim();
            outputDiv.innerText = fixedConstraints + optimizedTask;
        } catch(e) { 
            outputDiv.innerText = "ERROR: Connection failed or API limit reached."; 
            console.error(e);
        }
    }

    function copyOutput() {
        const textToCopy = document.getElementById('output').innerText;
        if(!textToCopy || textToCopy.includes("Generating...")) return;
        navigator.clipboard.writeText(textToCopy);
        alert('Copied to clipboard!');
    }
</script>
</body>
</html>
