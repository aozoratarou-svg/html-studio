<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKEN-SAVER PROMPT STUDIO</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 15px; 
            margin: 0; 
            box-sizing: border-box; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* 太め・影付きの装飾 (ネオン風) */
        .header { 
            text-align: center; 
            font-size: 1.8rem; 
            font-weight: 900;
            margin-bottom: 15px; 
            color: #0ff; 
            border-bottom: 3px solid #fff; 
            padding-bottom: 5px;
            text-shadow: 0 0 10px #0ff;
            box-shadow: 0 4px 6px -6px #fff;
        }

        textarea, #output { 
            width: 100%; 
            background: #000; 
            color: #0f0; 
            border: 3px solid #ddd; 
            padding: 12px; 
            box-sizing: border-box; 
            margin-bottom: 10px; 
            resize: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            text-shadow: 0 0 2px #0f0;
        }
        
        textarea { height: 130px; }
        textarea:focus { outline: none; border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.6); }

        #output { 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            line-height: 1.4; 
            border-color: #0f0; 
            box-shadow: 0 0 10px rgba(0,255,0,0.4); 
        }
        
        /* 省スペース化したボタン群 */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 5px;
            background: #111;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
            text-shadow: 0 0 3px #fff;
            transition: all 0.1s;
        }
        
        .btn:active { transform: scale(0.96); box-shadow: 0 0 2px rgba(255,255,255,0.8); }
        
        .btn.red { background: #800; border-color: #f55; box-shadow: 0 0 10px #f55; color: #fff; text-shadow: 0 0 3px #fff;}
        .btn.blue { background: #006; border-color: #55f; box-shadow: 0 0 10px #55f; }
        .btn.action { padding: 15px; font-size: 1.1rem; }

        /* モーダル (設定画面) */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 10; 
            overflow-y: auto;
        }
        .modal h3 { color: #0ff; text-shadow: 0 0 8px #0ff; border-bottom: 3px solid #0ff; padding-bottom: 5px; margin-top: 0;}
        .modal input, .modal textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;
            background: #000; color: #fff; border: 2px solid #fff; font-weight: bold; border-radius: 4px;
        }
        .modal label { color: #fff; font-weight: bold; display: block; margin-bottom: 5px; text-shadow: 0 0 3px #fff; }
    </style>
</head>
<body>

<div class="header">PROMPT OPTIMIZER</div>

<textarea id="userInput" placeholder="AIに何をさせたいですか？"></textarea>

<div class="btn-row">
    <button class="btn" onclick="insertTeikei(1)">定型 1</button>
    <button class="btn" onclick="insertTeikei(2)">定型 2</button>
    <button class="btn" onclick="insertTeikei(3)">定型 3</button>
    <button class="btn" onclick="openModal('modal-teikei')">📝 登録</button>
</div>

<button class="btn btn-action red" onclick="generatePrompt()" style="width: 100%; margin-bottom: 10px;">実行 (PROMPT GEN)</button>

<div id="output"></div>

<div class="btn-row">
    <button class="btn btn-action blue" style="flex: 2;" onclick="copyOutput()">コピー (COPY)</button>
    <button class="btn" style="flex: 1;" onclick="openModal('modal-api')">API設定</button>
</div>

<div id="modal-teikei" class="modal">
    <h3>定型文の登録</h3>
    <label>定型 1</label>
    <textarea id="teikei1" rows="2" placeholder="例：Pythonで記述して"></textarea>
    
    <label>定型 2</label>
    <textarea id="teikei2" rows="2" placeholder="例：エラーハンドリングも含めて"></textarea>
    
    <label>定型 3</label>
    <textarea id="teikei3" rows="2" placeholder="例：初心者向けにコメントを多めに"></textarea>
    
    <div class="btn-row">
        <button class="btn blue" onclick="saveTeikei()">SAVE</button>
        <button class="btn" onclick="closeModal('modal-teikei')">CLOSE</button>
    </div>
</div>

<div id="modal-api" class="modal">
    <h3>API SETTINGS</h3>
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Enter API Key">
    <div class="btn-row">
        <button class="btn blue" onclick="saveApiKey()">SAVE KEY</button>
        <button class="btn" onclick="closeModal('modal-api')">CLOSE</button>
    </div>
</div>

<script>
    // 初期ロード時にLocalStorageからデータを復元
    window.onload = () => {
        document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
        for(let i=1; i<=3; i++) {
            document.getElementById('teikei'+i).value = localStorage.getItem('teikei'+i) || '';
        }
    };

    // モーダル制御
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // APIキー保存
    function saveApiKey() {
        localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
        closeModal('modal-api');
        alert('API Key Saved!');
    }

    // 定型文保存
    function saveTeikei() {
        for(let i=1; i<=3; i++) {
            localStorage.setItem('teikei'+i, document.getElementById('teikei'+i).value);
        }
        closeModal('modal-teikei');
        alert('定型文を保存しました！');
    }

    // 定型文を入力欄にペタッと貼り付け
    function insertTeikei(num) {
        const val = localStorage.getItem('teikei'+num);
        if(!val) {
            alert(`定型 ${num} が未登録です。「📝 登録」ボタンから設定してください。`);
            return;
        }
        const ta = document.getElementById('userInput');
        // すでに入力がある場合は改行して追記、なければそのまま挿入
        ta.value = ta.value ? ta.value + '\n' + val : val;
        // スクロールを一番下へ
        ta.scrollTop = ta.scrollHeight;
    }

    // プロンプト生成 (Gemini API呼び出し)
    async function generatePrompt() {
        const input = document.getElementById('userInput').value;
        const key = localStorage.getItem('gemini_key');
        if(!key) { alert('API設定からGemini API Keyを入力してください。'); return; }
        if(!input) { alert('目的を入力してください。'); return; }

        const outputDiv = document.getElementById('output');
        outputDiv.innerText = "Generating optimized prompt...";

        // トークン節約のための絶対的なルール
        const fixedConstraints = 
            "Constraint: English strictly.\n" +
            "Constraint: No greetings, no explanations, no filler.\n" +
            "Constraint: Provide raw artifact only.\n" +
            "Task: ";

        const promptForGemini = `
あなたはプロンプトエンジニアです。以下の「ユーザーの目的」を、他のAIに実行させるための、極限までトークンを節約した英語の指示文（短い命令形やキーワードの羅列）に翻訳・要約してください。
挨拶や説明は一切不要で、純粋な英語のタスク指示のみを出力してください。

ユーザーの目的: ${input}
`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: promptForGemini }] }],
                    generationConfig: { temperature: 0.2 }
                })
            });
            const data = await res.json();
            const optimizedTask = data.candidates[0].content.parts[0].text.trim();
            outputDiv.innerText = fixedConstraints + optimizedTask;
        } catch(e) { 
            outputDiv.innerText = "ERROR: Connection failed or API limit reached."; 
            console.error(e);
        }
    }

    // コピー機能
    function copyOutput() {
        const textToCopy = document.getElementById('output').innerText;
        if(!textToCopy || textToCopy.includes("Generating...")) return;
        navigator.clipboard.writeText(textToCopy);
        alert('Copied to clipboard!');
    }
</script>
</body>
</html>
