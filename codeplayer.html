<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>App Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 実行用 iframe */
    #runner-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #fff;
    }

    /* ドラッグ移動可能な設定ボタン */
    #settings-btn {
      position: fixed;
      top: max(env(safe-area-inset-top, 16px), 16px);
      right: max(env(safe-area-inset-right, 16px), 16px);
      width: 46px;
      height: 46px;
      background: rgba(30, 30, 30, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 9999;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: box-shadow 0.2s, background 0.2s;
    }

    #settings-btn:active {
      cursor: grabbing;
      background: rgba(40, 40, 40, 0.8);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    /* 設定・エディタモーダル */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: #fff;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 26px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    /* タブ切り替え */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      background: #1c1c1e;
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #8e8e93;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #2c2c2e;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .tab-content.active {
      display: flex;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      background: #2c2c2e;
      color: #0a84ff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn:active {
      background: #3a3a3c;
    }

    .btn-danger {
      color: #ff453a;
    }

    .btn-primary {
      background: #0a84ff;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:active {
      background: #0071e3;
    }

    /* エディタ */
    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      min-height: 0;
    }

    #code-input {
      width: 100%;
      flex: 1;
      background: #1c1c1e;
      color: #f2f2f7;
      border: 1px solid #38383a;
      border-radius: 12px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.4;
      resize: none;
      outline: none;
      white-space: pre;
      tab-size: 2;
    }

    #code-input:focus {
      border-color: #0a84ff;
    }

    /* 一覧タブのスタイル */
    .saved-list-container {
      flex: 1;
      overflow-y: auto;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 10px;
    }

    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2c2c2e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      gap: 8px;
    }

    .saved-item:last-child {
      margin-bottom: 0;
    }

    .saved-item-info {
      flex: 1;
      min-width: 0;
    }

    .saved-item-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .saved-item-date {
      color: #8e8e93;
      font-size: 11px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .empty-msg {
      text-align: center;
      color: #636366;
      font-size: 13px;
      padding: 40px 10px;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- 実行用 iframe -->
  <iframe id="runner-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-forms allow-popups allow-downloads"></iframe>

  <!-- ドラッグ移動可能な設定ボタン -->
  <div id="settings-btn" title="ドラッグで移動 / タップで設定">⚙️</div>

  <!-- モーダル画面 -->
  <div id="modal-overlay">
    <div class="panel-header">
      <div class="panel-title">App Runner</div>
      <button class="close-btn" id="modal-close">&times;</button>
    </div>

    <!-- タブ -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-editor">✏️ エディタ</button>
      <button class="tab-btn" id="tab-btn-list">📁 保存一覧 (<span id="saved-count">0</span>)</button>
    </div>

    <!-- タブ1: エディタ画面 -->
    <div class="tab-content active" id="tab-editor">
      <div class="toolbar">
        <button class="btn" id="btn-paste">📋 貼付</button>
        <button class="btn btn-danger" id="btn-clear">🗑️ クリア</button>
        <button class="btn" id="btn-save-as" style="margin-left: auto;">💾 名前を付けて保存</button>
      </div>

      <div class="editor-container">
        <textarea id="code-input" placeholder="ここに HTML/CSS/JS を入力または貼り付け..." spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
    </div>

    <!-- タブ2: 保存一覧画面 -->
    <div class="tab-content" id="tab-list">
      <div class="saved-list-container" id="saved-list">
        <!-- 動的にリストアイテムが追加されます -->
      </div>
    </div>

    <!-- フッター実行ボタン -->
    <div class="footer-actions">
      <button class="btn btn-primary" id="btn-run" style="width: 100%;">▶ 実行して全画面表示</button>
    </div>
  </div>

  <script>
    const runnerFrame = document.getElementById('runner-frame');
    const settingsBtn = document.getElementById('settings-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');
    const codeInput = document.getElementById('code-input');
    const btnPaste = document.getElementById('btn-paste');
    const btnClear = document.getElementById('btn-clear');
    const btnSaveAs = document.getElementById('btn-save-as');
    const btnRun = document.getElementById('btn-run');
    const tabBtnEditor = document.getElementById('tab-btn-editor');
    const tabBtnList = document.getElementById('tab-btn-list');
    const tabEditor = document.getElementById('tab-editor');
    const tabList = document.getElementById('tab-list');
    const savedList = document.getElementById('saved-list');
    const savedCount = document.getElementById('saved-count');

    const STORAGE_KEY_LIST = 'html_runner_saved_items_v2';
    const LAST_ACTIVE_KEY = 'html_runner_last_active_v2';
    const BTN_POS_KEY = 'html_runner_btn_pos';

    // ==========================================
    // 1. 設定ボタンのドラッグ移動 & 位置保存
    // ==========================================
    let isDragging = false;
    let dragStartX, dragStartY;
    let btnStartX, btnStartY;
    let hasMoved = false;

    // 位置復元
    const savedPos = localStorage.getItem(BTN_POS_KEY);
    if (savedPos) {
      try {
        const { x, y } = JSON.parse(savedPos);
        settingsBtn.style.left = `${x}px`;
        settingsBtn.style.top = `${y}px`;
        settingsBtn.style.right = 'auto';
      } catch(e){}
    }

    function onPointerDown(e) {
      isDragging = true;
      hasMoved = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartX = clientX;
      dragStartY = clientY;

      const rect = settingsBtn.getBoundingClientRect();
      btnStartX = rect.left;
      btnStartY = rect.top;

      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - dragStartX;
      const dy = clientY - dragStartY;

      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        hasMoved = true;
      }

      if (hasMoved) {
        e.preventDefault();
        let newX = btnStartX + dx;
        let newY = btnStartY + dy;

        // 画面外にはみ出さないよう制限
        const pad = 10;
        const maxW = window.innerWidth - settingsBtn.offsetWidth - pad;
        const maxH = window.innerHeight - settingsBtn.offsetHeight - pad;
        newX = Math.max(pad, Math.min(newX, maxW));
        newY = Math.max(pad, Math.min(newY, maxH));

        settingsBtn.style.left = `${newX}px`;
        settingsBtn.style.top = `${newY}px`;
        settingsBtn.style.right = 'auto';
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('touchend', onPointerUp);

      if (hasMoved) {
        const rect = settingsBtn.getBoundingClientRect();
        localStorage.setItem(BTN_POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
      } else {
        openModal();
      }
    }

    settingsBtn.addEventListener('pointerdown', onPointerDown);
    settingsBtn.addEventListener('touchstart', onPointerDown, { passive: true });

    // ==========================================
    // 2. モーダル & タブ管理
    // ==========================================
    function openModal() {
      modalOverlay.classList.add('active');
      renderSavedList();
    }
    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    modalClose.addEventListener('click', closeModal);

    function switchTab(target) {
      if (target === 'editor') {
        tabBtnEditor.classList.add('active');
        tabBtnList.classList.remove('active');
        tabEditor.classList.add('active');
        tabList.classList.remove('active');
      } else {
        tabBtnEditor.classList.remove('active');
        tabBtnList.classList.add('active');
        tabEditor.classList.remove('active');
        tabList.classList.add('active');
        renderSavedList();
      }
    }

    tabBtnEditor.addEventListener('click', () => switchTab('editor'));
    tabBtnList.addEventListener('click', () => switchTab('list'));

    // ==========================================
    // 3. コード実行・基本操作
    // ==========================================
    function runCode(srcDocContent) {
      runnerFrame.srcdoc = srcDocContent;
    }

    btnRun.addEventListener('click', () => {
      const code = codeInput.value;
      try {
        localStorage.setItem(LAST_ACTIVE_KEY, code);
      } catch (e) {}
      runCode(code);
      closeModal();
    });

    btnPaste.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) codeInput.value = text;
      } catch (err) {
        codeInput.focus();
        alert('クリップボードの読み取りを許可するか、入力欄を長押しして貼り付けてください。');
      }
    });

    btnClear.addEventListener('click', () => {
      if (confirm('コードをクリアしますか？')) {
        codeInput.value = '';
      }
    });

    // ==========================================
    // 4. 名前付き保存・一覧管理
    // ==========================================
    function getSavedItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_LIST)) || [];
      } catch(e) {
        return [];
      }
    }

    function saveItemsList(list) {
      localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(list));
      renderSavedList();
    }

    btnSaveAs.addEventListener('click', () => {
      const code = codeInput.value.trim();
      if (!code) {
        alert('保存するコードがありません。');
        return;
      }

      const defaultTitle = `App_${new Date().toLocaleDateString('ja-JP')} ${new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'})}`;
      const title = prompt('保存する名前を入力してください:', defaultTitle);
      if (!title) return;

      const items = getSavedItems();
      const newItem = {
        id: 'item_' + Date.now(),
        title: title.trim(),
        code: code,
        date: new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      // 先頭に追加
      items.unshift(newItem);
      try {
        saveItemsList(items);
        alert(`「${newItem.title}」として保存しました。`);
      } catch(e) {
        alert('保存容量オーバーです。古いデータを削除してください。');
      }
    });

    function renderSavedList() {
      const items = getSavedItems();
      savedCount.textContent = items.length;

      if (items.length === 0) {
        savedList.innerHTML = '<div class="empty-msg">保存されたコードはありません。<br>「名前を付けて保存」から登録できます。</div>';
        return;
      }

      savedList.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'saved-item';
        row.innerHTML = `
          <div class="saved-item-info">
            <div class="saved-item-title">${escapeHtml(item.title)}</div>
            <div class="saved-item-date">${item.date} (${(item.code.length / 1024).toFixed(1)} KB)</div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm btn-primary" data-action="load" data-index="${index}">呼出</button>
            <button class="btn btn-sm btn-danger" data-action="delete" data-index="${index}">削除</button>
          </div>
        `;
        savedList.appendChild(row);
      });
    }

    savedList.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      const index = parseInt(btn.dataset.index, 10);
      const items = getSavedItems();

      if (action === 'load') {
        const target = items[index];
        if (target) {
          codeInput.value = target.code;
          switchTab('editor');
        }
      } else if (action === 'delete') {
        const target = items[index];
        if (target && confirm(`「${target.title}」を削除しますか？`)) {
          items.splice(index, 1);
          saveItemsList(items);
        }
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // ==========================================
    // 5. 初期起動時処理
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      renderSavedList();
      const lastCode = localStorage.getItem(LAST_ACTIVE_KEY);
      if (lastCode) {
        codeInput.value = lastCode;
        runCode(lastCode);
      } else {
        const defaultSample = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>App Runner</h1>
  <p>右上の ⚙️ ボタンは自由にドラッグ移動できます。<br>タップしてコード貼付・保存一覧をご利用ください。</p>
</body>
</html>`;
        codeInput.value = defaultSample;
        runCode(defaultSample);
        openModal();
      }
    });
  </script>
</body>
</html>
