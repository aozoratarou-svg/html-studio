<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO AGENT STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #B4F8C8; 
            color: #000; 
            font-family: 'Noto Sans JP', sans-serif; 
            margin: 0; 
            padding: 0;
            height: 100vh; /* 古いブラウザ用の保険 */
            height: 100dvh; /* スマホ特有のUI増減に追従 */
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        .neo-card {
            background: #fff;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            border-radius: 8px;
        }

        .neo-btn {
            background: #FFAEBC;
            color: #000;
            font-weight: 900;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 8px;
            font-size: 0.9rem;
        }
        .neo-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
        
        .btn-blue { background: #A0E7E5; }
        .btn-yellow { background: #FBE7C6; }
        .btn-green { background: #C4FAF8; }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 15px; 
            background: #fff;
            border-bottom: 3px solid #000;
            z-index: 5;
        }
        .header h1 { margin: 0; font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; }
        .btn-setting { padding: 5px 10px; font-size: 1rem; }

        .bento-workspace {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0; 
        }

        #status-board {
            flex-shrink: 0;
            max-height: 100px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
        }
        .agent-status { margin-bottom: 4px; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        .status-run { color: #f39c12; }
        .status-err { color: #e74c3c; font-weight: bold; }

        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            position: relative;
        }
        /* フルスクリーン時の背景色対応 */
        .preview-container:fullscreen { background: #fff; padding: 10px; border: none; }
        .preview-header {
            background: #000; color: #fff; padding: 4px 10px; font-size: 0.8rem;
            text-align: center; border-bottom: 3px solid #000;
            display: flex; justify-content: space-between; align-items: center;
        }
        #preview-frame {
            flex: 1; width: 100%; border: none; background: #fff;
        }

        /* 下部コントロール群 */
        .bottom-control {
            background: #fff;
            border-top: 3px solid #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }
        
        .teikei-row { display: flex; gap: 8px; }
        .btn-teikei { flex: 1; padding: 6px 0; font-size: 0.8rem; }

        .main-control-row { 
            display: flex; 
            gap: 8px; 
            align-items: stretch;
        }
        
        #userInput { 
            flex: 1; 
            border: 3px solid #000; 
            border-radius: 8px; 
            padding: 8px; 
            font-family: inherit; 
            font-size: 0.95rem; 
            resize: none; 
            height: 70px;
        }
        #userInput:focus { outline: none; background: #f0f0f0; }
        
        .action-btns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            width: 140px;
            flex-shrink: 0;
        }

        /* GitHub保存行 */
        .github-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            padding-top: 4px;
            border-top: 1px dashed #ccc;
        }
        .github-row input {
            border: 3px solid #000;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.85rem;
            flex: 1; /* 余ったスペースを全部使う */
            min-width: 0; /* 小さい画面で縮むのを許可 */
            font-family: inherit;
        }

        /* モーダル */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px);
            z-index: 10; justify-content: center; align-items: center;
        }
        .modal-content {
            width: 90%; max-width: 400px; padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-content h3 { margin: 0 0 5px 0; text-align: center; border-bottom: 3px solid #000; padding-bottom: 5px; }
        .modal-content label { font-size: 0.8rem; font-weight: bold; margin-bottom: -5px; }
        .modal-content input, .modal-content textarea { 
            width: 100%; padding: 8px; border: 3px solid #000; border-radius: 4px; font-family: inherit;
        }
        .modal-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btn-row button { flex: 1; padding: 10px 0; }
        
        #output { display: none; }
    </style>
</head>
<body>

<header class="header">
    <h1>AGENT STUDIO</h1>
    <div class="neo-btn btn-yellow btn-setting" onclick="openModal('modal-settings')">設定</div>
</header>

<main class="bento-workspace">
    <div id="status-board" class="neo-card">
        <div id="status-pm" class="agent-status status-wait">親(PM): 待機中</div>
    </div>

    <div class="neo-card preview-container" id="preview-container">
        <div class="preview-header">
            <span>LIVE PREVIEW</span>
        </div>
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    
    <textarea id="output"></textarea>
</main>

<footer class="bottom-control">
    <div class="teikei-row">
        <div class="neo-btn btn-blue btn-teikei" onclick="insertTeikei(1)">定型 1</div>
        <div class="neo-btn btn-blue btn-teikei" onclick="insertTeikei(2)">定型 2</div>
        <div class="neo-btn btn-blue btn-teikei" onclick="insertTeikei(3)">定型 3</div>
    </div>
    <div class="main-control-row">
        <textarea id="userInput" placeholder="要件を入力..."></textarea>
        <div class="action-btns-grid">
            <button id="startBtnNew" class="neo-btn" onclick="runMultiAgent(true)">新規</button>
            <button id="startBtnUpdate" class="neo-btn btn-blue" onclick="runMultiAgent(false)">更新</button>
            <button class="neo-btn btn-yellow" onclick="copyCode()">ｺﾋﾟｰ</button>
            <button class="neo-btn btn-green" onclick="toggleFullScreen()">全画面</button>
        </div>
    </div>
    <div class="github-row">
        <input type="text" id="saveFileName" placeholder="ファイル名 (例: index.html)">
        <button class="neo-btn btn-blue" onclick="pushToGitHub()" style="padding: 6px 12px; flex-shrink: 0;">GitHubへPush</button>
    </div>
</footer>

<div id="modal-settings" class="modal-overlay">
    <div class="neo-card modal-content">
        <h3>設定</h3>
        
        <label>Gemini API</label>
        <input type="password" id="apiKey" placeholder="Gemini API Key (3.5 Flash)">
        
        <label>GitHub 連携</label>
        <input type="password" id="ghToken" placeholder="Personal Access Token">
        <input type="text" id="ghOwner" placeholder="Owner (ユーザー名)">
        <input type="text" id="ghRepo" placeholder="Repository (リポジトリ名)">

        <label>定型文</label>
        <textarea id="teikei1" rows="2" placeholder="定型文1"></textarea>
        <textarea id="teikei2" rows="2" placeholder="定型文2"></textarea>
        <textarea id="teikei3" rows="2" placeholder="定型文3"></textarea>
        
        <div class="modal-btn-row">
            <button class="neo-btn btn-blue" onclick="closeModal('modal-settings')">閉じる</button>
            <button class="neo-btn" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>

<script>
    const MODEL_NAME = "gemini-3.5-flash";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
    let latestGeneratedHTML = "";
    let isFixing = false;

    window.onload = () => {
        // 設定読み込み
        document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
        document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
        for(let i=1; i<=3; i++) { document.getElementById('teikei'+i).value = localStorage.getItem('teikei'+i) || ''; }
        
        window.addEventListener('message', handleIframeError);
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function saveSettings() {
        localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
        localStorage.setItem('gh_token', document.getElementById('ghToken').value);
        localStorage.setItem('gh_owner', document.getElementById('ghOwner').value);
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
        for(let i=1; i<=3; i++) { localStorage.setItem('teikei'+i, document.getElementById('teikei'+i).value); }
        closeModal('modal-settings');
        alert("設定を保存しました。");
    }

    function insertTeikei(num) {
        const val = localStorage.getItem('teikei'+num);
        if(!val) return;
        const ta = document.getElementById('userInput');
        ta.value = ta.value ? ta.value + '\n' + val : val;
    }

    function updateStatus(agentId, state, text) {
        let el = document.getElementById(agentId);
        if (!el) {
            el = document.createElement('div');
            el.id = agentId;
            document.getElementById('status-board').appendChild(el);
        }
        el.className = `agent-status status-${state}`;
        el.innerText = text;
        const board = document.getElementById('status-board');
        board.scrollTop = board.scrollHeight;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function callGemini(prompt, apiKey, temp = 0.0) {
        const res = await fetch(`${API_URL}?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: temp }
            })
        });
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        return data.candidates[0].content.parts[0].text.trim();
    }

    function extractHTML(text) {
        const match = text.match(/```html\n([\s\S]*?)\n```/);
        return match ? match[1] : text;
    }

    function injectErrorTracker(htmlContent) {
        const trackerScript = `
            <script>
                window.onerror = function(message, source, lineno, colno, error) {
                    window.parent.postMessage({ type: 'AGENT_ERROR', msg: message + " at line " + lineno }, '*');
                    return true;
                };
            <\/script>
        `;
        if (htmlContent.includes('<head>')) {
            return htmlContent.replace('<head>', '<head>\n' + trackerScript);
        } else {
            return trackerScript + '\n' + htmlContent;
        }
    }

    function renderPreview(htmlString) {
        const frame = document.getElementById('preview-frame');
        latestGeneratedHTML = extractHTML(htmlString);
        const trackedHTML = injectErrorTracker(latestGeneratedHTML);
        frame.srcdoc = trackedHTML;
    }

    async function handleIframeError(event) {
        if (event.data && event.data.type === 'AGENT_ERROR') {
            if (isFixing) return;
            isFixing = true;
            const errorMsg = event.data.msg;
            const key = localStorage.getItem('gemini_key');
            updateStatus('status-fixer', 'run', `修正エージェント: エラー検知 自己修正中...`);
            
            const fixPrompt = `エラーを修正した完全なHTMLコードのみを出力してください。\nエラー内容: ${errorMsg}\n元のコード:\n\`\`\`html\n${latestGeneratedHTML}\n\`\`\`\n\n必ず \`\`\`html と \`\`\` で囲むこと。`;

            try {
                const fixedCode = await callGemini(fixPrompt, key, 0.0);
                updateStatus('status-fixer', 'done', `修正エージェント: 完了。再描画します。`);
                renderPreview(fixedCode);
            } catch (e) {
                updateStatus('status-fixer', 'err', `修正エージェント: 失敗 (${e.message})`);
            } finally {
                isFixing = false;
            }
        }
    }

    function copyCode() {
        const textToCopy = latestGeneratedHTML || document.getElementById('output').value;
        if (!textToCopy || textToCopy.trim() === "") {
            alert('まだコピーするコードがありません。');
            return;
        }
        navigator.clipboard.writeText(textToCopy.trim()).then(() => {
            alert('コードをクリップボードにコピーしました！');
        }).catch(err => {
            alert('コピーに失敗しました。');
        });
    }

    function toggleFullScreen() {
        const container = document.getElementById('preview-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                alert(`フルスクリーンにできませんでした: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // 日本語の文字化けを防ぐためのBase64エンコード
    function utf8_to_b64(str) {
        return window.btoa(unescape(encodeURIComponent(str)));
    }

    async function pushToGitHub() {
        const token = localStorage.getItem('gh_token');
        const owner = localStorage.getItem('gh_owner');
        const repo = localStorage.getItem('gh_repo');
        let path = document.getElementById('saveFileName').value.trim();

        if (!token || !owner || !repo) {
            alert("設定画面からGitHubの情報を入力してください。");
            return;
        }
        if (!latestGeneratedHTML) {
            alert("保存・Pushするコードがまだ生成されていません。");
            return;
        }
        if (!path) path = "index.html"; 

        const contentB64 = utf8_to_b64(latestGeneratedHTML);
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

        const pushBtn = event.target;
        const originalText = pushBtn.innerText;
        pushBtn.innerText = "Push中...";

        try {
            // 既存ファイルの有無（sha）を確認
            let sha = "";
            const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
            if (getRes.ok) {
                const getData = await getRes.json();
                sha = getData.sha; // 上書きのために必要
            }

            const body = {
                message: `Update ${path} via AGENT STUDIO`,
                content: contentB64
            };
            if (sha) body.sha = sha;

            const putRes = await fetch(apiUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });

            if (putRes.ok) {
                alert(`GitHubの ${owner}/${repo} に ${path} をPushしました！`);
            } else {
                const errData = await putRes.json();
                alert(`Push失敗: ${errData.message}`);
            }
        } catch(e) {
            alert(`ネットワークエラー: ${e.message}`);
        } finally {
            pushBtn.innerText = originalText;
        }
    }

    async function runMultiAgent(isNew) {
        const input = document.getElementById('userInput').value;
        const key = localStorage.getItem('gemini_key');
        if(!key) { alert('設定からGemini APIキーを入力してください'); return; }
        if(!input) return;

        // 「更新」の場合、前回のコードがないと実行できない
        if (!isNew && !latestGeneratedHTML) {
            alert("更新対象のコードがありません。まずは「新規」で作成してください。");
            return;
        }

        const statusBoard = document.getElementById('status-board');
        const btnNew = document.getElementById('startBtnNew');
        const btnUpdate = document.getElementById('startBtnUpdate');
        const outputArea = document.getElementById('output');
        
        btnNew.disabled = true;
        btnUpdate.disabled = true;
        
        if (isNew) {
            document.getElementById('preview-frame').srcdoc = "";
            outputArea.value = "";
            latestGeneratedHTML = "";
        }
        
        isFixing = false;
        statusBoard.style.display = "block";
        statusBoard.innerHTML = `<div id="status-pm" class="agent-status status-run">親(PM): ${isNew ? '新規作成' : '修正'}のチーム編成中...</div>`;
        
        try {
            const spawnTool = {
                functionDeclarations: [{
                    name: "spawn_agents",
                    description: "チーム編成",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            agents: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        role: { type: "STRING" },
                                        task: { type: "STRING" },
                                        is_html_output: { type: "BOOLEAN" }
                                    }
                                }
                            }
                        },
                        required: ["agents"]
                    }
                }]
            };

            let pmPrompt = `あなたは優秀なオーケストレーターです。'spawn_agents' を実行してください。\n【制約】タスク指示は極限まで短い英語。UI担当召喚時は必ずHTML/CSS/JSを1ファイルにまとめis_html_outputをtrueに。\n`;
            
            if (!isNew && latestGeneratedHTML) {
                pmPrompt += `\n以下の既存のコードをベースに、要望に合わせた追加・修正を行ってください。\n\n既存コード:\n\`\`\`html\n${latestGeneratedHTML}\n\`\`\`\n\n`;
            }

            pmPrompt += `要望: ${input}`;
            
            const pmRes = await fetch(`${API_URL}?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: pmPrompt }] }],
                    tools: [spawnTool],
                    toolConfig: { functionCallingConfig: { mode: "ANY" } }, 
                    generationConfig: { temperature: 0.2 }
                })
            });
            
            if (!pmRes.ok) throw new Error(`API Error: ${pmRes.status}`);
            const pmData = await pmRes.json();
            const parts = pmData.candidates[0].content.parts;
            const functionCall = parts.find(p => p.functionCall)?.functionCall;

            if (!functionCall || functionCall.name !== "spawn_agents") throw new Error("PMがツールを使用しませんでした");

            const agentTeam = functionCall.args.agents;
            updateStatus('status-pm', 'done', `親(PM): 編成完了 (${agentTeam.length}名)`);

            let finalHTML = "";
            const childPromises = agentTeam.map(async (agent, index) => {
                const childPrompt = `Role: ${agent.role}\nConstraint: English strictly. NO greetings. Provide raw artifact only. If writing HTML, enclose in \`\`\`html and \`\`\`.\nTask: ${agent.task}`;
                
                try {
                    if (index > 0) {
                        updateStatus(`status-child-${index}`, 'run', `子[${agent.role}]: 待機中...`);
                        await sleep(index * 2000);
                    }
                    
                    updateStatus(`status-child-${index}`, 'run', `子[${agent.role}]: 実行中...`);

                    let result = null;
                    let lastErrorMsg = "";
                    for (let attempt = 1; attempt <= 2; attempt++) {
                        try {
                            result = await callGemini(childPrompt, key, 0.0);
                            break;
                        } catch (err) {
                            lastErrorMsg = err.message;
                            if (attempt < 2) {
                                updateStatus(`status-child-${index}`, 'err', `子[${agent.role}]: 混雑(${lastErrorMsg})。再試行...`);
                                await sleep(5000); 
                            }
                        }
                    }

                    if (!result) throw new Error(lastErrorMsg);
                    updateStatus(`status-child-${index}`, 'done', `子[${agent.role}]: 完了`);
                    
                    if (agent.is_html_output || result.includes("```html")) {
                        finalHTML = result;
                    }
                    return `### [担当: ${agent.role}]\n${result}\n\n`;
                } catch (err) {
                    updateStatus(`status-child-${index}`, 'err', `子[${agent.role}]: 失敗`);
                    return "";
                }
            });

            const results = await Promise.all(childPromises);
            outputArea.value = "=== 8-BIT SWARM OUTPUT ===\n\n" + results.join("");

            if (finalHTML) {
                renderPreview(finalHTML);
            }

        } catch(e) {
            updateStatus('status-pm', 'err', `親(PM): 停止 (${e.message})`);
        } finally {
            btnNew.disabled = false;
            btnUpdate.disabled = false;
        }
    }
</script>
</body>
</html>
