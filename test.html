<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SwipeType AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #0f172a;
    }
    input[type="text"] {
      font-size: 18px !important; /* Prevents iOS zoom */
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="text-slate-100 font-sans flex flex-col min-h-screen justify-between overflow-hidden">

  <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wider text-cyan-400">SwipeType <span class="text-xs bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full">AI</span></h1>
    <div class="flex items-center gap-3">
      <button id="settingsBtn" class="text-slate-400 hover:text-white text-sm bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">API Key</button>
      <div class="text-right">
        <div class="text-xs text-slate-400">SCORE</div>
        <div id="score" class="text-lg font-bold text-emerald-400">0</div>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col justify-center items-center px-6 py-4 max-w-md mx-auto w-full gap-6">
    
    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-cyan-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <div class="w-full bg-slate-900/50 border border-slate-800 rounded-2xl p-6 text-center shadow-xl relative overflow-hidden">
      <div id="categoryBadge" class="absolute top-3 left-3 text-[10px] font-bold tracking-widest uppercase px-2 py-0.5 rounded bg-slate-800 text-slate-400">EASY</div>
      
      <div class="text-4xl font-black tracking-wide mb-2 mt-4 flex justify-center" id="wordContainer">
        </div>
      
      <p id="wordMeaning" class="text-sm text-slate-400 min-h-[20px] italic">Loading...</p>
      <p id="wordSentence" class="text-xs text-slate-500 mt-2 min-h-[32px] px-4"></p>
    </div>

    <div class="w-full space-y-4">
      <div class="relative">
        <input 
          type="text" 
          id="wordInput" 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          placeholder="Swipe or type here..." 
          class="w-full bg-slate-900 border-2 border-slate-700 focus:border-cyan-500 text-white rounded-xl px-4 py-3.5 text-center outline-none transition-all shadow-inner"
        />
        <div id="feedbackIndicator" class="absolute right-4 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-transparent transition-all duration-150"></div>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <button onclick="setMode('easy')" id="btn-easy" class="mode-btn py-2 text-xs font-bold rounded-lg bg-cyan-600 text-white">EASY</button>
        <button onclick="setMode('ai')" id="btn-ai" class="mode-btn py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400">AI TECH</button>
        <button onclick="generateAIWeaknessWords()" id="btn-weak" class="mode-btn py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
          <span>AI BOOST</span>
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        </button>
      </div>
    </div>
  </main>

  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-6 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-4">
      <h3 class="text-lg font-bold text-white">Gemini API Configuration</h3>
      <p class="text-xs text-slate-400">Required for dynamic AI personalized practice based on your weak points.</p>
      <input 
        type="password" 
        id="apiKeyInput" 
        placeholder="Enter Gemini API Key" 
        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-cyan-500"
      />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal(false)" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancel</button>
        <button onclick="saveApiKey()" class="px-4 py-2 text-xs bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold">Save</button>
      </div>
    </div>
  </div>

  <footer class="p-4 text-center text-[10px] text-slate-600 safe-bottom border-t border-slate-900">
    Designed for iOS Touch & Glide Inputs • Real-time Validation Active
  </footer>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    const DB = {
      easy: [
        { word: 'apple', meaning: 'りんご', sentence: 'I ate a fresh apple for breakfast.' },
        { word: 'happy', meaning: '幸せな', sentence: 'She felt happy after hearing the good news.' },
        { word: 'cloud', meaning: '雲', sentence: 'A white cloud floated across the blue sky.' },
        { word: 'music', meaning: '音楽', sentence: 'Listening to music helps me relax.' },
        { word: 'water', meaning: '水', sentence: 'Please drink plenty of water.' },
        { word: 'smile', meaning: '笑顔', sentence: 'Her warm smile made everyone feel welcome.' },
        { word: 'house', meaning: '家', sentence: 'They live in a beautiful house near the park.' },
        { word: 'bread', meaning: 'パン', sentence: 'The smell of fresh bread filled the kitchen.' },
        { word: 'train', meaning: '電車', sentence: 'We took the train to Tokyo.' },
        { word: 'beach', meaning: 'ビーチ', sentence: 'We spent the whole day at the beach.' }
      ],
      ai: [
        { word: 'prompt', meaning: '指示文', sentence: 'Write a clear prompt to get the best AI response.' },
        { word: 'generate', meaning: '生成する', sentence: 'The model can generate realistic images.' },
        { word: 'analyze', meaning: '分析する', sentence: 'We need to analyze the dataset for patterns.' },
        { word: 'model', meaning: 'モデル', sentence: 'The neural network model was trained on GPUs.' },
        { word: 'token', meaning: 'トークン', sentence: 'LLMs process text by breaking it into tokens.' },
        { word: 'dataset', meaning: 'データセット', sentence: 'A high-quality dataset is crucial for training.' },
        { word: 'network', meaning: 'ネットワーク', sentence: 'Deep neural networks mimic human brain structures.' },
        { word: 'weights', meaning: '重みパラメータ', sentence: 'Training adjusts the weights of the connections.' },
        { word: 'inference', meaning: '推論', sentence: 'Edge devices can run inference locally.' },
        { word: 'vector', meaning: 'ベクトル', sentence: 'Words are converted into high-dimensional vectors.' }
      ],
      custom: []
    };

    let currentMode = 'easy';
    let currentIndex = 0;
    let score = 0;
    let currentWordData = {};
    let weakPoints = [];
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    const wordContainer = document.getElementById('wordContainer');
    const wordMeaning = document.getElementById('wordMeaning');
    const wordSentence = document.getElementById('wordSentence');
    const wordInput = document.getElementById('wordInput');
    const scoreEl = document.getElementById('score');
    const progressBar = document.getElementById('progressBar');
    const categoryBadge = document.getElementById('categoryBadge');
    const feedbackIndicator = document.getElementById('feedbackIndicator');
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');

    document.addEventListener('DOMContentLoaded', () => {
      if (apiKey) apiKeyInput.value = apiKey;
      loadWord();
      wordInput.addEventListener('input', handleInput);
    });

    function setMode(mode) {
      currentMode = mode;
      currentIndex = 0;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.replace('bg-cyan-600', 'bg-slate-800');
        btn.classList.replace('text-white', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.replace('bg-slate-800', 'bg-cyan-600');
        activeBtn.classList.replace('text-slate-400', 'text-white');
      }
      loadWord();
    }

    function loadWord() {
      const list = DB[currentMode];
      if (!list || list.length === 0) {
        if (currentMode === 'custom') setMode('easy');
        return;
      }
      currentWordData = list[currentIndex % list.length];
      categoryBadge.textContent = currentMode;
      wordMeaning.textContent = currentWordData.meaning;
      wordSentence.textContent = currentWordData.sentence || '';
      wordInput.value = '';
      renderWordValidation('');
      updateProgress();
    }

    function renderWordValidation(typed) {
      const target = currentWordData.word;
      wordContainer.innerHTML = '';
      for (let i = 0; i < target.length; i++) {
        const span = document.createElement('span');
        span.textContent = target[i];
        if (i < typed.length) {
          if (typed[i] === target[i]) {
            span.className = 'text-cyan-400 border-b-2 border-cyan-400';
          } else {
            span.className = 'text-rose-500 border-b-2 border-rose-500 animate-pulse';
          }
        } else {
          span.className = 'text-slate-600 border-b-2 border-transparent';
        }
        wordContainer.appendChild(span);
      }
    }

    function handleInput(e) {
      const typed = e.target.value.toLowerCase().trim();
      const target = currentWordData.word.toLowerCase();
      renderWordValidation(typed);
      if (typed === '') {
        feedbackIndicator.className = 'absolute right-4 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-transparent';
      } else if (target.startsWith(typed)) {
        feedbackIndicator.className = 'absolute right-4 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50';
      } else {
        feedbackIndicator.className = 'absolute right-4 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-rose-500 shadow-lg shadow-rose-500/50';
        if (!weakPoints.includes(currentWordData.word)) weakPoints.push(currentWordData.word);
      }
      if (typed === target) {
        playSound('correct');
        score += 10;
        scoreEl.textContent = score;
        wordInput.classList.add('border-emerald-500', 'bg-emerald-950/20');
        setTimeout(() => {
          wordInput.classList.remove('border-emerald-500', 'bg-emerald-950/20');
          currentIndex++;
          loadWord();
        }, 200);
      }
    }

    function updateProgress() {
      const list = DB[currentMode];
      const percent = ((currentIndex % list.length) / list.length) * 100;
      progressBar.style.width = `${percent || 100}%`;
    }

    async function generateAIWeaknessWords() {
      if (!apiKey) {
        toggleModal(true);
        return;
      }
      const btn = document.getElementById('btn-weak');
      const originalContent = btn.innerHTML;
      btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>`;
      btn.disabled = true;
      const sourceWeakPoints = weakPoints.length > 0 ? weakPoints : ['prompt', 'inference', 'generate'];
      const prompt = `Based on the user's weak English words: ${JSON.stringify(sourceWeakPoints)}. Generate exactly 5 personalized practice words related to AI, technology, or daily life. Return ONLY a raw JSON array matching this schema: [{"word": "example", "meaning": "例", "sentence": "This is an example sentence."}]`;
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        let text = data.candidates[0].content.parts[0].text;
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const generatedWords = JSON.parse(text);
        if (Array.isArray(generatedWords) && generatedWords.length > 0) {
          DB.custom = generatedWords;
          setMode('custom');
          weakPoints = [];
        }
      } catch (err) {
        console.error("Gemini API Error:", err);
        playSound('error');
        alert("Failed to generate AI words. Please check your API key.");
      } finally {
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }
    }

    document.getElementById('settingsBtn').addEventListener('click', () => toggleModal(true));
    function toggleModal(show) {
      if (show) settingsModal.classList.remove('hidden');
      else settingsModal.classList.add('hidden');
    }
    function saveApiKey() {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      toggleModal(false);
    }
  </script>
</body>
</html>
