<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webアプリケーション 処理フロー解説</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-main: #d4d4d4;
            --accent: #007acc;
            --highlight: #4caf50;
            --code-bg: #1e1e1e;
            --code-keyword: #569cd6;
            --code-string: #ce9178;
            --code-comment: #6a9955;
            --code-func: #dcdcaa;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* 左側：フロー解説パネル */
        .description-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .flow-diagram {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #222;
            border-radius: 6px;
        }

        .flow-node {
            padding: 8px 12px;
            border-radius: 4px;
            border: 2px solid #555;
            font-size: 14px;
            color: #888;
            text-align: center;
            transition: all 0.3s;
        }

        .flow-node.active {
            border-color: var(--highlight);
            color: #fff;
            background-color: rgba(76, 175, 80, 0.2);
            font-weight: bold;
        }

        .step-title {
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .step-text {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            flex-grow: 1;
        }

        /* 右側：コード表示パネル */
        .code-panel {
            flex: 1.2;
            background-color: var(--code-bg);
            border-radius: 8px;
            border: 1px solid #444;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .code-header {
            color: #888;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 12px;
            text-transform: uppercase;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
        }

        .kw { color: var(--code-keyword); }
        .str { color: var(--code-string); }
        .com { color: var(--code-comment); }
        .fn { color: var(--code-func); }

        /* コントロール部分 */
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005f9e;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>処理フロー：フロントエンド(React) ⇔ バックエンド(Python) ⇔ API</h1>

    <div class="container">
        <div class="description-panel">
            <div class="flow-diagram">
                <div id="node-react" class="flow-node">React (ブラウザ)</div>
                <div id="node-network" class="flow-node">HTTP通信</div>
                <div id="node-python" class="flow-node">Python API</div>
                <div id="node-db" class="flow-node">Database</div>
                <div id="node-ai" class="flow-node">AI Studio</div>
            </div>
            
            <div id="step-title" class="step-title"></div>
            <div id="step-text" class="step-text"></div>
        </div>

        <div class="code-panel">
            <div id="code-header" class="code-header"></div>
            <pre id="code-content"></pre>
        </div>
    </div>

    <div class="controls">
        <button id="prev-btn" disabled>◀ 前の処理</button>
        <button id="next-btn">次の処理 ▶</button>
    </div>

<script>
    const steps = [
        {
            node: 'node-react',
            title: '1. フロントエンド：イベントの発火 (React/JSX)',
            text: 'ユーザーがブラウザ上でボタンをクリックした瞬間の処理です。\n\nReactコンポーネント内の onClick イベントが発火し、非同期関数 (async/await) が呼び出されます。\nまずは多重送信を防ぐために、UIのローディング状態を true に変更します。',
            file: 'Frontend: App.jsx',
            code: `<span class="kw">const</span> <span class="fn">handleGenerate</span> = <span class="kw">async</span> () => {\n  <span class="com">// ローディングUIを表示</span>\n  <span class="fn">setIsLoading</span>(<span class="kw">true</span>);\n  <span class="fn">setError</span>(<span class="kw">null</span>);\n\n  <span class="com">// 入力値の準備</span>\n  <span class="kw">const</span> payload = { prompt: inputText };\n\n  <span class="com">// 次の処理（fetch）へ進む...</span>\n};`
        },
        {
            node: 'node-network',
            title: '2. ネットワーク：HTTPリクエストの送信 (Fetch API)',
            text: 'フロントエンドから、バックエンド（Pythonサーバーなど）のエンドポイントに向けてデータを送信します。\n\nfetch APIなどを使い、JSON形式に文字列化 (JSON.stringify) したデータを POST メソッドで送ります。\nここで処理は一旦バックエンドに引き継がれ、React側はレスポンスが返ってくるのを待機 (await) します。',
            file: 'Frontend: App.jsx (fetch部分)',
            code: `<span class="kw">try</span> {\n  <span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">'/api/generate-idea'</span>, {\n    method: <span class="str">'POST'</span>,\n    headers: {\n      <span class="str">'Content-Type'</span>: <span class="str">'application/json'</span>\n    },\n    body: JSON.<span class="fn">stringify</span>(payload)\n  });\n\n  <span class="com">// バックエンドからの返答を待機中...</span>\n}`
        },
        {
            node: 'node-python',
            title: '3. バックエンド：リクエストの受信とルーティング (Python)',
            text: 'バックエンド（ここではFastAPIやFlaskなどを想定）がリクエストを受け取ります。\n\nURLのパス (\'/api/generate-idea\') に対応する関数が実行されます。\n送られてきたJSONデータを受け取り、不正な値が入っていないか（バリデーション）を確認します。',
            file: 'Backend: main.py (FastAPIの例)',
            code: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI, HTTPException\n<span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel\n\napp = <span class="fn">FastAPI</span>()\n\n<span class="kw">class</span> <span class="fn">IdeaRequest</span>(BaseModel):\n    prompt: <span class="kw">str</span>\n\n<span class="com"># エンドポイントの定義</span>\n@app.post(<span class="str">"/api/generate-idea"</span>)\n<span class="kw">async def</span> <span class="fn">generate_idea_route</span>(request: IdeaRequest):\n    user_prompt = request.prompt\n    <span class="kw">if not</span> user_prompt:\n        <span class="kw">raise</span> <span class="fn">HTTPException</span>(status_code=<span class="str">400</span>, detail=<span class="str">"Prompt is empty"</span>)\n        \n    <span class="com"># 次の処理へ...</span>`
        },
        {
            node: 'node-db',
            title: '4. データベース：履歴の保存や設定の読み込み (SQL)',
            text: '必要に応じて、データベースと通信を行います。\n\n例えば、「ユーザーが過去にどんなプロンプトを実行したか」をログとして記録 (INSERT) したり、「APIキー」や「ユーザー設定」を読み込んだり (SELECT) します。',
            file: 'Backend: main.py (Database処理)',
            code: `<span class="kw">import</span> sqlite3 <span class="com"># または Oracle, PostgreSQLなど</span>\n\n<span class="kw">def</span> <span class="fn">save_log_to_db</span>(prompt_text):\n    conn = sqlite3.<span class="fn">connect</span>(<span class="str">'app.db'</span>)\n    cursor = conn.<span class="fn">cursor</span>()\n    \n    <span class="com"># 実行履歴をDBに書き込む処理</span>\n    cursor.<span class="fn">execute</span>(\n        <span class="str">"INSERT INTO logs (prompt, created_at) VALUES (?, datetime('now'))"</span>,\n        (prompt_text,)\n    )\n    conn.<span class="fn">commit</span>()\n    conn.<span class="fn">close</span>()`
        },
        {
            node: 'node-ai',
            title: '5. 外部API：AIモデルの呼び出し (Google AI Studio)',
            text: 'バックエンドから、さらに外部のサービス（Google AI Studio など）のAPIを叩きます。\n\nSDK（ライブラリ）を使用して、AIモデルにプロンプトを渡し、処理結果が生成されるのを待ちます。重い処理は外部のサーバーに任せるのが現代のWebアプリの基本です。',
            file: 'Backend: ai_service.py',
            code: `<span class="kw">import</span> google.generativeai <span class="kw">as</span> genai\n<span class="kw">import</span> os\n\n<span class="fn">genai.configure</span>(api_key=os.environ[<span class="str">"GEMINI_API_KEY"</span>])\n\n<span class="kw">def</span> <span class="fn">call_gemini_api</span>(prompt_text):\n    <span class="com"># モデルの初期化</span>\n    model = genai.<span class="fn">GenerativeModel</span>(<span class="str">'gemini-1.5-pro'</span>)\n    \n    <span class="com"># AIにリクエストを送信し、結果を待つ</span>\n    response = model.<span class="fn">generate_content</span>(prompt_text)\n    \n    <span class="kw">return</span> response.text`
        },
        {
            node: 'node-python',
            title: '6. バックエンド：レスポンスの返却 (Python)',
            text: 'AIから結果を受け取ったバックエンドは、そのデータをフロントエンドが扱いやすい形（JSONなど）に整形し直します。\n\n成功を示すステータスコード（通常は200 OK）と共に、HTTPレスポンスとしてブラウザに送り返します。',
            file: 'Backend: main.py (レスポンス部分)',
            code: `    <span class="com"># Step 5の関数を呼び出し、結果を取得</span>\n    ai_result = <span class="fn">call_gemini_api</span>(user_prompt)\n    \n    <span class="com"># フロントエンドへJSON形式で結果を返す</span>\n    <span class="kw">return</span> {\n        <span class="str">"status"</span>: <span class="str">"success"</span>,\n        <span class="str">"data"</span>: {\n            <span class="str">"generated_text"</span>: ai_result\n        }\n    }`
        },
        {
            node: 'node-react',
            title: '7. フロントエンド：画面の更新 (React/JSX)',
            text: '待機していたフロントエンドの fetch 処理が完了し、データを受け取ります。\n\n受け取ったデータを元にReactの状態 (State) を更新します。\nStateが更新されると、Reactが自動的に再レンダリングを行い、画面上にAIの回答が表示されます。これで一連の処理が完了です。',
            file: 'Frontend: App.jsx (状態更新部分)',
            code: `  <span class="com">// Step 2の続き: レスポンスをJSONとして解釈</span>\n  <span class="kw">const</span> resultData = <span class="kw">await</span> response.<span class="fn">json</span>();\n\n  <span class="kw">if</span> (resultData.status === <span class="str">'success'</span>) {\n    <span class="com">// Stateを更新し、画面にテキストを表示</span>\n    <span class="fn">setResultText</span>(resultData.data.generated_text);\n  } <span class="kw">else</span> {\n    <span class="fn">setError</span>(<span class="str">'エラーが発生しました'</span>);\n  }\n} <span class="kw">catch</span> (err) {\n  <span class="fn">setError</span>(err.message);\n} <span class="kw">finally</span> {\n  <span class="com">// ローディングUIを消す</span>\n  <span class="fn">setIsLoading</span>(<span class="kw">false</span>);\n}`
        }
    ];

    let currentStep = 0;
    
    const elements = {
        react: document.getElementById('node-react'),
        network: document.getElementById('node-network'),
        python: document.getElementById('node-python'),
        db: document.getElementById('node-db'),
        ai: document.getElementById('node-ai'),
        title: document.getElementById('step-title'),
        text: document.getElementById('step-text'),
        codeHeader: document.getElementById('code-header'),
        codeContent: document.getElementById('code-content'),
        prevBtn: document.getElementById('prev-btn'),
        nextBtn: document.getElementById('next-btn')
    };

    function clearNodes() {
        ['react', 'network', 'python', 'db', 'ai'].forEach(id => {
            elements[id].classList.remove('active');
        });
    }

    function renderStep() {
        const step = steps[currentStep];
        
        clearNodes();
        if(elements[step.node.replace('node-', '')]) {
            elements[step.node.replace('node-', '')].classList.add('active');
        }

        elements.title.textContent = step.title;
        elements.text.textContent = step.text;
        elements.codeHeader.textContent = step.file;
        elements.codeContent.innerHTML = step.code;

        elements.prevBtn.disabled = currentStep === 0;
        elements.nextBtn.disabled = currentStep === steps.length - 1;
    }

    elements.prevBtn.addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            renderStep();
        }
    });

    elements.nextBtn.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderStep();
        }
    });

    // 初期描画
    renderStep();
</script>
</body>
</html>
