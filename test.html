<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Visualizer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }
        .glass-input:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
        @media (max-width: 640px) {
            .chart-container {
                height: 200px;
            }
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">
    <div class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center py-2">
            <div class="flex items-center space-x-2">
                <i data-lucide="layout-dashboard" class="text-indigo-400 w-6 h-6"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">AI Visualizer</h1>
                    <p class="text-[10px] text-slate-400">Glassmorphism Dashboard v1.0</p>
                </div>
            </div>
            <nav class="flex space-x-4">
                <button class="text-slate-400 hover:text-white transition-colors"><i data-lucide="bell" class="w-5 h-5"></i></button>
                <button class="text-slate-400 hover:text-white transition-colors"><i data-lucide="settings" class="w-5 h-5"></i></button>
            </nav>
        </header>

        <!-- Input Section -->
        <section class="glass rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="database" class="text-indigo-300 w-4 h-4"></i>
                    <h2 class="text-sm font-semibold text-indigo-300 tracking-wider uppercase">Data Input</h2>
                </div>
                <button onclick="loadSample()" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>サンプル読込
                </button>
            </div>
            
            <textarea id="jsonInput" oninput="autoUpdate()" class="w-full h-32 glass-input rounded-xl p-3 text-xs font-mono resize-none transition-all" placeholder="JSONデータを貼り付けてください..."></textarea>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] text-slate-400 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="key" class="w-3 h-3"></i>Gemini API Key
                    </label>
                    <input type="password" id="apiKey" class="w-full glass-input rounded-lg px-3 py-2 text-xs" placeholder="APIキーを入力">
                </div>
                <div class="flex items-end">
                    <button onclick="visualize()" class="w-full py-2 bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 text-white font-semibold rounded-xl text-sm transition-all duration-200 active:scale-[0.98] shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4"></i>分析を実行
                    </button>
                </div>
            </div>
        </section>

        <!-- Dashboard Output -->
        <main id="dashboard" class="space-y-6">
            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                    <i data-lucide="award" class="text-yellow-400 w-5 h-5 mb-1"></i>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Winner</span>
                    <p id="winnerName" class="text-sm font-bold text-white truncate w-full">-</p>
                </div>
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                    <i data-lucide="trending-up" class="text-rose-400 w-5 h-5 mb-1"></i>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Growth</span>
                    <p id="growthRate" class="text-sm font-bold text-rose-400">-</p>
                </div>
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                    <i data-lucide="dollar-sign" class="text-emerald-400 w-5 h-5 mb-1"></i>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Profit</span>
                    <p id="winnerProfit" class="text-sm font-bold text-emerald-400">-</p>
                </div>
                <div class="glass rounded-2xl p-4 flex flex-col items-center justify-center text-center">
                    <i data-lucide="activity" class="text-cyan-400 w-5 h-5 mb-1"></i>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">Status</span>
                    <p id="aiStatus" class="text-[10px] font-bold text-cyan-400">Ready</p>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="glass rounded-2xl p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="bar-chart-3" class="text-indigo-300 w-4 h-4"></i>
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Profit Comparison</h4>
                    </div>
                    <div class="flex bg-white/5 rounded-lg p-1">
                        <button onclick="toggleChartType('bar')" id="btnBar" class="px-3 py-1 text-[10px] rounded-md bg-indigo-500 text-white transition-all">Bar</button>
                        <button onclick="toggleChartType('line')" id="btnLine" class="px-3 py-1 text-[10px] rounded-md text-slate-400 hover:text-white transition-all">Line</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="profitChart"></canvas>
                </div>
            </div>

            <!-- AI Summary Card -->
            <div class="glass rounded-2xl p-5 space-y-3 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i data-lucide="sparkles" class="w-12 h-12 text-indigo-400"></i>
                </div>
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="brain-circuit" class="text-indigo-300 w-4 h-4"></i>
                        <h4 class="text-xs font-semibold text-indigo-300 uppercase tracking-wider">AI Executive Summary</h4>
                    </div>
                    <button onclick="exportData()" class="text-[10px] text-slate-400 hover:text-white flex items-center gap-1">
                        <i data-lucide="download" class="w-3 h-3"></i>Export
                    </button>
                </div>
                <div id="summaryContent" class="text-xs text-slate-200 leading-relaxed min-h-[60px]">
                    データを入力して「分析を実行」をクリックしてください。
                </div>
            </div>
            
            <!-- Reasoning Footer -->
            <div class="glass rounded-2xl p-4 flex items-start space-x-3">
                <i data-lucide="info" class="text-slate-400 w-4 h-4 mt-0.5"></i>
                <div>
                    <h5 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Reasoning Context</h5>
                    <p id="reasoningText" class="text-[11px] text-slate-400 italic">-</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let chartInstance = null;
        let currentChartType = 'bar';
        let currentData = null;

        const sampleData = {
            "alpha_profit": 2160000,
            "beta_profit": 1760000,
            "winner": "AlphaCorp",
            "q1_growth_rate": "12.5%",
            "reasoning": "Market expansion in APAC region and optimized supply chain costs."
        };

        // Initialize Lucide icons
        lucide.createIcons();

        function loadSample() {
            document.getElementById('jsonInput').value = JSON.stringify(sampleData, null, 2);
            visualize();
        }

        function autoUpdate() {
            const inputVal = document.getElementById('jsonInput').value.trim();
            if (!inputVal) return;
            try {
                const data = JSON.parse(inputVal);
                updateUI(data);
            } catch (e) {
                // Silent fail on partial JSON during typing
            }
        }

        async function visualize() {
            const inputVal = document.getElementById('jsonInput').value.trim();
            if (!inputVal) return alert('JSONデータを入力してください。');

            try {
                currentData = JSON.parse(inputVal);
                updateUI(currentData);
                await generateSummary(currentData);
            } catch (e) {
                return alert('JSONのパースに失敗しました。フォーマットを確認してください。');
            }
        }

        function updateUI(data) {
            document.getElementById('winnerName').innerText = data.winner || 'N/A';
            document.getElementById('growthRate').innerText = data.q1_growth_rate || 'N/A';
            document.getElementById('reasoningText').innerText = data.reasoning || 'N/A';

            const winnerKey = String(data.winner).toLowerCase().includes('alpha') ? 'alpha_profit' : 'beta_profit';
            const winnerProfitVal = data[winnerKey] || data.alpha_profit || data.beta_profit;
            document.getElementById('winnerProfit').innerText = winnerProfitVal ? `¥${Number(winnerProfitVal).toLocaleString()}` : 'N/A';

            renderChart(data.alpha_profit, data.beta_profit);
        }

        function toggleChartType(type) {
            currentChartType = type;
            const btnBar = document.getElementById('btnBar');
            const btnLine = document.getElementById('btnLine');
            
            if (type === 'bar') {
                btnBar.className = "px-3 py-1 text-[10px] rounded-md bg-indigo-500 text-white transition-all";
                btnLine.className = "px-3 py-1 text-[10px] rounded-md text-slate-400 hover:text-white transition-all";
            } else {
                btnLine.className = "px-3 py-1 text-[10px] rounded-md bg-indigo-500 text-white transition-all";
                btnBar.className = "px-3 py-1 text-[10px] rounded-md text-slate-400 hover:text-white transition-all";
            }
            
            if (currentData) {
                renderChart(currentData.alpha_profit, currentData.beta_profit);
            }
        }

        function renderChart(alpha, beta) {
            const ctx = document.getElementById('profitChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            const gradientIndigo = ctx.createLinearGradient(0, 0, 0, 400);
            gradientIndigo.addColorStop(0, 'rgba(99, 102, 241, 0.8)');
            gradientIndigo.addColorStop(1, 'rgba(99, 102, 241, 0.1)');

            const gradientCyan = ctx.createLinearGradient(0, 0, 0, 400);
            gradientCyan.addColorStop(0, 'rgba(6, 182, 212, 0.8)');
            gradientCyan.addColorStop(1, 'rgba(6, 182, 212, 0.1)');

            chartInstance = new Chart(ctx, {
                type: currentChartType,
                data: {
                    labels: ['AlphaCorp', 'BetaCorp'],
                    datasets: [{
                        label: 'Profit',
                        data: [alpha || 0, beta || 0],
                        backgroundColor: currentChartType === 'bar' ? [gradientIndigo, gradientCyan] : 'rgba(99, 102, 241, 0.2)',
                        borderColor: currentChartType === 'bar' ? ['#818cf8', '#22d3ee'] : '#818cf8',
                        borderWidth: 2,
                        borderRadius: 8,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#818cf8',
                            bodyColor: '#f8fafc',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: (context) => `¥${context.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#94a3b8', 
                                font: { size: 10 },
                                callback: (value) => `¥${(value / 1000000).toFixed(1)}M`
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        async function generateSummary(data) {
            const apiKey = document.getElementById('apiKey').value.trim();
            const summaryEl = document.getElementById('summaryContent');
            const statusEl = document.getElementById('aiStatus');

            if (!apiKey) {
                statusEl.innerText = "Local Engine";
                statusEl.className = "text-[10px] font-bold text-slate-400";
                
                const diff = Math.abs((data.alpha_profit || 0) - (data.beta_profit || 0));
                summaryEl.innerHTML = `
                    <div class="space-y-2">
                        <p><strong class="text-indigo-300">【簡易分析】</strong></p>
                        <p>現在の勝者は <span class="text-white font-bold">${data.winner || '未定'}</span> です。利益差額は <span class="text-emerald-400">¥${diff.toLocaleString()}</span> です。</p>
                        <p>成長率は「${data.q1_growth_rate || '不明'}」で、主な要因は「${data.reasoning || '記載なし'}」です。</p>
                        <p class="text-[10px] text-slate-500 mt-2 italic">* 詳細なAI分析にはGemini APIキーを設定してください。</p>
                    </div>
                `;
                return;
            }

            statusEl.innerText = "Gemini Processing";
            statusEl.className = "text-[10px] font-bold text-indigo-400 animate-pulse";
            summaryEl.innerHTML = `
                <div class="flex items-center gap-2 text-indigo-300">
                    <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
                    <span>AIがデータを分析中...</span>
                </div>
            `;
            lucide.createIcons();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `以下のJSONデータを分析し、ビジネスの総括と今後のアクションプランを、モバイル端末で読みやすいように簡潔な日本語の箇条書き（3項目程度）で出力してください。HTMLタグは使わず、Markdown形式の箇条書きで出力してください。\n\nJSON: ${JSON.stringify(data)}`
                            }]
                        }]
                    })
                });

                if (!response.ok) throw new Error('API request failed');
                const resData = await response.json();
                let aiResponse = resData?.candidates?.[0]?.content?.parts?.[0]?.text || "応答を解析できませんでした。";
                
                // Simple markdown-like formatter for the summary
                aiResponse = aiResponse.replace(/\n/g, '<br>').replace(/\* /g, '• ');
                summaryEl.innerHTML = `<div class="animate-in fade-in duration-500">${aiResponse}</div>`;
                
                statusEl.innerText = "Gemini 1.5 Flash";
                statusEl.className = "text-[10px] font-bold text-indigo-400";
            } catch (error) {
                console.error(error);
                summaryEl.innerText = "Gemini APIによる生成に失敗しました。キーまたはネットワークを確認してください。";
                statusEl.innerText = "API Error";
                statusEl.className = "text-[10px] font-bold text-rose-400";
            }
        }

        function exportData() {
            if (!currentData) return alert('エクスポートするデータがありません。');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "dashboard_data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        window.onload = loadSample;
    </script>
</body>
</html>
