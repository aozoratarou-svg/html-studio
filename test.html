<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }

  #ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(8, 12, 24, 0.75);
    border: 1px solid rgba(100, 180, 255, 0.2);
    border-radius: 40px;
    padding: 12px 26px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(60, 130, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    user-select: none;
  }

  #playBtn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(100, 180, 255, 0.5);
    background: rgba(60, 130, 255, 0.15);
    color: #88c8ff;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  #playBtn:hover {
    background: rgba(60, 130, 255, 0.3);
    border-color: rgba(100, 180, 255, 0.8);
  }

  .ui-label {
    color: rgba(140, 190, 255, 0.6);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #speedSlider {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(to right, rgba(60,130,255,0.8) 0%, rgba(60,130,255,0.8) var(--pct, 33%), rgba(255,255,255,0.12) var(--pct, 33%));
    outline: none;
    cursor: pointer;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #88c8ff;
    box-shadow: 0 0 6px rgba(100,180,255,0.8);
    cursor: pointer;
  }
  #speedSlider::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #88c8ff;
    border: none;
    cursor: pointer;
  }

  #speedVal {
    color: #88c8ff;
    font-size: 11px;
    min-width: 28px;
    text-align: right;
  }

  #info {
    position: fixed;
    top: 22px;
    left: 26px;
    color: rgba(140, 190, 255, 0.45);
    font-size: 10px;
    letter-spacing: 0.1em;
    line-height: 1.8;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="info">
  SOLAR SYSTEM · THREE.JS<br>
  DRAG TO ORBIT · SCROLL TO ZOOM
</div>

<div id="ui">
  <button id="playBtn">&#9646;&#9646;</button>
  <span class="ui-label">Speed</span>
  <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1.0">
  <span id="speedVal">1.0x</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── OrbitControls (inlined for r128 module compat) ──────────────────────────
class OrbitControls {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.enabled = true;
    this.target = new THREE.Vector3();
    this.minDistance = 5;
    this.maxDistance = 500;
    this.enableDamping = true;
    this.dampingFactor = 0.08;

    this._spherical = new THREE.Spherical().setFromVector3(
      camera.position.clone().sub(this.target)
    );
    this._sphericalDelta = new THREE.Spherical();
    this._scale = 1;
    this._rotateStart = new THREE.Vector2();
    this._rotating = false;

    const el = domElement;
    el.addEventListener('mousedown', e => this._onMouseDown(e));
    el.addEventListener('mousemove', e => this._onMouseMove(e));
    el.addEventListener('mouseup',   () => { this._rotating = false; });
    el.addEventListener('wheel',     e => this._onWheel(e), { passive: false });
    el.addEventListener('touchstart', e => this._onTouchStart(e), { passive: false });
    el.addEventListener('touchmove',  e => this._onTouchMove(e),  { passive: false });
    el.addEventListener('touchend',   () => { this._rotating = false; });
  }
  _onMouseDown(e) {
    this._rotating = true;
    this._rotateStart.set(e.clientX, e.clientY);
  }
  _onMouseMove(e) {
    if (!this._rotating || !this.enabled) return;
    const dx = e.clientX - this._rotateStart.x;
    const dy = e.clientY - this._rotateStart.y;
    this._rotateStart.set(e.clientX, e.clientY);
    this._sphericalDelta.theta -= (2 * Math.PI * dx) / this.domElement.clientWidth;
    this._sphericalDelta.phi   -= (2 * Math.PI * dy) / this.domElement.clientHeight;
  }
  _onWheel(e) {
    e.preventDefault();
    this._scale *= e.deltaY > 0 ? 1.1 : 0.9;
  }
  _onTouchStart(e) {
    if (e.touches.length === 1) {
      this._rotating = true;
      this._rotateStart.set(e.touches[0].clientX, e.touches[0].clientY);
    }
  }
  _onTouchMove(e) {
    if (!this._rotating || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - this._rotateStart.x;
    const dy = e.touches[0].clientY - this._rotateStart.y;
    this._rotateStart.set(e.touches[0].clientX, e.touches[0].clientY);
    this._sphericalDelta.theta -= (2 * Math.PI * dx) / this.domElement.clientWidth;
    this._sphericalDelta.phi   -= (2 * Math.PI * dy) / this.domElement.clientHeight;
  }
  update() {
    const offset = this.camera.position.clone().sub(this.target);
    this._spherical.setFromVector3(offset);

    if (this.enableDamping) {
      this._spherical.theta += this._sphericalDelta.theta * this.dampingFactor;
      this._spherical.phi   += this._sphericalDelta.phi   * this.dampingFactor;
      this._sphericalDelta.theta *= (1 - this.dampingFactor);
      this._sphericalDelta.phi   *= (1 - this.dampingFactor);
    } else {
      this._spherical.theta += this._sphericalDelta.theta;
      this._spherical.phi   += this._sphericalDelta.phi;
      this._sphericalDelta.set(0, 0, 0);
    }

    this._spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this._spherical.phi));
    this._spherical.radius *= this._scale;
    this._spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this._spherical.radius));
    this._scale = 1;

    offset.setFromSpherical(this._spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  }
}

// ── Scene setup ─────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 120);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.minDistance = 15;
controls.maxDistance = 400;

// ── Stars ────────────────────────────────────────────────────────────────────
(function buildStars() {
  const count = 4000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = THREE.MathUtils.randFloat(200, 900);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    sizes[i] = THREE.MathUtils.randFloat(0.5, 2.5);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    sizeAttenuation: false,
    size: 1.2,
    transparent: true,
    opacity: 0.85,
  });
  scene.add(new THREE.Points(geo, mat));
})();

// ── Lighting ─────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x111122, 0.4);
scene.add(ambientLight);

// Sun point light (illuminates planets)
const sunLight = new THREE.PointLight(0xfff4e0, 3.5, 600, 1.4);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// Directional for subtle fill
const dirLight = new THREE.DirectionalLight(0x334466, 0.3);
dirLight.position.set(-50, 80, -40);
scene.add(dirLight);

// ── Sun ──────────────────────────────────────────────────────────────────────
const sunGeo  = new THREE.SphereGeometry(6, 48, 48);
const sunMat  = new THREE.MeshBasicMaterial({ color: 0xffdd55 });
const sun     = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Sun glow (sprite halo)
const glowGeo = new THREE.SphereGeometry(7.5, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xff9900, transparent: true, opacity: 0.10, side: THREE.BackSide,
});
sun.add(new THREE.Mesh(glowGeo, glowMat));

// ── Helper: orbit ring ───────────────────────────────────────────────────────
function makeOrbitRing(radius, color = 0x334466, opacity = 0.35) {
  const pts = [];
  const segs = 128;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  return new THREE.LineLoop(geo, mat);
}

// ── Helper: planet ───────────────────────────────────────────────────────────
function makePlanet(radius, color, roughness = 0.7, metalness = 0.05) {
  const geo = new THREE.SphereGeometry(radius, 36, 36);
  const mat = new THREE.MeshStandardMaterial({ color, roughness, metalness });
  return new THREE.Mesh(geo, mat);
}

// ── Planet data ───────────────────────────────────────────────────────────────
const planetData = [
  { name: 'Mercury', r: 0.55, color: 0x9e8e7e, orbit: 14,  speed: 4.15,  tilt: 0.03 },
  { name: 'Venus',   r: 0.95, color: 0xe8c87a, orbit: 20,  speed: 1.62,  tilt: 177.4 * Math.PI/180 },
  { name: 'Earth',   r: 1.0,  color: 0x3a8fd1, orbit: 28,  speed: 1.0,   tilt: 23.4  * Math.PI/180 },
  { name: 'Mars',    r: 0.65, color: 0xc1440e, orbit: 37,  speed: 0.532, tilt: 25.2  * Math.PI/180 },
  { name: 'Jupiter', r: 2.8,  color: 0xc8a97a, orbit: 56,  speed: 0.084, tilt: 3.1   * Math.PI/180 },
  { name: 'Saturn',  r: 2.4,  color: 0xe0cc88, orbit: 74,  speed: 0.034, tilt: 26.7  * Math.PI/180, rings: true },
  { name: 'Uranus',  r: 1.6,  color: 0x7de8e8, orbit: 90,  speed: 0.012, tilt: 97.8  * Math.PI/180 },
  { name: 'Neptune', r: 1.5,  color: 0x3f54ba, orbit: 104, speed: 0.006, tilt: 28.3  * Math.PI/180 },
];

const planets = [];

for (const d of planetData) {
  // Orbit ring attached to scene
  scene.add(makeOrbitRing(d.orbit, 0x3a5080, 0.28));

  // Pivot at scene origin
  const pivot = new THREE.Object3D();
  scene.add(pivot);

  const mesh = makePlanet(d.r, d.color);
  mesh.rotation.z = d.tilt || 0;
  mesh.position.x = d.orbit;
  pivot.add(mesh);

  // Saturn rings
  if (d.rings) {
    const rGeo = new THREE.RingGeometry(d.r * 1.4, d.r * 2.4, 80);
    const rMat = new THREE.MeshBasicMaterial({
      color: 0xc8b07a, side: THREE.DoubleSide, transparent: true, opacity: 0.55,
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = Math.PI / 2.5;
    mesh.add(ring);
  }

  // Random start angle
  pivot.rotation.y = Math.random() * Math.PI * 2;

  planets.push({ pivot, mesh, speed: d.speed, name: d.name });
}

// ── Earth–Moon system ─────────────────────────────────────────────────────────
// Find Earth entry
const earthEntry = planets.find(p => p.name === 'Earth');
const earthMesh  = earthEntry.mesh;

// Moon pivot parented to Earth mesh
const moonPivot = new THREE.Object3D();
earthMesh.add(moonPivot);

const moonOrbitRadius = 3.2;
const moonMesh = makePlanet(0.27, 0xaaaaaa, 0.9, 0.0);
moonMesh.position.x = moonOrbitRadius;
moonPivot.add(moonMesh);

// Visible moon orbit ring (local to Earth)
const moonOrbitRing = makeOrbitRing(moonOrbitRadius, 0x445566, 0.5);
earthMesh.add(moonOrbitRing);

moonPivot.rotation.y = Math.random() * Math.PI * 2;
const moonSpeed = 13.37; // relative to Earth year

// ── UI controls ──────────────────────────────────────────────────────────────
let playing = true;
let speedMult = 1.0;
const BASE_SCALE = 0.0004; // base radians per ms

const playBtn     = document.getElementById('playBtn');
const speedSlider = document.getElementById('speedSlider');
const speedVal    = document.getElementById('speedVal');

function updateSliderBg() {
  const pct = ((speedSlider.value - speedSlider.min) / (speedSlider.max - speedSlider.min) * 100).toFixed(1);
  speedSlider.style.setProperty('--pct', pct + '%');
}
updateSliderBg();

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
});

speedSlider.addEventListener('input', () => {
  speedMult = parseFloat(speedSlider.value);
  speedVal.textContent = speedMult.toFixed(1) + 'x';
  updateSliderBg();
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Animate ───────────────────────────────────────────────────────────────────
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt  = now - lastTime;
  lastTime  = now;

  if (playing) {
    const delta = dt * BASE_SCALE * speedMult;

    // Planets revolve around Sun
    for (const p of planets) {
      p.pivot.rotation.y += delta * p.speed;
    }

    // Moon revolves around Earth (moonPivot is child of earthMesh)
    moonPivot.rotation.y += delta * moonSpeed;

    // Sun slow spin
    sun.rotation.y += delta * 0.05;
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
