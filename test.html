<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBアーキテクチャ・クエスト</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f380f;
            --text-color: #8bac0f;
            --accent-color: #306230;
            --border-color: #9bbc0f;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'DotGothic16', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-boy {
            background-color: #ddd;
            padding: 20px 20px 40px;
            border-radius: 10px 10px 40px 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 600px;
        }

        #screen {
            background-color: var(--bg-color);
            border: 8px solid #333;
            border-radius: 5px;
            padding: 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h1 {
            color: var(--border-color);
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            text-shadow: 2px 2px 0 var(--accent-color);
        }

        /* マップ（アーキテクチャ図）部分 */
        #map-area {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .node {
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 14px;
            padding: 5px;
            background-color: var(--bg-color);
            transition: all 0.3s;
        }

        .node.active {
            border-color: var(--border-color);
            color: var(--bg-color);
            background-color: var(--border-color);
            box-shadow: 0 0 10px var(--border-color);
            font-weight: bold;
        }

        .node span {
            font-size: 10px;
            margin-top: 5px;
        }

        #node-front { grid-column: 1; grid-row: 1 / 3; }
        #node-api { grid-column: 2; grid-row: 1; }
        #node-db { grid-column: 3; grid-row: 1; }
        #node-ai { grid-column: 3; grid-row: 2; }

        /* メッセージウィンドウ */
        #dialog-box {
            border: 4px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--border-color);
            padding: 15px;
            height: 120px;
            border-radius: 4px;
            position: relative;
        }

        #dialog-text {
            margin: 0;
            line-height: 1.5;
            font-size: 16px;
            white-space: pre-wrap;
        }

        /* ボタン */
        #controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        button {
            background-color: var(--bg-color);
            color: var(--border-color);
            border: 2px solid var(--border-color);
            font-family: inherit;
            font-size: 16px;
            padding: 8px 16px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--border-color);
            color: var(--bg-color);
        }

        /* ピクセル風の点滅カーソル */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 16px;
            background-color: var(--border-color);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-boy">
    <div id="screen">
        <h1>WEBｱｰｷﾃｸﾁｬ･ｸｴｽﾄ</h1>
        
        <div id="map-area">
            <div id="node-front" class="node">
                <div>[客席/ﾌﾛﾝﾄ]</div>
                <span>React / JSX<br>(Vite)</span>
            </div>
            <div id="node-api" class="node">
                <div>[厨房/ﾊﾞｯｸ]</div>
                <span>Python<br>Node.js</span>
            </div>
            <div id="node-db" class="node">
                <div>[超高級冷凍庫]</div>
                <span>Oracle DB<br>PostgreSQL</span>
            </div>
            <div id="node-ai" class="node">
                <div>[AI専門家]</div>
                <span>Google AI<br>Studio</span>
            </div>
        </div>

        <div id="dialog-box">
            <p id="dialog-text"></p>
            <span class="cursor" id="cursor" style="display: none;"></span>
        </div>
    </div>
    <div id="controls">
        <button id="next-btn">▼ つぎへ (A)</button>
    </div>
</div>

<script>
    // クエストのシナリオ（データの流れ）
    const scenario = [
        {
            nodeId: null,
            text: "AIスマートレストランへ ようこそ！\n「要約して」と入力して送信ボタンを 押した。\nデータの旅が はじまる！"
        },
        {
            nodeId: "node-front",
            text: "【Step 1: フロントエンド】\nReact/JSXが クリックを検知した！\n入力データをJSON（注文書）に変換した。"
        },
        {
            nodeId: "node-front",
            text: "【Step 2: ネットワーク通信】\n注文書が REST APIという名の\n配膳ロボットに乗って 厨房へ向かう！\n(ﾋﾟｺｰﾝ!)"
        },
        {
            nodeId: "node-api",
            text: "【Step 3: バックエンド】\n厨房の料理長（Python）が 注文を受付！\n「この注文は正しいな！」"
        },
        {
            nodeId: "node-db",
            text: "【Step 4: データベース】\n料理長は 超高級冷凍庫(Oracle)に\n過去のデータを 取りに行った。\nデータが 壊れずに取り出せた！"
        },
        {
            nodeId: "node-ai",
            text: "【Step 5: 外部API (AIモデル)】\n「要約はワシには無理じゃ！」\n料理長は 外部の専門家(Google AI Studio)に\n電話で 処理を外注した！"
        },
        {
            nodeId: "node-api",
            text: "【Step 6: レスポンス】\n専門家から 要約結果が返ってきた！\n料理長は データを綺麗に盛り付け直し\nステータス200(OK)と共に 客席へ返却した！"
        },
        {
            nodeId: "node-front",
            text: "【Step 7: 画面更新】\nViteで最適化されたフロントエンドが\n瞬時に 画面を書き換えた！\n\n「お待たせしました！」\nクエスト・クリア！"
        }
    ];

    let currentStep = 0;
    let isTyping = false;
    const dialogText = document.getElementById("dialog-text");
    const cursor = document.getElementById("cursor");
    const nextBtn = document.getElementById("next-btn");

    // 全ノードのアクティブ状態を解除する関数
    function clearNodes() {
        document.querySelectorAll('.node').forEach(node => {
            node.classList.remove('active');
        });
    }

    // 文字送りアニメーション（タイプライター効果）
    function typeWriter(text, i, callback) {
        if (i < text.length) {
            dialogText.innerHTML = text.substring(0, i + 1).replace(/\n/g, '<br>');
            setTimeout(() => typeWriter(text, i + 1, callback), 30); // 表示スピード
        } else {
            callback();
        }
    }

    // シナリオを1つ進める関数
    function advanceScenario() {
        if (isTyping) return; // 文字送り中は無視

        if (currentStep >= scenario.length) {
            currentStep = 0; // 最後まで行ったらループ
        }

        const stepData = scenario[currentStep];
        
        // 画面のノードをハイライト
        clearNodes();
        if (stepData.nodeId) {
            document.getElementById(stepData.nodeId).classList.add('active');
        }

        // テキスト表示
        dialogText.innerHTML = "";
        cursor.style.display = "none";
        isTyping = true;
        nextBtn.style.opacity = "0.5";

        typeWriter(stepData.text, 0, () => {
            isTyping = false;
            cursor.style.display = "inline-block";
            nextBtn.style.opacity = "1";
            currentStep++;
            
            if(currentStep >= scenario.length) {
                nextBtn.innerText = "■ はじめから";
            } else {
                nextBtn.innerText = "▼ つぎへ (A)";
            }
        });
    }

    // 初期化とイベントリスナー設定
    nextBtn.addEventListener('click', advanceScenario);
    
    // 最初のステップを表示
    advanceScenario();

</script>
</body>
</html>
