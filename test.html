<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HTML STUDIO">
    
    <title>8-BIT HTML STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #e52521;
            --link-color: #0055aa;
            --code-color: #33ff33;
            --border-style: 4px solid #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DotGothic16', sans-serif;
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)) 10px;
            box-sizing: border-box;
            overscroll-behavior-y: none;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-shadow: 2px 2px 0 #fff;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: var(--border-style);
            font-family: 'DotGothic16', sans-serif;
            padding: 10px 5px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px #888;
        }

        .tab-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .panel {
            display: none;
            border: var(--border-style);
            padding: 10px;
            margin-bottom: 15px;
            height: 40vh;
            box-sizing: border-box;
        }

        .panel.active {
            display: flex;
            flex-direction: column;
        }

        #panel-config.active {
            overflow-y: auto;
        }

        .editor-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .tool-btn {
            background-color: #444;
            color: var(--text-color);
            border: 2px solid #fff;
            font-family: 'DotGothic16', sans-serif;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tool-btn:active {
            background-color: #666;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background-color: var(--bg-color);
            color: var(--code-color);
            border: none;
            font-family: 'DotGothic16', monospace;
            font-size: 1rem;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            flex-grow: 1;
            background-color: #fff;
            border: none;
        }

        iframe:fullscreen {
            width: 100vw;
            height: 100vh;
            background-color: #fff;
        }

        .config-item {
            margin-bottom: 15px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 5px;
        }

        .config-item input, .custom-file-input {
            width: 100%;
            padding: 8px;
            background-color: #222;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'DotGothic16', sans-serif;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .action-row {
            display: flex;
            gap: 5px;
            align-items: stretch;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: var(--border-style);
            font-family: 'DotGothic16', sans-serif;
            padding: 10px 5px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #888;
            flex: 2;
        }

        .action-btn.link-btn {
            background-color: var(--link-color);
            flex: 1;
        }

        .action-btn:active {
            box-shadow: inset 4px 4px 0px #888;
            transform: translate(2px, 2px);
        }

        .system-msg {
            color: yellow;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .section-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        /* 👑 ファイルリスト用の新スタイル */
        .file-list-container {
            border: 2px dashed #fff;
            padding: 8px;
            background-color: #111;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-link {
            color: var(--code-color);
            text-decoration: none;
            cursor: pointer;
        }

        .file-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <h1>HTML STUDIO</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('edit')">🔨つくる</button>
        <button class="tab-btn" onclick="switchTab('preview')">👁みる</button>
        <button class="tab-btn" onclick="switchTab('config')">⚙️せってい</button>
    </div>

    <div id="panel-edit" class="panel active">
        <div class="editor-toolbar">
            <button class="tool-btn" onclick="clearEditor()">🗑️ クリア</button>
        </div>
        <textarea id="code-editor" placeholder="ここに HTML を にゅうりょく してね！"></textarea>
    </div>

    <div id="panel-preview" class="panel">
        <div class="editor-toolbar">
            <button id="fullscreen-btn" class="tool-btn" onclick="toggleFullscreen()">🖥️ ぜんがめん</button>
        </div>
        <iframe id="preview-frame"></iframe>
    </div>

    <div id="panel-config" class="panel">
        <div class="config-item">
            <label>GITHUB トークン (PAT)</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxx...">
        </div>
        <div class="config-item">
            <label>ユーザー名 (Owner)</label>
            <input type="text" id="gh-owner" placeholder="例: octocat">
        </div>
        <div class="config-item">
            <label>リポジトリ名 (Repo)</label>
            <input type="text" id="gh-repo" placeholder="例: my-website">
        </div>
        <p class="system-msg">※にゅうりょくした じょうほうは ブラウザに ほぞん されます。</p>
    </div>

    <div class="actions">
        <div class="action-row">
            <button class="action-btn" onclick="saveToGitHub('test.html')">💾 TESTセーブ</button>
            <button class="action-btn link-btn" onclick="openPage('test.html')">🌍 ひらく</button>
        </div>

        <div>
            <div class="section-label">▼ ほんばん用 (なまえをきめる)</div>
            <input type="text" id="custom-filename" class="custom-file-input" placeholder="例: app1.html または tool/index.html" style="margin-bottom: 5px;">
            <div class="action-row">
                <button class="action-btn" onclick="saveCustom()">💾 セーブ</button>
                <button class="action-btn link-btn" onclick="openCustom()">🌍 ひらく</button>
            </div>
        </div>

        <div>
            <div class="section-label">▼ ページをえらんでひらく</div>
            <button class="tool-btn" style="width: 100%; padding: 8px; font-size: 1rem; margin-bottom: 5px; background-color: #222;" onclick="fetchGitHubFiles()">🔄 リストをこうしん</button>
            <div id="file-list" class="file-list-container">
                <div style="color: #888; text-align: center; font-size: 0.8rem; padding: 10px;">「こうしん」ボタンを おしてね</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('gh-token').value = localStorage.getItem('ghToken') || '';
            document.getElementById('gh-owner').value = localStorage.getItem('ghOwner') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('ghRepo') || '';
            document.getElementById('code-editor').value = localStorage.getItem('savedCode') || '';
            document.getElementById('custom-filename').value = localStorage.getItem('lastCustomFile') || '';
        });

        document.getElementById('gh-token').addEventListener('input', (e) => localStorage.setItem('ghToken', e.target.value));
        document.getElementById('gh-owner').addEventListener('input', (e) => localStorage.setItem('ghOwner', e.target.value));
        document.getElementById('gh-repo').addEventListener('input', (e) => localStorage.setItem('ghRepo', e.target.value));
        document.getElementById('code-editor').addEventListener('input', (e) => localStorage.setItem('savedCode', e.target.value));
        document.getElementById('custom-filename').addEventListener('input', (e) => localStorage.setItem('lastCustomFile', e.target.value));

        function clearEditor() {
            if(confirm('かきかけの コードを ぜんぶ けしますか？')) {
                document.getElementById('code-editor').value = '';
                localStorage.setItem('savedCode', '');
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            
            if (tabName === 'edit') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('panel-edit').classList.add('active');
            } else if (tabName === 'preview') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('panel-preview').classList.add('active');
                
                const code = document.getElementById('code-editor').value;
                document.getElementById('preview-frame').srcdoc = code;
            } else if (tabName === 'config') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('panel-config').classList.add('active');
            }
        }

        // 🖥️ 全画面モード（トグル対応に強化）
        function toggleFullscreen() {
            const iframe = document.getElementById('preview-frame');
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) {
                    iframe.webkitRequestFullscreen();
                }
            } else {
                // すでに全画面なら解除する
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // 全画面の状態変化を検知してボタンのテキストを自動で切り替える
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        function updateFullscreenButton() {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                btn.innerHTML = '❌ もどる';
            } else {
                btn.innerHTML = '🖥️ ぜんがめん';
            }
        }

        // 👑 GitHubからルート階層と test/ 下のHTML一覧を取得する関数
        async function fetchGitHubFiles() {
            const token = document.getElementById('gh-token').value;
            const owner = document.getElementById('gh-owner').value;
            const repo = document.getElementById('gh-repo').value;
            const listContainer = document.getElementById('file-list');

            if(!token || !owner || !repo) {
                alert('【エラー】\n「⚙️せってい」から GitHubの じょうほうを にゅうりょく してね！');
                return;
            }

            listContainer.innerHTML = '<div style="color: #aaa; text-align: center; font-size: 0.8rem; padding: 10px;">取得中...</div>';

            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            };

            try {
                let files = [];

                // 1. ルート階層を取得
                const rootRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`, { headers });
                if (rootRes.ok) {
                    const rootData = await rootRes.json();
                    // ルートにあるHTMLファイルを抽出
                    rootData.forEach(item => {
                        if (item.type === 'file' && item.name.endsWith('.html')) {
                            files.push(item.path);
                        }
                    });
                }

                // 2. test/ 階層を取得
                const testRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/test`, { headers });
                if (testRes.ok) {
                    const testData = await testRes.json();
                    // test下のHTMLファイルを抽出
                    testData.forEach(item => {
                        if (item.type === 'file' && item.name.endsWith('.html')) {
                            files.push(item.path);
                        }
                    });
                }

                // リスト画面の構築
                if (files.length === 0) {
                    listContainer.innerHTML = '<div style="color: #888; text-align: center; font-size: 0.8rem; padding: 10px;">HTMLファイルが見つかりません</div>';
                    return;
                }

                listContainer.innerHTML = ''; // クリア
                files.forEach(path => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'file-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-link';
                    nameSpan.textContent = `📄 ${path}`;
                    // タップしたら直接そのPagesのURLを開く
                    nameSpan.onclick = () => openPage(path);

                    itemDiv.appendChild(nameSpan);
                    listContainer.appendChild(itemDiv);
                });

            } catch (error) {
                listContainer.innerHTML = '<div style="color: red; text-align: center; font-size: 0.8rem; padding: 10px;">エラーが発生しました</div>';
                alert(`【エラー】リストの取得に失敗しました。\n${error}`);
            }
        }

        function openCustom() {
            let filename = document.getElementById('custom-filename').value.trim();
            if(!filename) {
                alert('【エラー】\nファイルめいを にゅうりょく してね！');
                return;
            }
            openPage(filename);
        }

        function saveCustom() {
            let filename = document.getElementById('custom-filename').value.trim();
            if(!filename) {
                alert('【エラー】\nファイルめいを にゅうりょく してね！');
                return;
            }
            saveToGitHub(filename);
        }

        function openPage(filename) {
            const owner = document.getElementById('gh-owner').value;
            const repo = document.getElementById('gh-repo').value;
            
            if(!owner || !repo) {
                alert('【エラー】\n「⚙️せってい」で ユーザー名と リポジトリ名を いれてね！');
                return;
            }

            const url = `https://${owner}.github.io/${repo}/${filename}`;
            window.open(url, '_blank');
        }

        async function saveToGitHub(filename) {
            const token = document.getElementById('gh-token').value;
            const owner = document.getElementById('gh-owner').value;
            const repo = document.getElementById('gh-repo').value;
            const content = document.getElementById('code-editor').value;

            if(!token || !owner || !repo) {
                alert('【エラー】\n「⚙️せってい」から GitHubの じょうほうを にゅうりょく してね！');
                return;
            }

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filename}`;
            
            const bytes = new TextEncoder().encode(content);
            const encodedContent = btoa(String.fromCharCode(...bytes));

            try {
                let sha = null;
                const getRes = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                }

                const body = {
                    message: `📝 ${filename} を更新 (via 8-BIT STUDIO)`,
                    content: encodedContent
                };
                if (sha) {
                    body.sha = sha;
                }

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (putRes.ok) {
                    alert(`【せいこう！】\n${filename} に セーブ しました。\nすこし まってから「🌍 ひらく」ボタンを おしてね！`);
                    // セーブ成功時に自動でリストを再更新すると便利なので追記
                    fetchGitHubFiles();
                } else {
                    const errData = await putRes.json();
                    alert(`【エラー！】\nセーブに しっぱい しました。\nりゆう: ${errData.message}`);
                }
            } catch (error) {
                alert(`【つうしんエラー！】\nネットワークを かくにん してね。\n${error}`);
            }
        }
    </script>
</body>
</html>
