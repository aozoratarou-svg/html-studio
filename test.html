<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELIO</title>
<style>
body { margin:0; background:#000; overflow:hidden; font-family:sans-serif; }
canvas { display:block; }
#ui { position:fixed; top:20px; left:20px; color:#fff; pointer-events:none; }
</style>
</head>
<body>
<div id="ui"><h3>HELIO · Initializing...</h3></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
window.onload = () => {
    const ui = document.getElementById('ui');
    ui.innerHTML = "<h3>HELIO · Orbiting</h3>";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Sun
    const sunGeo = new THREE.SphereGeometry(2, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({color: 0xffcc00});
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Planet
    const earthGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const earthMat = new THREE.MeshBasicMaterial({color: 0x2288ff});
    const earth = new THREE.Mesh(earthGeo, earthMat);
    scene.add(earth);

    camera.position.z = 10;

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.02;
        earth.position.x = Math.cos(time) * 5;
        earth.position.z = Math.sin(time) * 5;
        renderer.render(scene, camera);
    }
    animate();
};
</script>
</body>
</html>
