<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origami Globe Transformation</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- D3.js and TopoJSON for real geographic data -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Floating UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            z-index: 50;
            /* Flex layout to keep it structured */
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            max-height: calc(100vh - 40px);
        }
        
        /* Custom styling for the range slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; cursor: pointer; margin-top: -5px; }
        #timeline-slider-pop::-webkit-slider-thumb { background: #38bdf8; }
        #timeline-slider-mig::-webkit-slider-thumb { background: #10b981; }
        #wireframe-slider::-webkit-slider-thumb { background: #94a3b8; }
        
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }
        
        .active-btn { background-color: #2563eb !important; color: white !important; border-color: #3b82f6 !important; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
        .tab-active { border-bottom-width: 2px; color: #fff !important; }
        #tab-pop.tab-active { border-color: #38bdf8; }
        #tab-mig.tab-active { border-color: #10b981; }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Floating Draggable UI Panel -->
    <div id="ui-panel" class="bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-xl shadow-2xl text-slate-200">
        
        <!-- Drag Handle -->
        <div id="ui-drag-handle" class="bg-slate-800 rounded-t-xl p-3 cursor-grab active:cursor-grabbing flex justify-center items-center border-b border-slate-700 select-none">
            <div class="w-12 h-1.5 bg-slate-500 rounded-full"></div>
        </div>
        
        <div class="p-4 space-y-4 overflow-y-auto custom-scrollbar">
            <div class="text-center">
                <h1 class="text-base font-bold text-white tracking-wider">折り紙地球儀シミュレーター</h1>
                <p class="text-[10px] text-slate-400 mt-1">平面地図が立体へと変形する幾何学プロセス</p>
            </div>

            <!-- Global Transform Controls -->
            <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                <label class="text-[11px] font-bold text-slate-400 mb-2 block">🌍 空間変形コントロール</label>
                <div class="grid grid-cols-4 gap-1 mb-2">
                    <button class="state-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded py-1 text-[10px] font-bold" data-target="0">平面</button>
                    <button class="state-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded py-1 text-[10px] font-bold" data-target="1">分割</button>
                    <button class="state-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded py-1 text-[10px] font-bold" data-target="2">折畳</button>
                    <button class="state-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded py-1 text-[10px] font-bold" data-target="3">立体</button>
                </div>
                <button id="play-btn" class="w-full bg-slate-700 hover:bg-slate-600 rounded py-1.5 text-xs font-bold transition-colors">
                    <span id="play-icon">▶</span> <span id="play-text">変形アニメーション再生</span>
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-700 text-xs">
               <button id="tab-pop" class="flex-1 py-2 text-slate-400 hover:text-white font-bold transition-colors tab-active">人口偏移<br><span class="text-[9px] font-normal">0年〜2026年</span></button>
               <button id="tab-mig" class="flex-1 py-2 text-slate-400 hover:text-white font-bold transition-colors">人類拡散<br><span class="text-[9px] font-normal">約32万年前〜太古</span></button>
            </div>

            <!-- Tab 1: Population Timeline -->
            <div id="panel-pop" class="space-y-3">
                <div class="flex justify-between items-end">
                    <label class="text-[11px] font-bold text-slate-400">年代 (人口)</label>
                    <span id="year-display-pop" class="text-sky-400 font-bold text-lg">0年</span>
                </div>
                <input type="range" id="timeline-slider-pop" min="0" max="2026" step="1" value="0" class="w-full">
                <button id="timeline-play-btn-pop" class="w-full bg-sky-600 hover:bg-sky-500 rounded py-2 text-xs font-bold shadow-[0_0_10px_rgba(2,132,199,0.5)] transition-all">▶ 人口推移を再生</button>
            </div>

            <!-- Tab 2: Migration Timeline -->
            <div id="panel-mig" class="space-y-3 hidden">
                <div class="flex justify-between items-end">
                    <label class="text-[11px] font-bold text-slate-400">年代 (人類史)</label>
                    <span id="year-display-mig" class="text-emerald-400 font-bold text-base">約31.5万年前</span>
                </div>
                <input type="range" id="timeline-slider-mig" min="-320000" max="0" step="1000" value="-315000" class="w-full">
                <button id="timeline-play-btn-mig" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded py-2 text-xs font-bold shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all">▶ 拡散の歴史を再生</button>
                <div id="mig-event-desc" class="text-[11px] text-slate-300 leading-tight mt-2 min-h-[3.5rem] bg-slate-800 border border-slate-700 p-2 rounded flex items-center justify-center text-center">
                    スライダーを動かすと、人類拡散の軌跡が表示されます。
                </div>
            </div>

            <!-- Settings -->
            <div class="border-t border-slate-700 pt-3 space-y-3">
                <div class="flex items-center gap-3">
                    <label class="text-[11px] font-bold text-slate-400 whitespace-nowrap">ワイヤー濃度</label>
                    <input type="range" id="wireframe-slider" min="0" max="1" step="0.01" value="0.8" class="w-full">
                </div>
                <div class="flex items-center justify-between pb-1">
                    <label class="text-[11px] font-bold text-slate-400 whitespace-nowrap">自動回転 (3D表示時)</label>
                    <button id="toggle-rotate-btn" class="bg-sky-600 hover:bg-sky-500 rounded px-4 py-1 text-[10px] font-bold transition-colors w-16 text-center shadow-[0_0_8px_rgba(2,132,199,0.5)]">ON</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- UI Drag Logic ---
        const uiPanel = document.getElementById('ui-panel');
        const dragHandle = document.getElementById('ui-drag-handle');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        function dragStart(e) {
            isDragging = true;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            const rect = uiPanel.getBoundingClientRect();
            startX = clientX;
            startY = clientY;
            initialLeft = rect.left;
            initialTop = rect.top;
            
            uiPanel.style.bottom = 'auto';
            uiPanel.style.right = 'auto';
            uiPanel.style.left = initialLeft + 'px';
            uiPanel.style.top = initialTop + 'px';
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            const dx = clientX - startX;
            const dy = clientY - startY;
            
            // Boundary constraints
            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;
            const maxLeft = window.innerWidth - uiPanel.offsetWidth;
            const maxTop = window.innerHeight - uiPanel.offsetHeight;
            
            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));

            uiPanel.style.left = newLeft + 'px';
            uiPanel.style.top = newTop + 'px';
        }

        function dragEnd() {
            isDragging = false;
        }

        dragHandle.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove, {passive: false});
        document.addEventListener('mouseup', dragEnd);
        dragHandle.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('touchmove', dragMove, {passive: false});
        document.addEventListener('touchend', dragEnd);

        // --- 1. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -15, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 1.0;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 40);
        scene.add(dirLight);

        // --- 2. Texture Generation (Real Map Data via D3 & TopoJSON) ---
        const canvas = document.createElement('canvas');
        canvas.width = 2048; 
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        
        const mapTexture = new THREE.CanvasTexture(canvas);
        mapTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        function drawBaseGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(71, 85, 105, 0.5)';
            ctx.lineWidth = 1.5;
            for(let i=0; i<=18; i++) { 
                ctx.beginPath(); ctx.moveTo(0, i*(canvas.height/18)); ctx.lineTo(canvas.width, i*(canvas.height/18)); ctx.stroke();
            }
            for(let i=0; i<=36; i++) { 
                ctx.beginPath(); ctx.moveTo(i*(canvas.width/36), 0); ctx.lineTo(i*(canvas.width/36), canvas.height); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
            ctx.setLineDash([]); 
            mapTexture.needsUpdate = true;
        }

        function loadRealMapData() {
            fetch('https://unpkg.com/world-atlas@2.0.2/countries-50m.json')
                .then(response => response.json())
                .then(world => {
                    const geojson = topojson.feature(world, world.objects.countries);
                    const projection = d3.geoEquirectangular()
                        .scale(canvas.width / (2 * Math.PI))
                        .translate([canvas.width / 2, canvas.height / 2])
                        .rotate([-150, 0, 0]); // 日本中心（東経150度）に回転
                    const path = d3.geoPath().projection(projection).context(ctx);

                    ctx.strokeStyle = '#38bdf8'; 
                    ctx.lineWidth = 2.0;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    ctx.beginPath(); path(geojson); ctx.stroke();
                    mapTexture.needsUpdate = true;
                })
                .catch(err => console.error("Map loading failed:", err));
        }

        drawBaseGrid();
        loadRealMapData();

        // --- 2.5 Data Definitions ---
        // Population Data (0 - 2026)
        const popRawData = [
            {"name": "中国", "lat": 35.8617, "lon": 104.1954, "data": {1000: 59000, 1500: 103000, 1800: 329000, 1900: 400000, 1950: 543979, 1970: 822534, 1990: 1153704, 2000: 1264099, 2010: 1348191, 2020: 1424930, 2026: 1412000}},
            {"name": "インド", "lat": 20.5937, "lon": 78.9629, "data": {1000: 75000, 1500: 110000, 1800: 200000, 1900: 284500, 1950: 376325, 1970: 557501, 1990: 870452, 2000: 1059634, 2010: 1240614, 2020: 1396387, 2026: 1441000}},
            {"name": "インドネシア", "lat": -0.7893, "lon": 113.9213, "data": {1000: 5000, 1500: 10700, 1800: 16000, 1900: 42700, 1950: 69568, 1970: 115228, 1990: 181437, 2000: 211540, 2010: 239871, 2020: 271858, 2026: 281000}},
            {"name": "アメリカ合衆国", "lat": 37.0902, "lon": -95.7129, "data": {1000: 2000, 1500: 3000, 1800: 6800, 1900: 76212, 1950: 158804, 1970: 200328, 1990: 248084, 2000: 282399, 2010: 310384, 2020: 335942, 2026: 344000}},
            {"name": "日本", "lat": 36.2048, "lon": 138.2529, "data": {1000: 7500, 1500: 15400, 1800: 30000, 1900: 43847, 1950: 82199, 1970: 104345, 1990: 123537, 2000: 126843, 2010: 128057, 2020: 126264, 2026: 123500}},
            {"name": "ナイジェリア", "lat": 9.0820, "lon": 8.6753, "data": {1000: 1500, 1500: 3000, 1800: 9000, 1900: 16000, 1950: 37860, 1970: 55981, 1990: 95212, 2000: 122283, 2010: 158423, 2020: 208327, 2026: 235000}},
            {"name": "ローマ帝国", "lat": 41.9028, "lon": 12.4964, "data": {164: 75000}},
            {"name": "漢王朝", "lat": 34.2667, "lon": 108.9000, "data": {150: 60000}},
            {"name": "モンゴル帝国", "lat": 47.2000, "lon": 102.8333, "data": {1290: 110000}},
            {"name": "大英帝国", "lat": 51.5074, "lon": -0.1278, "data": {1900: 380000}},
            {"name": "ソビエト連邦", "lat": 60.0000, "lon": 90.0000, "data": {1950: 180013, 1970: 242761, 1990: 288624}}
            // (一部抜粋表示。必要に応じてもとの全件を維持できます)
        ];

        // Human Migration Data (-315,000 to -3,000)
        const migrationRawData = [
            { name: "初期ホモ・サピエンス", lat: 31.85, lon: -8.87, year: -315000, desc: "モロッコ・ジェベル・イルード。現生人類の最古の痕跡とされる。" },
            { name: "汎アフリカ的進化", lat: 5.4, lon: 35.9, year: -195000, desc: "エチオピア・オモ・キビシュ。アフリカ全土で進化と交雑が進む。" },
            { name: "初期の進出 (北回り)", lat: 36.6, lon: 22.3, year: -210000, desc: "ギリシャ・アピディマ洞窟。一時的な進出で後に絶滅した系統。" },
            { name: "決定的な出アフリカ", lat: 12.5, lon: 43.3, year: -70000, desc: "バブ・エル・マンデブ海峡。わずかな集団が海峡を越えアジアへ。" },
            { name: "サフル大陸到達", lat: -15, lon: 135, year: -60000, desc: "オーストラリア周辺へ到達。驚異的な速度での海岸沿いの移動。" },
            { name: "ヨーロッパ進出", lat: 48, lon: 15, year: -45000, desc: "クロマニョン人。先住のネアンデルタール人と遭遇し交雑。" },
            { name: "アメリカ到達", lat: 32.7, lon: -106.1, year: -22000, desc: "ホワイトサンズ足跡。氷床を回避し沿岸ルートで南下した証拠。" },
            { name: "肥沃な三日月地帯", lat: 34, lon: 40, year: -11500, desc: "世界最古の農耕と牧畜の拠点。狩猟採集から定住への転換。" },
            { name: "アンデス農業", lat: -13, lon: -72, year: -10000, desc: "ジャガイモなど高地適応の農耕が独自に発生。" },
            { name: "メソアメリカ農業", lat: 19, lon: -99, year: -9000, desc: "トウモロコシ栽培の開始。" },
            { name: "中国農業", lat: 34, lon: 113, year: -8000, desc: "黄河・長江流域での稲作・アワ・キビ栽培。" },
            { name: "サヘル農業", lat: 13, lon: 0, year: -5000, desc: "アフリカイネなど乾燥地帯での農耕。" },
            { name: "太平洋への航海", lat: 23.5, lon: 121.0, year: -5000, desc: "台湾を起点としたオーストロネシア語族の広大な海洋進出。" }
        ];

        const N_GORES = 4; 
        const GLOBE_RADIUS = 10;
        const MAP_CENTER_LON = 150; // 日本中心の経度
        
        function getGoreCoordinate(lat, lon) {
            // 中心経度からのオフセットを計算（-180〜180の範囲に収める）
            let lonShifted = lon - MAP_CENTER_LON;
            if (lonShifted < -180) lonShifted += 360;
            if (lonShifted >= 180) lonShifted -= 360;

            // 全体でのU座標（0.0〜1.0）
            let u_global = (lonShifted + 180) / 360; 
            if(u_global >= 1.0) u_global = 0.9999;

            let i = Math.floor(u_global * N_GORES);
            if(i >= N_GORES) i = N_GORES - 1;

            let u = (u_global * N_GORES) - i - 0.5; 
            let v = lat / 90; 

            return { i, u, v };
        }

        // --- 3. Geometry Construction & Logic ---
        const SEGMENTS_X = 32; const SEGMENTS_Y = 64; 
        const gores = []; const wireframeMaterials = [];

        const faceMaterial = new THREE.MeshStandardMaterial({ 
            map: mapTexture, side: THREE.DoubleSide, transparent: true,      
            depthWrite: false, roughness: 0.8, polygonOffset: true, 
            polygonOffsetFactor: 1, polygonOffsetUnits: 1 
        });

        for (let i = 0; i < N_GORES; i++) {
            const geometry = new THREE.PlaneGeometry(1, 1, SEGMENTS_X, SEGMENTS_Y);
            const uvs = geometry.attributes.uv;
            for (let j = 0; j < uvs.count; j++) {
                const localU = uvs.getX(j); 
                uvs.setX(j, (i + localU) / N_GORES);
            }
            geometry.userData.basePositions = new Float32Array(geometry.attributes.position.array);

            const mesh = new THREE.Mesh(geometry, faceMaterial);
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.8 });
            wireframeMaterials.push(wireMat);
            mesh.add(new THREE.Mesh(geometry, wireMat)); 
            scene.add(mesh);
            gores.push(geometry);
        }

        // --- 3.5 Dynamic Meshes Setup ---
        // Group for Population (Tab 1)
        const populationGroup = new THREE.Group();
        scene.add(populationGroup);
        const popMeshes = [];
        const domeGeo = new THREE.SphereGeometry(1, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        
        popRawData.forEach(country => {
            const coord = getGoreCoordinate(country.lat, country.lon);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
            const mesh = new THREE.Mesh(domeGeo, mat);
            populationGroup.add(mesh);
            popMeshes.push({ data: country.data, mesh: mesh, goreIndex: coord.i, u: coord.u, v: coord.v });
        });

        // Group for Migration (Tab 2)
        const migrationGroup = new THREE.Group();
        migrationGroup.visible = false; // Hidden by default
        scene.add(migrationGroup);
        const migMeshes = [];
        const diamondGeo = new THREE.OctahedronGeometry(0.8, 0);

        migrationRawData.forEach(item => {
            const coord = getGoreCoordinate(item.lat, item.lon);
            
            // Outer wireframe diamond
            const mat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.8, wireframe: true });
            const mesh = new THREE.Mesh(diamondGeo, mat);
            // Inner solid core
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.6 });
            mesh.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.3, 0), coreMat));
            
            mesh.visible = false;
            migrationGroup.add(mesh);
            migMeshes.push({ data: item, mesh: mesh, goreIndex: coord.i, u: coord.u, v: coord.v });
        });

        // --- 4. Mathematical Transformation Engine ---
        function getTargetPosition(state, i, u, v) {
            const R = GLOBE_RADIUS; const gap = 2.0; 
            const iOffset = i - (N_GORES - 1) / 2; 
            const lambda0 = iOffset * (Math.PI * 2 / N_GORES); 
            const deltaLambda = Math.PI * 2 / N_GORES; 
            const lambda = lambda0 + u * deltaLambda; 
            const phi = v * (Math.PI / 2); 

            if (state === 0) return new THREE.Vector3(lambda * R, phi * R, 0);
            if (state === 1) return new THREE.Vector3(lambda0 * R + iOffset * gap + (u * deltaLambda * Math.cos(phi)) * R, phi * R, 0);
            if (state === 2) {
                const flare = Math.pow(Math.abs(v), 2) * R * 0.6; 
                const r_local = R * Math.cos(phi) + flare; 
                const x_petal = r_local * Math.sin(u * deltaLambda);
                const z_petal = r_local * Math.cos(u * deltaLambda);
                return new THREE.Vector3(x_petal, phi * R * 0.9, z_petal).applyAxisAngle(new THREE.Vector3(0, 1, 0), lambda0);
            } 
            return new THREE.Vector3(R * Math.cos(phi) * Math.sin(lambda), R * Math.sin(phi), R * Math.cos(phi) * Math.cos(lambda));
        }

        function getTargetNormal(state, i, u, v) {
            const eps = 0.005;
            const p0 = getTargetPosition(state, i, u, v);
            const pu = getTargetPosition(state, i, u + eps, v);
            const pv = getTargetPosition(state, i, u, v + eps);
            return new THREE.Vector3().crossVectors(pu.clone().sub(p0), pv.clone().sub(p0)).normalize();
        }

        function getInterpolatedPop(data, currentYear) {
            const years = Object.keys(data).map(Number).sort((a,b) => a-b);
            if(years.length === 0) return 0;
            if (years.length === 1) {
                const diff = Math.abs(currentYear - years[0]);
                return diff > 100 ? 0 : data[years[0]] * (1 - (diff / 100));
            }
            if(currentYear < years[0]) return currentYear > years[0]-50 ? THREE.MathUtils.lerp(0, data[years[0]], 1 - (years[0]-currentYear)/50) : 0;
            if(currentYear > years[years.length-1]) return currentYear < years[years.length-1]+20 ? THREE.MathUtils.lerp(data[years[years.length-1]], 0, 1 - (currentYear-years[years.length-1])/20) : 0;
            
            let prev = years[0], next = years[years.length-1];
            for(let i=0; i<years.length-1; i++) {
                if(currentYear >= years[i] && currentYear <= years[i+1]) { prev = years[i]; next = years[i+1]; break; }
            }
            return prev === next ? data[prev] : THREE.MathUtils.lerp(data[prev], data[next], (currentYear - prev) / (next - prev));
        }

        function getColorForPopulation(pop) {
            const t = Math.pow(Math.min(pop / 1500000, 1.0), 0.5); 
            const color = new THREE.Color();
            if (t < 0.5) color.lerpColors(new THREE.Color('#0ea5e9'), new THREE.Color('#facc15'), t * 2);
            else color.lerpColors(new THREE.Color('#facc15'), new THREE.Color('#ef4444'), (t - 0.5) * 2);
            return color;
        }

        function formatYearText(y) {
            if (y < 0) {
                const past = Math.abs(y);
                if (past >= 10000) return `約${(past / 10000).toFixed(1)}万年前`;
                return `約${past}年前`;
            }
            return `${Math.floor(y)}年`;
        }

        // --- 5. Animation State & Loop ---
        let currentProgress = 3.0, targetProgress = 3.0, isPlaying = false;
        
        // Active Mode logic
        let activeMode = 'pop'; // 'pop' or 'mig'
        let currentTimelineYearPop = 0;
        let isTimelinePlayingPop = false;
        let currentTimelineYearMig = -320000;
        let isTimelinePlayingMig = false;

        const clock = new THREE.Clock();

        function updateGeometry(progress) {
            const p = Math.max(0, Math.min(3, progress));
            const stateFloor = Math.floor(p);
            const stateCeil = Math.min(stateFloor + 1, 3);
            const t = p - stateFloor; 

            // Base Map
            for (let i = 0; i < N_GORES; i++) {
                const geometry = gores[i];
                const positions = geometry.attributes.position;
                const basePositions = geometry.userData.basePositions;
                for (let j = 0; j < positions.count; j++) {
                    const ux = basePositions[j * 3]; const vy = basePositions[j * 3 + 1]; const v = vy * 2.0;                  
                    const p1 = getTargetPosition(stateFloor, i, ux, v);
                    const p2 = getTargetPosition(stateCeil, i, ux, v);
                    positions.setXYZ(j, THREE.MathUtils.lerp(p1.x, p2.x, t), THREE.MathUtils.lerp(p1.y, p2.y, t), THREE.MathUtils.lerp(p1.z, p2.z, t));
                }
                positions.needsUpdate = true; geometry.computeVertexNormals(); 
            }

            // Dynamics
            if (activeMode === 'pop') {
                popMeshes.forEach(item => {
                    const pop = getInterpolatedPop(item.data, currentTimelineYearPop);
                    if(pop <= 0) { item.mesh.visible = false; return; }
                    item.mesh.visible = true;
                    const sizeMultiplier = Math.sqrt(pop / 1500000) * 4.0; 
                    item.mesh.scale.set(sizeMultiplier, sizeMultiplier * 0.15, sizeMultiplier);
                    item.mesh.material.color = getColorForPopulation(pop);

                    const p1 = getTargetPosition(stateFloor, item.goreIndex, item.u, item.v);
                    const p2 = getTargetPosition(stateCeil, item.goreIndex, item.u, item.v);
                    const pos = new THREE.Vector3().lerpVectors(p1, p2, t);
                    const n1 = getTargetNormal(stateFloor, item.goreIndex, item.u, item.v);
                    const n2 = getTargetNormal(stateCeil, item.goreIndex, item.u, item.v);
                    const normal = new THREE.Vector3().lerpVectors(n1, n2, t).normalize();
                    
                    pos.add(normal.clone().multiplyScalar(0.05)); 
                    item.mesh.position.copy(pos);
                    item.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
                });
            } else {
                let latestEvent = null;
                migMeshes.forEach(item => {
                    if (currentTimelineYearMig >= item.data.year) {
                        item.mesh.visible = true;
                        
                        // Flash effect upon emergence
                        const timeSince = currentTimelineYearMig - item.data.year;
                        const scale = Math.max(1.0, 3.0 - (timeSince / 10000));
                        item.mesh.scale.set(scale, scale, scale);
                        
                        if (!latestEvent || item.data.year > latestEvent.year) latestEvent = item.data;

                        const p1 = getTargetPosition(stateFloor, item.goreIndex, item.u, item.v);
                        const p2 = getTargetPosition(stateCeil, item.goreIndex, item.u, item.v);
                        const pos = new THREE.Vector3().lerpVectors(p1, p2, t);
                        const n1 = getTargetNormal(stateFloor, item.goreIndex, item.u, item.v);
                        const n2 = getTargetNormal(stateCeil, item.goreIndex, item.u, item.v);
                        const normal = new THREE.Vector3().lerpVectors(n1, n2, t).normalize();

                        pos.add(normal.clone().multiplyScalar(0.5)); 
                        item.mesh.position.copy(pos);
                        item.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
                        
                        item.mesh.rotation.y += 0.02; // Rotate diamond
                    } else {
                        item.mesh.visible = false;
                    }
                });
                
                const descEl = document.getElementById('mig-event-desc');
                if (latestEvent) {
                    descEl.innerHTML = `<strong class="text-emerald-400 block mb-0.5">${latestEvent.name}</strong>${latestEvent.desc}`;
                } else {
                    descEl.innerHTML = 'スライダーを動かすと、人類拡散の軌跡が表示されます。';
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Transform Animation
            if (isPlaying) {
                currentProgress += delta * 0.8; 
                if (currentProgress >= 4.5) currentProgress = 0; 
            } else currentProgress += (targetProgress - currentProgress) * 0.1;

            // Timeline Animations
            if (isTimelinePlayingPop) {
                currentTimelineYearPop += delta * 200; 
                if (currentTimelineYearPop >= 2026) { currentTimelineYearPop = 2026; isTimelinePlayingPop = false; updatePopUI(); }
                document.getElementById('timeline-slider-pop').value = currentTimelineYearPop;
                document.getElementById('year-display-pop').textContent = Math.floor(currentTimelineYearPop) + '年';
            }
            if (isTimelinePlayingMig) {
                // To cross 320k years reasonably, move 15,000 years per second
                currentTimelineYearMig += delta * 15000; 
                if (currentTimelineYearMig >= 0) { currentTimelineYearMig = 0; isTimelinePlayingMig = false; updateMigUI(); }
                document.getElementById('timeline-slider-mig').value = currentTimelineYearMig;
                document.getElementById('year-display-mig').textContent = formatYearText(currentTimelineYearMig);
            }

            updateGeometry(currentProgress);
            updateActiveButton(currentProgress);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- 6. UI Logic ---
        document.getElementById('play-btn').addEventListener('click', () => {
            isPlaying = !isPlaying;
            document.getElementById('play-icon').textContent = isPlaying ? '⏸' : '▶';
            document.getElementById('play-text').textContent = isPlaying ? '一時停止' : '変形アニメーション再生';
            if(isPlaying && currentProgress >= 3.9) currentProgress = 0;
            else if(!isPlaying) targetProgress = Math.round(currentProgress); 
        });

        document.querySelectorAll('.state-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                isPlaying = false;
                document.getElementById('play-icon').textContent = '▶';
                document.getElementById('play-text').textContent = '変形アニメーション再生';
                targetProgress = parseFloat(e.target.dataset.target);
            });
        });

        function updateActiveButton(progress) {
            let activeState = Math.round(Math.max(0, Math.min(3, progress)));
            if (isPlaying && progress > 3.5) activeState = 3;
            document.querySelectorAll('.state-btn').forEach(btn => {
                if (parseInt(btn.dataset.target) === activeState) btn.classList.add('active-btn');
                else btn.classList.remove('active-btn');
            });
        }

        document.getElementById('wireframe-slider').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            wireframeMaterials.forEach(mat => { mat.opacity = val; mat.visible = val > 0.01; });
        });

        // Toggle Auto Rotate
        const toggleRotateBtn = document.getElementById('toggle-rotate-btn');
        toggleRotateBtn.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
            toggleRotateBtn.textContent = controls.autoRotate ? 'ON' : 'OFF';
            if(controls.autoRotate) {
                toggleRotateBtn.classList.replace('bg-slate-700', 'bg-sky-600');
                toggleRotateBtn.classList.replace('hover:bg-slate-600', 'hover:bg-sky-500');
                toggleRotateBtn.classList.add('shadow-[0_0_8px_rgba(2,132,199,0.5)]');
            } else {
                toggleRotateBtn.classList.replace('bg-sky-600', 'bg-slate-700');
                toggleRotateBtn.classList.replace('hover:bg-sky-500', 'hover:bg-slate-600');
                toggleRotateBtn.classList.remove('shadow-[0_0_8px_rgba(2,132,199,0.5)]');
            }
        });

        // Tabs
        const tabPop = document.getElementById('tab-pop');
        const tabMig = document.getElementById('tab-mig');
        const panelPop = document.getElementById('panel-pop');
        const panelMig = document.getElementById('panel-mig');

        tabPop.addEventListener('click', () => {
            activeMode = 'pop';
            tabPop.classList.add('tab-active'); tabMig.classList.remove('tab-active');
            panelPop.classList.remove('hidden'); panelMig.classList.add('hidden');
            populationGroup.visible = true; migrationGroup.visible = false;
        });

        tabMig.addEventListener('click', () => {
            activeMode = 'mig';
            tabMig.classList.add('tab-active'); tabPop.classList.remove('tab-active');
            panelMig.classList.remove('hidden'); panelPop.classList.add('hidden');
            populationGroup.visible = false; migrationGroup.visible = true;
        });

        // Timeline Pop
        const btnPop = document.getElementById('timeline-play-btn-pop');
        function updatePopUI() {
            if (isTimelinePlayingPop) {
                btnPop.textContent = '⏸ 停止';
                btnPop.classList.replace('bg-sky-600', 'bg-red-600'); btnPop.classList.replace('hover:bg-sky-500', 'hover:bg-red-500');
            } else {
                btnPop.textContent = '▶ 人口推移を再生';
                btnPop.classList.replace('bg-red-600', 'bg-sky-600'); btnPop.classList.replace('hover:bg-red-500', 'hover:bg-sky-500');
            }
        }
        btnPop.addEventListener('click', () => {
            isTimelinePlayingPop = !isTimelinePlayingPop;
            if(isTimelinePlayingPop && currentTimelineYearPop >= 2026) currentTimelineYearPop = 0;
            updatePopUI();
        });
        document.getElementById('timeline-slider-pop').addEventListener('input', (e) => {
            currentTimelineYearPop = parseFloat(e.target.value);
            document.getElementById('year-display-pop').textContent = Math.floor(currentTimelineYearPop) + '年';
        });

        // Timeline Mig
        const btnMig = document.getElementById('timeline-play-btn-mig');
        function updateMigUI() {
            if (isTimelinePlayingMig) {
                btnMig.textContent = '⏸ 停止';
                btnMig.classList.replace('bg-emerald-600', 'bg-red-600'); btnMig.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
            } else {
                btnMig.textContent = '▶ 拡散の歴史を再生';
                btnMig.classList.replace('bg-red-600', 'bg-emerald-600'); btnMig.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
            }
        }
        btnMig.addEventListener('click', () => {
            isTimelinePlayingMig = !isTimelinePlayingMig;
            if(isTimelinePlayingMig && currentTimelineYearMig >= 0) currentTimelineYearMig = -320000;
            updateMigUI();
        });
        document.getElementById('timeline-slider-mig').addEventListener('input', (e) => {
            currentTimelineYearMig = parseFloat(e.target.value);
            document.getElementById('year-display-mig').textContent = formatYearText(currentTimelineYearMig);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateGeometry(currentProgress);
        animate();

    </script>
</body>
</html>
