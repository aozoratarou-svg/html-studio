<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GIT LINK">
    <title>GIT LINK STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000; --fg: #fff; --red: #e52521; --blue: #0047BB;
            --green: #33ff33; --gray: #444; --bdr: 2px solid #fff; --shd: 2px 2px 0px #fff;
        }
        body {
            background: var(--bg); color: var(--fg); font-family: 'DotGothic16', sans-serif;
            margin: 0; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)) 12px;
            box-sizing: border-box; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }
        h1 { text-align: center; font-size: 1.2rem; color: var(--red); text-shadow: 2px 2px 0 #fff; margin: 5px 0 12px; letter-spacing: 1px; white-space: nowrap; }
        
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0; }
        .tab-btn { flex: 1; background: var(--bg); color: var(--fg); border: var(--bdr); font-family: inherit; padding: 8px 0; font-size: .85rem; cursor: pointer; box-shadow: var(--shd); white-space: nowrap; user-select: none; }
        .tab-btn.active { background: var(--fg); color: var(--bg); box-shadow: none; transform: translate(2px, 2px); }
        .panel { display: none; border: var(--bdr); padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: var(--bg); position: relative; width: 100%; flex: 1; }
        .panel.active { display: flex; flex-direction: column; }
        .panel-borderless { border: none; padding: 0; }

        .section-header-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 8px; }
        .section-header-title { font-size: .9rem; color: #fff; font-weight: bold; letter-spacing: 1px; margin: 0; }
        
        /* フォーム系 */
        input[type="text"], input[type="password"] { width: 100%; background: #0000AA; color: #fff; border: var(--bdr); padding: 8px; font-family: 'DotGothic16', monospace; font-size: 1rem; box-sizing: border-box; outline: none; margin-bottom: 8px;}
        input:focus { border-color: var(--red); }
        .config-item { margin-bottom: 15px; width: 100%; }
        .config-item label { display: block; font-size: .85rem; margin-bottom: 3px; color: var(--red); }
        .config-warning-text { font-size: .75rem; color: #f1c40f; margin-bottom: 2px; }

        /* ボタン */
        .btn-action { padding: 10px; font-size: .9rem; text-align: center; color: #fff; border: 2px solid #fff; box-shadow: var(--shd); cursor: pointer; font-family: inherit; }
        .btn-action.red { background: var(--red); }
        .btn-action.blue { background: var(--blue); }
        .btn-action.gray { background: var(--gray); }
        .btn-action:active { transform: translate(2px, 2px); box-shadow: none; }
        .flex-row { display: flex; gap: 8px; width: 100%; margin-bottom: 10px; }
        .flex-row .btn-action { flex: 1; }

        /* リスト UI */
        #toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #last-updated { font-size: 0.75rem; color: #aaa; }
        
        #file-tree-container { flex: 1; overflow-y: auto; padding: 2px; }
        .folder-block { margin-bottom: 15px; border-left: 2px dashed #444; padding-left: 10px; margin-left: 5px; }
        .folder-title { font-size: 0.95rem; color: var(--green); margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        
        .file-card { 
            background: #111; border: 1px solid #555; padding: 10px 8px; 
            text-align: center; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 60px; word-break: break-all; text-decoration: none; color: #fff;
        }
        .file-card:hover { background: #222; border-color: var(--blue); }
        .file-card:active { background: #333; }
        .file-card.html-file { border-color: #fff; background: #1a1a1a; font-weight: bold; }
        .file-card.html-file:hover { border-color: var(--red); }
        .file-card.selected { border-color: var(--green); background: rgba(51, 255, 51, 0.2); }
        
        .file-icon { font-size: 1.5rem; margin-bottom: 4px; }
        .file-name { font-size: 0.8rem; line-height: 1.2; }

        /* リスト表示切替用 */
        .view-mode-list .file-grid { display: flex; flex-direction: column; gap: 2px; }
        .view-mode-list .file-card { flex-direction: row; justify-content: flex-start; align-items: center; min-height: 36px; padding: 6px 10px; }
        .view-mode-list .file-icon { margin-bottom: 0; margin-right: 10px; font-size: 1.2rem; }
        .view-mode-list .file-name { font-size: 0.85rem; text-align: left; }

        .empty-msg { color: #aaa; font-size: 0.85rem; text-align: center; margin-top: 20px; }

        .view-toggle-btn { background: #222; border: 1px solid #fff; color: #fff; font-family: inherit; font-size: 0.8rem; padding: 3px 8px; cursor: pointer; margin-right: 10px; }
        .view-toggle-btn:hover { background: #444; }

        #file-tree-container { padding-bottom: 90px; } /* Bottom bar space */
        #bottom-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.95); border-top: var(--bdr);
            padding: 15px 12px max(15px, env(safe-area-inset-bottom));
            display: flex; gap: 10px; z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.7);
        }
        #bottom-action-bar.visible { transform: translateY(0); }

    </style>
</head>
<body>
    <h1>GIT LINK STUDIO</h1>
    
    <div class="tabs">
        <button id="tab-list-btn" class="tab-btn active" onclick="switchTab('list')">🗂️ リスト</button>
        <button id="tab-config-btn" class="tab-btn" onclick="switchTab('config')">⚙️ せってい</button>
    </div>

    <div id="panel-list" class="panel panel-borderless active">
        <div id="toolbar">
            <div class="section-header-title" style="margin: 0;">▼ REPOSITORY FILES</div>
            <div style="display: flex; align-items: center; gap: 5px;">
                <button class="view-toggle-btn" style="margin:0;" onclick="selectAllCards()">全選択</button>
                <button class="view-toggle-btn" style="margin:0;" onclick="deselectAllCards()">全解除</button>
                <button id="view-toggle-btn" class="view-toggle-btn" style="margin:0;" onclick="toggleViewMode()">📄 リスト表示</button>
            </div>
        </div>
        <div id="last-updated" style="text-align: right; margin-bottom: 10px; font-size: 0.75rem; color: #aaa;">未取得</div>
        <div class="flex-row" style="margin-bottom: 15px;">
            <button id="btn-refresh" class="btn-action blue" onclick="fetchRepositoryData()" style="flex: 2; padding: 12px; font-size: 1.1rem;">🔄 リスト更新</button>
            <button class="btn-action gray" onclick="createFolder()" style="flex: 1; padding: 12px;">📁 フォルダ作成</button>
        </div>
        
        <div id="file-tree-container">
            <div class="empty-msg">まだデータがありません。<br>「リストを更新する」を押してください。</div>
        </div>

        <div id="bottom-action-bar">
            <button class="btn-action red" onclick="executeSelected()" style="flex: 2; font-size: 1.2rem; padding: 15px;">▶️ 開く</button>
            <button class="btn-action gray" onclick="moveSelected()" style="flex: 1; padding: 15px;">📦 移動</button>
            <button class="btn-action gray" onclick="trashSelected()" style="flex: 1; padding: 15px;">🗑️ ゴミ箱</button>
        </div>
    </div>

    <div id="panel-config" class="panel">
        <div class="section-header-title" style="margin-bottom:8px">▼ SECURITY (暗号化管理)</div>
        <div class="config-item">
            <label>🔐 マスターパスワード (復号・保存用)</label>
            <div class="config-warning-text">※MultiAgent.htmlと同じパスワードで解除できます</div>
            <input type="password" id="master-password" placeholder="パスワードを入力">
        </div>
        <div class="flex-row">
            <button class="btn-action blue" onclick="encryptAndSaveKeys()">💾 暗号化保存</button>
            <button class="btn-action red" onclick="unlockKeys()">🔓 ロック解除</button>
        </div>
        <div class="config-item"><label>GITHUB トークン (PAT)</label><input type="password" id="gh-token" placeholder="ghp_xxxxxxxx..."></div>
        
        <div class="section-header-title" style="margin-top:15px;margin-bottom:8px">▼ REPOSITORY SETUP</div>
        <div class="config-item"><label>ユーザー名 (Owner)</label><input type="text" id="gh-owner" data-store-key="ghOwner" placeholder="例: octocat"></div>
        <div class="config-item"><label>リポジトリ名 (Repo)</label><input type="text" id="gh-repo" data-store-key="ghRepo" data-default="html-STUDIO" placeholder="例: html-STUDIO"></div>
        <div class="config-item"><label>ブランチ名</label><input type="text" id="gh-branch" data-store-key="ghBranch" data-default="main" placeholder="例: main"></div>
        
        <p style="color:#aaa; font-size:0.8rem; margin-top:20px;">
            設定した情報をもとに、GitHub APIからファイル一覧を取得し、GitHub Pages へのリンクを生成します。
        </p>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        /** ===================================================================
         *  暗号化ロジック (MultiAgent互換)
         *  =================================================================== */
        function uint8ToBase64(bytes) {
            let b = ''; for (let i = 0; i < bytes.length; i += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(b);
        }

        const SecureStore = {
            async deriveKey(pw, salt) {
                const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), {name:"PBKDF2"}, false, ["deriveBits","deriveKey"]);
                return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
            },
            async encrypt(text, pw) {
                const enc = new TextEncoder(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await this.deriveKey(pw, salt), encrypted = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(text));
                const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
                combined.set(salt, 0); combined.set(iv, 16); combined.set(new Uint8Array(encrypted), 28);
                return uint8ToBase64(combined);
            },
            async decrypt(b64, pw) {
                const s = atob(b64), c = new Uint8Array(s.length);
                for(let i=0; i<s.length; i++) c[i] = s.charCodeAt(i);
                const key = await this.deriveKey(pw, c.slice(0,16));
                return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:c.slice(16,28)}, key, c.slice(28)));
            }
        };

        async function encryptAndSaveKeys() {
            const pwd = $('master-password').value, gh = $('gh-token').value;
            if(!pwd) return alert("マスターパスワードを入力してください。");
            if(!gh) return alert("保存するキーが入力されていません。");
            try {
                localStorage.setItem('enc_gh', await SecureStore.encrypt(gh, pwd));
                sessionStorage.setItem('ghToken', gh);
                alert("🔑 暗号化して安全に保存しました！");
            } catch(e) { alert("暗号化エラー: " + e.message); }
        }

        async function unlockKeys() {
            const pwd = $('master-password').value;
            if(!pwd) return alert("マスターパスワードを入力してください。");
            const et = localStorage.getItem('enc_gh');
            if(!et) return alert("保存された暗号化キーが見つかりません。");
            try {
                const d = await SecureStore.decrypt(et, pwd); 
                $('gh-token').value = d; 
                sessionStorage.setItem('ghToken', d);
                alert("🔓 ロック解除成功！キーをメモリにロードしました。");
            } catch(e) { alert("❌ パスワードが間違っているか、復号に失敗しました。"); }
        }

        const getToken = () => sessionStorage.getItem('ghToken') || $('gh-token').value;

        let isListView = localStorage.getItem('view_mode_list') !== 'false';

        function updateViewModeUI() {
            const container = $('file-tree-container');
            const btn = $('view-toggle-btn');
            if (isListView) {
                container.classList.add('view-mode-list');
                btn.textContent = '🔲 カード表示';
            } else {
                container.classList.remove('view-mode-list');
                btn.textContent = '📄 リスト表示';
            }
        }

        function toggleViewMode() {
            isListView = !isListView;
            localStorage.setItem('view_mode_list', isListView);
            updateViewModeUI();
        }

        function toggleSelect(el) {
            el.classList.toggle('selected');
            updateActionBar();
        }

        function selectAllCards() {
            document.querySelectorAll('.file-card').forEach(el => el.classList.add('selected'));
            updateActionBar();
        }

        function deselectAllCards() {
            document.querySelectorAll('.file-card').forEach(el => el.classList.remove('selected'));
            updateActionBar();
        }

        function updateActionBar() {
            const selectedCount = document.querySelectorAll('.file-card.selected').length;
            const bar = $('bottom-action-bar');
            if (bar) {
                if (selectedCount > 0) {
                    bar.classList.add('visible');
                    bar.querySelector('.red').textContent = `▶️ 開く (${selectedCount})`;
                } else {
                    bar.classList.remove('visible');
                }
            }
        }

        function executeSelected() {
            const selected = document.querySelectorAll('.file-card.selected');
            if (selected.length === 0) return alert("ファイルが選択されていません。");
            selected.forEach(card => {
                window.open(card.dataset.url, '_blank');
                card.classList.remove('selected');
            });
            updateActionBar();
        }

        async function gitCommitTreeUpdates(updates, commitMessage) {
            const token = getToken(), owner = $('gh-owner').value.trim(), repo = $('gh-repo').value.trim(), branch = $('gh-branch').value.trim();
            if(!token) throw new Error("Tokenが設定されていません。設定画面で保存してください。");
            const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' };
            
            let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, {headers});
            if(!res.ok) throw new Error("ブランチの取得に失敗しました: " + await res.text());
            const commitSha = (await res.json()).object.sha;
            
            res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits/${commitSha}`, {headers});
            if(!res.ok) throw new Error("コミット情報の取得に失敗しました");
            const baseTreeSha = (await res.json()).tree.sha;
            
            res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, {
                method: 'POST', headers,
                body: JSON.stringify({ base_tree: baseTreeSha, tree: updates })
            });
            if(!res.ok) throw new Error("Treeの作成に失敗しました: " + await res.text());
            const newTreeSha = (await res.json()).sha;
            
            res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, {
                method: 'POST', headers,
                body: JSON.stringify({ message: commitMessage, tree: newTreeSha, parents: [commitSha] })
            });
            if(!res.ok) throw new Error("新しいコミットの作成に失敗しました");
            const newCommitSha = (await res.json()).sha;
            
            res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, {
                method: 'PATCH', headers,
                body: JSON.stringify({ sha: newCommitSha })
            });
            if(!res.ok) throw new Error("参照の更新に失敗しました");
        }

        async function createFolder() {
            const folderName = prompt("作成するフォルダのパスを入力してください（例: folderName）:");
            if (!folderName) return;
            
            const updates = [{
                path: `${folderName}/.gitkeep`,
                mode: '100644',
                type: 'blob',
                content: "keep"
            }];
            
            try {
                await gitCommitTreeUpdates(updates, `Create folder ${folderName}`);
                alert("フォルダを作成しました。");
                fetchRepositoryData();
            } catch(e) {
                alert("エラー: " + e.message);
            }
        }

        async function moveSelected() {
            const selected = document.querySelectorAll('.file-card.selected');
            if (selected.length === 0) return alert("ファイルが選択されていません。");
            
            const existingFolders = Array.from(document.querySelectorAll('.folder-title'))
                .map(el => el.textContent.replace('📂 ', '')).filter(p => p !== '/ (ルート)');
            const hint = existingFolders.length ? `既存フォルダ: ${existingFolders.join(', ')}` : '既存のフォルダはありません';
            
            const targetFolder = prompt(`移動先のフォルダパスを入力してください。\n(${hint})\n\n※ルートに移動する場合は「/」を入力`);
            if (!targetFolder) return;
            
            const prefix = targetFolder === '/' ? '' : (targetFolder.endsWith('/') ? targetFolder : targetFolder + '/');
            const updates = [];
            
            selected.forEach(card => {
                const oldPath = card.dataset.path;
                const sha = card.dataset.sha;
                const name = oldPath.split('/').pop();
                const newPath = prefix + name;
                
                if (oldPath !== newPath) {
                    updates.push({ path: oldPath, mode: "100644", type: "blob", sha: null });
                    updates.push({ path: newPath, mode: "100644", type: "blob", sha: sha });
                }
            });
            
            if (updates.length === 0) return alert("変更はありません。");
            
            try {
                await gitCommitTreeUpdates(updates, `Move ${selected.length} files to ${targetFolder}`);
                alert("移動が完了しました。");
                fetchRepositoryData();
            } catch (e) {
                alert("エラー: " + e.message);
            }
        }

        async function trashSelected() {
            const selected = document.querySelectorAll('.file-card.selected');
            if (selected.length === 0) return alert("ファイルが選択されていません。");
            
            if (!confirm(`${selected.length}個のファイルをゴミ箱（Trash/）に移動しますか？`)) return;
            
            const updates = [];
            selected.forEach(card => {
                const oldPath = card.dataset.path;
                const sha = card.dataset.sha;
                const safePath = `Trash/${oldPath}`;
                
                updates.push({ path: oldPath, mode: "100644", type: "blob", sha: null });
                updates.push({ path: safePath, mode: "100644", type: "blob", sha: sha });
            });
            
            try {
                await gitCommitTreeUpdates(updates, `Move ${selected.length} files to Trash`);
                alert("ゴミ箱へ移動しました。");
                fetchRepositoryData();
            } catch(e) {
                alert("エラー: " + e.message);
            }
        }

        /** ===================================================================
         *  UI 初期化 & タブ切り替え
         *  =================================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            // Data Binding
            document.querySelectorAll('[data-store-key]').forEach(el => {
                const k = el.dataset.storeKey, def = el.dataset.default || '';
                // MultiAgentからの移行互換
                if (k === 'ghOwner' && localStorage.getItem('gh_owner')) { localStorage.setItem(k, localStorage.getItem('gh_owner')); localStorage.removeItem('gh_owner'); }
                if (k === 'ghRepo' && localStorage.getItem('gh_repo')) { localStorage.setItem(k, localStorage.getItem('gh_repo')); localStorage.removeItem('gh_repo'); }
                
                el.value = localStorage.getItem(k) || def;
                el.addEventListener('input', e => localStorage.setItem(k, e.target.value));
            });
            
            if(sessionStorage.getItem('ghToken')) $('gh-token').value = sessionStorage.getItem('ghToken');

            updateViewModeUI();

            // Load cache if exists
            loadCachedData();
        });

        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            $(`tab-${name}-btn`).classList.add('active');
            $(`panel-${name}`).classList.add('active');
        }

        /** ===================================================================
         *  GitHub API 通信 & 描画ロジック
         *  =================================================================== */
        async function fetchRepositoryData() {
            const token = getToken(), owner = $('gh-owner').value.trim(), repo = $('gh-repo').value.trim(), branch = $('gh-branch').value.trim();
            if(!owner || !repo) {
                alert('ユーザー名(Owner)とリポジトリ名(Repo)を設定してください。');
                switchTab('config'); return;
            }
            
            const btn = $('btn-refresh');
            const originalText = btn.textContent;
            btn.textContent = "⏳ 取得中...";
            btn.style.pointerEvents = "none";

            const h = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) h['Authorization'] = `Bearer ${token}`;

            try {
                // Get tree recursively
                const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
                const res = await fetch(url, { headers: h });
                
                if(!res.ok) throw new Error(`API Error: ${res.status} ${await res.text()}`);
                const data = await res.json();
                
                if(data.truncated) console.warn("Tree is truncated, might not show all files.");

                const treeData = {
                    owner, repo,
                    timestamp: new Date().toISOString(),
                    tree: data.tree
                };

                // Cache it
                localStorage.setItem(`gitlink_cache_${owner}_${repo}`, JSON.stringify(treeData));
                
                renderTree(treeData);
                
            } catch(e) {
                alert(`取得に失敗しました。\n・リポジトリ名やユーザー名が正しいか\n・プライベートリポジトリの場合はTokenが設定・解除されているか\n確認してください。\n\n詳細: ${e.message}`);
            } finally {
                btn.textContent = originalText;
                btn.style.pointerEvents = "auto";
            }
        }

        function loadCachedData() {
            const owner = localStorage.getItem('ghOwner') || '';
            const repo = localStorage.getItem('ghRepo') || 'html-STUDIO';
            const cacheRaw = localStorage.getItem(`gitlink_cache_${owner}_${repo}`);
            if (cacheRaw) {
                try {
                    renderTree(JSON.parse(cacheRaw));
                } catch(e) {
                    console.error("Cache parsing error", e);
                }
            }
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.html')) return '📄';
            if (filename.endsWith('.css')) return '🎨';
            if (filename.endsWith('.js')) return '📜';
            if (filename.endsWith('.png') || filename.endsWith('.jpg') || filename.endsWith('.svg')) return '🖼️';
            if (filename.endsWith('.json')) return '⚙️';
            return '📁';
        }

        function renderTree(data) {
            const container = $('file-tree-container');
            container.innerHTML = '';
            if (typeof updateActionBar === 'function') updateActionBar();
            
            const d = new Date(data.timestamp);
            $('last-updated').textContent = `最終更新: ${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

            const files = data.tree.filter(item => item.type === 'blob');
            if (files.length === 0) {
                container.innerHTML = '<div class="empty-msg">ファイルが見つかりません。</div>';
                return;
            }

            // Group files by folder
            const folders = {};
            files.forEach(f => {
                const parts = f.path.split('/');
                const filename = parts.pop();
                const folderPath = parts.length > 0 ? parts.join('/') : '/ (ルート)';
                
                if (!folders[folderPath]) folders[folderPath] = [];
                folders[folderPath].push({ path: f.path, name: filename, sha: f.sha });
            });

            // Sort folders: root first, then alphabetical
            const folderPaths = Object.keys(folders).sort((a, b) => {
                if (a === '/ (ルート)') return -1;
                if (b === '/ (ルート)') return 1;
                return a.localeCompare(b);
            });

            const baseUrl = `https://${data.owner}.github.io/${data.repo}/`;

            folderPaths.forEach(folderPath => {
                const block = document.createElement('div');
                block.className = 'folder-block';
                
                const title = document.createElement('div');
                title.className = 'folder-title';
                title.innerHTML = `📂 ${folderPath}`;
                block.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'file-grid';

                // Sort files in folder: HTML first, then alphabetical
                folders[folderPath].sort((a, b) => {
                    const aHtml = a.name.endsWith('.html');
                    const bHtml = b.name.endsWith('.html');
                    if (aHtml && !bHtml) return -1;
                    if (!aHtml && bHtml) return 1;
                    return a.name.localeCompare(b.name);
                });

                folders[folderPath].forEach(file => {
                    const isHtml = file.name.endsWith('.html');
                    const card = document.createElement('div');
                    card.className = `file-card ${isHtml ? 'html-file' : ''}`;
                    card.title = file.name;
                    card.dataset.url = `${baseUrl}${file.path}`;
                    card.dataset.path = file.path;
                    card.dataset.sha = file.sha;
                    card.onclick = function() { toggleSelect(this); };
                    
                    const icon = document.createElement('div');
                    icon.className = 'file-icon';
                    icon.textContent = getFileIcon(file.name);
                    
                    const name = document.createElement('div');
                    name.className = 'file-name';
                    // 拡張子を除外して表示するかどうか。わかりやすくそのまま表示する
                    name.textContent = file.name;

                    card.appendChild(icon);
                    card.appendChild(name);
                    grid.appendChild(card);
                });

                block.appendChild(grid);
                container.appendChild(block);
            });
        }
    </script>
</body>
</html>
