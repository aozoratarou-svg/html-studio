<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTI AGENT STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        /* 全体のベース設定 */
        body { 
            background: #000000; 
            color: #ffffff; 
            font-family: 'DotGothic16', monospace; 
            padding: 10px; 
            margin: 0; 
            box-sizing: border-box; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
        }

        /* タイトル */
        .header { 
            text-align: center; 
            font-size: 1.5rem; 
            margin: 10px 0 15px 0; 
            color: #E52521;
            text-shadow: 2px 2px 0 #fff;
            letter-spacing: 2px;
        }

        /* 上部：定型ボタンと設定ボタンの横一列 */
        .top-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        /* 汎用ボタン */
        .btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            box-shadow: 2px 2px 0px #fff;
            padding: 8px 5px;
            cursor: pointer;
            font-size: 0.9rem;
            text-align: center;
            font-family: 'DotGothic16', monospace;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        
        .btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 0px 0px 0px #fff; 
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-teikei { flex: 1; }
        .btn-setting { width: 50px; font-size: 1.2rem; } 
        
        /* 1行高さのコンパクトボタン用 */
        .btn-sm {
            padding: 4px 5px;
            font-size: 0.85rem;
            height: 32px;
        }

        /* 共通テキストエリア設定 */
        textarea {
            width: 100%; 
            background: #0000AA; 
            color: #fff; 
            border: 2px solid #fff; 
            padding: 10px; 
            box-sizing: border-box; 
            resize: none;
            font-family: 'DotGothic16', monospace;
            font-size: 1rem;
            line-height: 1.4;
        }
        textarea:focus { outline: none; border-color: #E52521; }
        textarea::placeholder { color: #aaaaaa; }

        #userInput { flex: 1; margin-bottom: 10px; }

        /* エージェント進捗ステータスエリア */
        #status-board {
            display: none;
            background: #000;
            border: 2px dashed #fff;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            max-height: 150px; 
            overflow-y: auto;
        }
        .agent-status { margin: 4px 0; }
        .status-wait { color: #aaaaaa; }
        .status-run { color: #f39c12; animation: blink 1s infinite; }
        .status-done { color: #2ecc71; }
        .status-err { color: #e74c3c; }
        .status-skip { color: #555555; text-decoration: line-through; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* アクションボタン（縦積み配置） */
        .btn-action { 
            width: 100%; 
            padding: 12px; 
            font-size: 1rem; 
            margin-bottom: 10px;
            letter-spacing: 1px;
            flex-shrink: 0; 
        }
        .red { background: #E52521; color: #fff; border-color: #fff; box-shadow: 2px 2px 0px #fff;}
        .blue { background: #0047BB; color: #fff; border-color: #fff; box-shadow: 2px 2px 0px #fff;}
        .gray { background: #444444; color: #fff; border-color: #fff; box-shadow: 2px 2px 0px #fff;}

        /* 出力コンソール */
        .output-console { 
            flex: 1.2; 
            margin-bottom: 5px;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'DotGothic16', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .section-title {
            color: #E52521;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .section-title:first-child { margin-top: 0; }
        .audit-text { color: #2ecc71; }

        /* モーダル */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 10; 
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #000;
            border: 4px solid #fff;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-content h3 { 
            color: #E52521; 
            border-bottom: 2px dashed #fff;
            padding-bottom: 5px; 
            margin-top: 0; 
            text-align: center; 
        }
        
        .modal-content input, .modal-content textarea {
            width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;
            background: #111; color: #fff; border: 2px solid #555; 
            flex: none; font-family: 'DotGothic16', monospace;
        }
        
        .modal-content label { 
            color: #fff; display: block; margin-bottom: 5px; font-size: 0.9rem;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .checkbox-label input { width: auto; margin: 0; transform: scale(1.2); }

    </style>
</head>
<body>

<div class="header">MULTI AGENT STUDIO</div>

<div class="top-row">
    <div class="btn btn-teikei" onclick="insertTeikei(1)">定型1</div>
    <div class="btn btn-teikei" onclick="insertTeikei(2)">定型2</div>
    <div class="btn btn-teikei" onclick="insertTeikei(3)">定型3</div>
    <div class="btn btn-setting" onclick="openModal('modal-settings')">⚙️</div>
</div>

<textarea id="userInput" placeholder="▶AIニ 何ヲ サセマスカ？"></textarea>

<div id="status-board">
    <div id="status-pm" class="agent-status status-wait">🧠 親(PM) : 待機中...</div>
    
    <div id="status-en" class="agent-status status-wait" style="display:none;">🗣️ 子A(EN): 待機中...</div>
    <div id="status-code" class="agent-status status-wait" style="display:none;">💻 子B(CD): 待機中...</div>
    <div id="status-audit" class="agent-status status-wait" style="display:none;">🕵️ 監査(AU): 待機中...</div>
    
    <div id="swarm-status-container"></div>
</div>

<button id="startSwarmsBtn" class="btn btn-action red" onclick="runSwarms()">🕹️ Swarms開発スタート</button>
<button id="startDevBtn" class="btn btn-action blue" onclick="runMultiAgent('dev')">🛠️ 開発スタート（コードあり）</button>
<button id="startPromptBtn" class="btn btn-action blue" onclick="runMultiAgent('prompt')">📝 指示書スタート（コードなし）</button>

<div style="display: flex; gap: 8px; margin-bottom: 10px;">
    <button class="btn gray btn-sm" style="flex: 1;" onclick="alert('ページを選択します')">ページを選んでから開く</button>
    <button id="gitUpdateBtn" class="btn gray btn-sm" style="width: 40px; flex: none; font-size: 1.1rem;" onclick="runGitSync()" title="Gitへ出力を保存">🔄</button>
    <button class="btn gray btn-sm" style="flex: none; padding: 0 12px; white-space: nowrap;" onclick="alert('ひらきます')">📂 ひらく</button>
</div>

<button id="copyBtn" class="btn btn-action gray" onclick="copyOutput()">📋 COPY (最適化コピー)</button>

<div id="output" class="output-console">
    <div style="color:#aaaaaa;">▶ケッカガ ココニ ヒョウジサレマス</div>
</div>

<div id="modal-settings" class="modal-overlay">
    <div class="modal-content">
        <h3>SETTINGS</h3>
        
        <label>Gemini API Key (3.5 Flash用)</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">

        <label>GITHUB トークン (PAT)</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxx...">

        <label>ユーザー名 (Owner)</label>
        <input type="text" id="ghOwner" placeholder="例: octocat">

        <label>リポジトリ名 (Repo)</label>
        <input type="text" id="ghRepo" placeholder="例: brain-hub">
        
        <label>マイ・コンテキスト (前提条件/技術スタック)</label>
        <textarea id="myContext" rows="3" placeholder="例: PythonとReactを好む。シンプルでモダンなUI設計。"></textarea>

        <label class="checkbox-label">
            <input type="checkbox" id="soundToggle" checked>
            <span>タイピング音 (SOUND) 鳴らす</span>
        </label>

        <label>定型文 1</label>
        <textarea id="teikei1" rows="2" placeholder="例：UIを作る時はモダンでシンプルなデザインに"></textarea>
        
        <label>定型文 2</label>
        <textarea id="teikei2" rows="2" placeholder="例：エラーハンドリングも含めて"></textarea>
        
        <label>定型文 3</label>
        <textarea id="teikei3" rows="2" placeholder="例：コアなロジック部分のみ"></textarea>
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn red" style="flex: 2;" onclick="saveSettings()">SAVE</button>
            <button class="btn" style="flex: 1;" onclick="closeModal('modal-settings')">CLOSE</button>
        </div>
    </div>
</div>

<script>
    // -------------------------------------------------------------------
    // 設定と初期化
    // -------------------------------------------------------------------
    const MODEL_NAME = "gemini-3.5-flash";
    const API_BASE_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}`;
    
    let audioCtx = null;
    let currentAppMode = ''; // 'swarms', 'dev', 'prompt'

    window.onload = () => {
        document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
        document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('myContext').value = localStorage.getItem('my_context') || '';
        document.getElementById('soundToggle').checked = localStorage.getItem('sound_toggle') !== 'false';
        for(let i=1; i<=3; i++) {
            document.getElementById('teikei'+i).value = localStorage.getItem('teikei'+i) || '';
        }
    };

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveSettings() {
        localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
        localStorage.setItem('gh_token', document.getElementById('ghToken').value);
        localStorage.setItem('gh_owner', document.getElementById('ghOwner').value);
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
        localStorage.setItem('my_context', document.getElementById('myContext').value);
        localStorage.setItem('sound_toggle', document.getElementById('soundToggle').checked);
        for(let i=1; i<=3; i++) {
            localStorage.setItem('teikei'+i, document.getElementById('teikei'+i).value);
        }
        closeModal('modal-settings');
        alert('セッテイ ヲ ホゾンシマシタ。');
    }

    function insertTeikei(num) {
        const val = localStorage.getItem('teikei'+num);
        if(!val) {
            alert(`テイケイ ${num} ガ ミセッテイ デス。⚙️ カラ セッテイシテクダサイ。`);
            return;
        }
        const ta = document.getElementById('userInput');
        ta.value = ta.value ? ta.value + '\n' + val : val;
        ta.scrollTop = ta.scrollHeight;
    }

    function updateStatus(agentId, state, text) {
        const el = document.getElementById(agentId);
        if(el) {
            el.className = `agent-status status-${state}`;
            el.innerText = text;
            el.style.display = 'block';
        }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function disableButtons(disable) {
        document.getElementById('startSwarmsBtn').disabled = disable;
        document.getElementById('startDevBtn').disabled = disable;
        document.getElementById('startPromptBtn').disabled = disable;
        document.getElementById('copyBtn').disabled = disable;
        document.getElementById('gitUpdateBtn').disabled = disable;
    }

    function resetButtonsText() {
        document.getElementById('startSwarmsBtn').innerText = "🕹️ Swarms開発スタート";
        document.getElementById('startDevBtn').innerText = "🛠️ 開発スタート（コードあり）";
        document.getElementById('startPromptBtn').innerText = "📝 指示書スタート（コードなし）";
    }

    // --- 音声演出 ---
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
        const soundOn = document.getElementById('soundToggle').checked;
        if (!soundOn || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400 + Math.random()*200, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    // -------------------------------------------------------------------
    // 👑 添付コード準拠 GitHub API 同期処理（🔄ボタン）
    // -------------------------------------------------------------------
    async function runGitSync() {
        const token = localStorage.getItem('gh_token');
        const owner = localStorage.getItem('gh_owner');
        const repo = localStorage.getItem('gh_repo');

        if (!token || !owner || !repo) {
            alert('【エラー】\n⚙️ 設定（SETTINGS）から GitHub トークン、ユーザー名、リポジトリ名を入力してください。');
            openModal('modal-settings');
            return;
        }

        // 現在コンソールに出力されているテキストを整形して取得
        let contentToSave = "";
        const enText = document.getElementById('en-text')?.innerText;
        const cdText = document.getElementById('cd-text')?.innerText;
        const swarmText = document.getElementById('swarm-text')?.innerText;

        if (swarmText) {
            contentToSave += `### === SWARM OUTPUT ===\n${swarmText}\n`;
        } else {
            if (enText) contentToSave += `### --- [ Task / EN Prompt ] ---\n${enText}\n\n`;
            if (cdText) contentToSave += `### --- [ Core Logic Code ] ---\n${cdText}\n\n`;
        }

        if (!contentToSave.trim()) {
            alert('【エラー】\nGitHubに同期する成果物（プロンプトやコード）がコンソールにありません。');
            return;
        }

        const filename = "studio_output.md"; // 保存するデフォルトファイル名
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filename}`;
        const outputConsole = document.getElementById('output');
        
        // 進捗ログ表示領域の確保
        const logDiv = document.createElement('div');
        logDiv.style.borderTop = "2px dashed #fff";
        logDiv.style.marginTop = "15px";
        logDiv.style.paddingTop = "10px";
        logDiv.style.color = "yellow";
        logDiv.innerHTML = `▶ [Git] 同期シーケンスを開始します...<br>`;
        outputConsole.appendChild(logDiv);
        outputConsole.scrollTop = outputConsole.scrollHeight;

        disableButtons(true);

        // 添付コード準拠の堅牢な UTF-8 互換 Base64 エンコード
        const bytes = new TextEncoder().encode(contentToSave);
        const encodedContent = btoa(String.fromCharCode(...bytes));
        const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' };

        try {
            let sha = null;
            logDiv.innerHTML += `▶ [GET] 既存ファイル '${filename}' の確認中...<br>`;
            
            // 1. 既存のファイルのSHAを取得（上書き対応）
            const getRes = await fetch(apiUrl, { headers });
            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
                logDiv.innerHTML += `▶ [INFO] 既存ファイルを発見しました (SHA: ${sha})。更新モードへ移行します。<br>`;
            } else {
                logDiv.innerHTML += `▶ [INFO] 新規作成モードでコミットします。<br>`;
            }

            // 2. PUTペイロードの構築
            const body = { 
                message: `📝 ${filename} を更新 (via MULTI AGENT STUDIO)`, 
                content: encodedContent 
            };
            if (sha) body.sha = sha;

            logDiv.innerHTML += `▶ [PUT] GitHubリポジトリへ書き込み中...<br>`;
            
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (putRes.ok) {
                logDiv.innerHTML += `<span style="color: #2ecc71;">【成功】GitHub上の '${filename}' への同期が完了しました！</span><br>`;
                alert(`【せいこう！】\n${filename} に同期・セーブしました。`);
            } else {
                const errData = await putRes.json();
                logDiv.innerHTML += `<span style="color: #e74c3c;">【失敗】GitHub APIエラー: ${errData.message}</span><br>`;
                alert(`【エラー！】\nセーブに失敗しました。\n理由: ${errData.message}`);
            }
        } catch (error) {
            logDiv.innerHTML += `<span style="color: #e74c3c;">【通信エラー】ネットワークを確認してください: ${error}</span><br>`;
            alert(`【通信エラー！】\n${error}`);
        } finally {
            disableButtons(false);
            resetButtonsText();
        }
    }

    // -------------------------------------------------------------------
    // API Callers
    // -------------------------------------------------------------------
    async function callGemini(prompt, apiKey, temp = 0.0) {
        const res = await fetch(`${API_BASE_URL}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: temp }
            })
        });
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        const data = await res.json();
        return data.candidates[0].content.parts[0].text.trim();
    }

    async function callGeminiJSON(prompt, apiKey) {
        const res = await fetch(`${API_BASE_URL}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { 
                    temperature: 0.1,
                    responseMimeType: "application/json" 
                }
            })
        });
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        const data = await res.json();
        return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    async function callGeminiStream(prompt, apiKey, onChunk) {
        const res = await fetch(`${API_BASE_URL}:streamGenerateContent?alt=sse&key=${apiKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.2 }
            })
        });
        
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullText = "";
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');
            
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const dataStr = line.substring(6).trim();
                    if (dataStr) {
                        try {
                            const dataObj = JSON.parse(dataStr);
                            const parts = dataObj?.candidates?.[0]?.content?.parts;
                            if (parts && parts[0] && parts[0].text) {
                                const t = parts[0].text;
                                fullText += t;
                                onChunk(t); 
                                playBeep(); 
                            }
                        } catch(e) {}
                    }
                }
            }
        }
        return fullText;
    }

    // -------------------------------------------------------------------
    // Swarms ワークフロー
    // -------------------------------------------------------------------
    async function runSwarms() {
        const input = document.getElementById('userInput').value;
        const key = localStorage.getItem('gemini_key');
        if(!key) { alert('⚙️ カラ Gemini API Key ヲ ニュウリョクシテクダサイ。'); return; }
        if(!input) { alert('ヨウボウ ヲ ニュウリョクシテクダサイ。'); return; }

        currentAppMode = 'swarms';
        initAudio();

        const outputConsole = document.getElementById('output');
        const statusBoard = document.getElementById('status-board');
        const swarmContainer = document.getElementById('swarm-status-container');
        
        disableButtons(true);
        document.getElementById('startSwarmsBtn').innerText = "⏳ ギョウムチュウ...";

        outputConsole.innerHTML = "";
        statusBoard.style.display = "block";
        
        document.getElementById('status-en').style.display = 'none';
        document.getElementById('status-code').style.display = 'none';
        document.getElementById('status-audit').style.display = 'none';
        swarmContainer.innerHTML = ''; 

        updateStatus('status-pm', 'run', '🧠 親(PM) : チーム編成中... (Function Calling)');

        try {
            const spawnTool = {
                functionDeclarations: [{
                    name: "spawn_agents",
                    description: "ユーザーの要望を達成するために必要な専門エージェントのチームを編成します。",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            agents: {
                                type: "ARRAY",
                                description: "必要な子エージェントのリスト",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        role: { type: "STRING", description: "役割 (例: 'Backend Developer', 'Frontend UI', 'Database Expert')" },
                                        task: { type: "STRING", description: "この子エージェントが実行すべき具体的なタスク指示" }
                                    }
                                }
                            }
                        },
                        required: ["agents"]
                    }
                }]
            };

            const pmPrompt = `あなたは優秀なオーケストレーターです。要望を分析しタスクを分解して 'spawn_agents' を実行してください。\n\n【トークン節約ルール】\n子エージェントへのタスク指示(task)は、トークン消費を抑えるため「極限まで短い英語(English)」で記述してください。\n\n要望: ${input}`;
            
            const pmRes = await fetch(`${API_BASE_URL}:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: pmPrompt }] }],
                    tools: [spawnTool],
                    toolConfig: { functionCallingConfig: { mode: "ANY" } }, 
                    generationConfig: { temperature: 0.2 }
                })
            });
            
            if (!pmRes.ok) throw new Error(`API Error: ${pmRes.status}`);
            const pmData = await pmRes.json();

            const parts = pmData.candidates[0].content.parts;
            const functionCall = parts.find(p => p.functionCall)?.functionCall;

            if (!functionCall || functionCall.name !== "spawn_agents") {
                throw new Error("PMがチーム編成ツールを使用しませんでした。");
            }

            const agentTeam = functionCall.args.agents;
            updateStatus('status-pm', 'done', `🧠 親(PM) : 編成完了！ ${agentTeam.length}名のエージェントを召喚します。`);

            agentTeam.forEach((agent, index) => {
                swarmContainer.innerHTML += `<div id="status-child-${index}" class="agent-status status-wait">🤖 子[${agent.role}]: 待機中...</div>`;
            });

            const childPromises = agentTeam.map(async (agent, index) => {
                const childPrompt = `Role: Expert ${agent.role}\nConstraint: English strictly. NO greetings. NO explanations. Provide raw artifact only.\nTask: ${agent.task}`;
                
                try {
                    if (index > 0) {
                        updateStatus(`status-child-${index}`, 'run', `🤖 子[${agent.role}]: 時差待機中(${index * 2}秒)...`);
                        await sleep(index * 2000);
                    }
                    
                    updateStatus(`status-child-${index}`, 'run', `🤖 子[${agent.role}]: タスク実行中...`);

                    let result = null;
                    let lastErrorMsg = "";
                    for (let attempt = 1; attempt <= 2; attempt++) {
                        try {
                            result = await callGemini(childPrompt, key, 0.0);
                            break; 
                        } catch (err) {
                            lastErrorMsg = err.message; 
                            if (attempt < 2) {
                                updateStatus(`status-child-${index}`, 'err', `🤖 子[${agent.role}]: サーバー混雑(${lastErrorMsg})。5秒後に再試行...`);
                                await sleep(5000); 
                                updateStatus(`status-child-${index}`, 'run', `🤖 子[${agent.role}]: タスク再実行中(2回目)...`);
                            }
                        }
                    }

                    if (!result) throw new Error(lastErrorMsg);
                    updateStatus(`status-child-${index}`, 'done', `🤖 子[${agent.role}]: 完了！`);
                    return `### [担当: ${agent.role}]\n${result}\n\n`;

                } catch (err) {
                    updateStatus(`status-child-${index}`, 'err', `🤖 子[${agent.role}]: 取得失敗`);
                    return `### [担当: ${agent.role}]\n⚠️ APIエラーにより取得失敗 (Error: ${err.message})\n\n`;
                }
            });

            const results = await Promise.all(childPromises);

            outputConsole.innerHTML = `
                <div class="section-title">=== SWARM OUTPUT ===</div>
                <div id="swarm-text">${results.join("")}</div>
            `;

        } catch(e) {
            outputConsole.innerHTML += `<div style="color:#e74c3c; margin-top:10px;">ERROR: 通信エラー発生。\n${e.message}</div>`;
            updateStatus('status-pm', 'err', `🧠 親(PM) : エラー停止 (${e.message})`);
        } finally {
            disableButtons(false);
            resetButtonsText();
        }
    }

    // -------------------------------------------------------------------
    // 開発 / 指示書 ワークフロー
    // -------------------------------------------------------------------
    async function runMultiAgent(mode) {
        const input = document.getElementById('userInput').value;
        const key = localStorage.getItem('gemini_key');
        const myContext = localStorage.getItem('my_context') || "特なし";
        
        if(!key) { alert('⚙️ カラ Gemini API Key (3.5 Flash) ヲ ニュウリョクシテクダサイ。'); return; }
        if(!input) { alert('ヨウボウ ヲ ニュウリョクシテクダサイ。'); return; }

        currentAppMode = mode;
        initAudio(); 

        const outputConsole = document.getElementById('output');
        const statusBoard = document.getElementById('status-board');
        
        disableButtons(true);
        if(mode === 'dev') {
            document.getElementById('startDevBtn').innerText = "⏳ ギョウムチュウ...";
        } else {
            document.getElementById('startPromptBtn').innerText = "⏳ ギョウムチュウ...";
        }

        const codeSectionHTML = currentAppMode === 'dev' ? `
            <div id="cd-section">
                <div class="section-title">--- [ Core Logic Code ] ---</div>
                <div id="cd-text"></div>
            </div>` : '';

        outputConsole.innerHTML = `
            <div id="en-section">
                <div class="section-title">--- [ Task / EN Prompt ] ---</div>
                <div id="en-text"></div>
            </div>
            ${codeSectionHTML}
            <div id="audit-section" style="display:none;">
                <div class="section-title">--- [ AUDIT REFLECTION ] ---</div>
                <div id="audit-text" class="audit-text"></div>
            </div>
        `;
        
        const enTextEl = document.getElementById('en-text');
        const cdTextEl = document.getElementById('cd-text');
        const auditTextEl = document.getElementById('audit-text');
        const auditSection = document.getElementById('audit-section');

        const scrollToBottom = () => { outputConsole.scrollTop = outputConsole.scrollHeight; };

        statusBoard.style.display = "block";
        document.getElementById('swarm-status-container').innerHTML = '';
        
        updateStatus('status-pm', 'run', '🧠 親(PM) : コンテキスト適用＆JSON要件設計中...');
        updateStatus('status-en', 'wait', '🗣️ 子A(EN): 待機中...');
        
        if(currentAppMode === 'dev') {
            updateStatus('status-code', 'wait', '💻 子B(CD): 待機中...');
        } else {
            updateStatus('status-code', 'skip', '💻 子B(CD): 休止中 (指示書モードのためスキップ)');
        }
        updateStatus('status-audit', 'wait', '🕵️ 監査(AU): 待機中...');

        try {
            const jsonSchema = currentAppMode === 'dev' 
                ? `{\n  "english_prompt": "AIにタスクを指示するための極限まで短い英語の要件定義(Keywords only)",\n  "core_logic": "システムのコア機能を作成するための技術的な要件定義"\n}`
                : `{\n  "english_prompt": "AIにタスクを指示するための極限まで短い英語の要件定義(Keywords only)"\n}`;

            const pmPrompt = `あなたは優秀なPMです。以下の【前提条件】と【ユーザー要望】を分析し、JSONフォーマットのみを出力してください。挨拶や解説は一切不要です。\n【前提条件】: ${myContext}\n【ユーザー要望】: ${input}\n\n${jsonSchema}`;
            
            const pmJson = await callGeminiJSON(pmPrompt, key);
            updateStatus('status-pm', 'done', '🧠 親(PM) : JSON要件定義 完了！');

            // 1. 子A (EN Prompt) のストリーミング実行
            updateStatus('status-en', 'run', '🗣️ 子A(EN): 英文プロンプト ストリーミング中...');
            const enPrompt = `あなたはプロンプトエンジニアです。以下の【要件】を元に、他のAIに渡すための、極限までトークンを節約した英語の指示文を作成してください。\nConstraint: English strictly. Provide raw artifact only.\n【要件】:\n${pmJson.english_prompt}`;
            
            let enResult = await callGeminiStream(enPrompt, key, (chunk) => {
                enTextEl.innerText += chunk;
                scrollToBottom();
            });
            updateStatus('status-en', 'done', '🗣️ 子A(EN): 出力完了！');

            let cdResult = "";
            // 2. 子B (Core Code) のストリーミング実行（devモードのみ）
            if (currentAppMode === 'dev') {
                updateStatus('status-code', 'run', '💻 子B(CD): コアコード ストリーミング中...');
                const cdPrompt = `あなたはシニアアーキテクトです。以下の【要件】を元に、最も重要となる「コア機能」のコードのみを作成してください。\nConstraint: Code only. No explanations.\n【要件】:\n${pmJson.core_logic}`;
                
                cdResult = await callGeminiStream(cdPrompt, key, (chunk) => {
                    cdTextEl.innerText += chunk;
                    scrollToBottom();
                });
                updateStatus('status-code', 'done', '💻 子B(CD): 出力完了！');
            }

            // 3. 監査 (Audit) の実行
            updateStatus('status-audit', 'run', '🕵️ 監査(AU): 成果物の検証＆リフレクション中...');
            auditSection.style.display = "block";

            const auditPrompt = `あなたは厳格な監査官（兼デバッカー）です。これまでのユーザーの要望、および生成された成果物（英文プロンプト、必要であればコード）を比較検証し、不足している要素、バグの懸念、改善点を日本語で簡潔に箇条書きで指摘してください。\n\n【ユーザー要望】:\n${input}\n\n【生成された英文プロンプト】:\n${enResult}\n\n【生成されたコード】:\n${cdResult || 'なし（指示書モード）'}`;

            await callGeminiStream(auditPrompt, key, (chunk) => {
                auditTextEl.innerText += chunk;
                scrollToBottom();
            });
            updateStatus('status-audit', 'done', '🕵️ 監査(AU): 監査完了！');

        } catch(e) {
            outputConsole.innerHTML += `<div style="color:#e74c3c; margin-top:10px;">ERROR: 処理中にエラーが発生しました。\n${e.message}</div>`;
            updateStatus('status-pm', 'err', '🧠 親(PM) : エラー停止');
        } finally {
            disableButtons(false);
            resetButtonsText();
        }
    }

    // -------------------------------------------------------------------
    // 便利機能
    // -------------------------------------------------------------------
    function copyOutput() {
        let text = "";
        const enText = document.getElementById('en-text')?.innerText;
        const cdText = document.getElementById('cd-text')?.innerText;
        const swarmText = document.getElementById('swarm-text')?.innerText;

        if (swarmText) {
            text += `=== SWARM OUTPUT ===\n${swarmText}\n`;
        } else {
            if (enText) text += `--- [ Task / EN Prompt ] ---\n${enText}\n\n`;
            if (cdText) text += `--- [ Core Logic Code ] ---\n${cdText}\n\n`;
        }

        if (!text.trim()) {
            alert('コピーするコンテンツがありません。');
            return;
        }

        navigator.clipboard.writeText(text.trim()).then(() => {
            alert('成果物（プロンプト/コード）をクリップボードにコピーしました！ (監査テキストは除外)');
        }).catch(err => {
            alert('コピーに失敗しました: ' + err);
        });
    }
</script>
