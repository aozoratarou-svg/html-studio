<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origami Globe Transformation</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- D3.js and TopoJSON for real geographic data -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Custom styling for the range slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }
        
        .active-btn { background-color: #2563eb !important; color: white !important; border-color: #3b82f6 !important; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="pb-6 px-4 md:px-8 flex flex-col items-center justify-end h-full">
        <div class="pointer-events-auto bg-slate-900/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-4xl text-slate-200">
            
            <div class="text-center mb-4">
                <h1 class="text-xl font-bold text-white tracking-wider">折り紙地球儀シミュレーター</h1>
                <p class="text-xs text-slate-400 mt-1">平面地図が立体へと変形する幾何学プロセス</p>
            </div>

            <!-- Main Controls -->
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                
                <!-- Play/Pause -->
                <button id="play-btn" class="flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 transition-colors px-6 py-3 rounded-xl font-bold w-full md:w-auto">
                    <span id="play-icon">▶</span>
                    <span id="play-text">再生</span>
                </button>

                <!-- State Buttons -->
                <div class="flex flex-wrap justify-center gap-2 w-full md:w-auto">
                    <button class="state-btn px-4 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition-all text-sm font-medium" data-target="0">1. メルカトル</button>
                    <button class="state-btn px-4 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition-all text-sm font-medium" data-target="1">2. 分割</button>
                    <button class="state-btn px-4 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition-all text-sm font-medium" data-target="2">3. 折り畳み</button>
                    <button class="state-btn px-4 py-2 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition-all text-sm font-medium" data-target="3">4. 立体！</button>
                </div>
            </div>

            <!-- Wireframe Opacity Slider -->
            <div class="mt-6 flex items-center gap-4 border-t border-slate-700 pt-4">
                <label for="wireframe-slider" class="text-sm font-medium whitespace-nowrap">ワイヤーフレーム濃度:</label>
                <input type="range" id="wireframe-slider" min="0" max="1" step="0.01" value="0.8" class="w-full">
            </div>

        </div>
    </div>

    <script>
        // --- 1. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Set a nice dark blue atmospheric background
        scene.background = new THREE.Color(0x0f172a); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -15, 45); // Start slightly below and far back

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; // Slowly rotate the scene
        controls.autoRotateSpeed = 1.0;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 40);
        scene.add(dirLight);

        // --- 2. Texture Generation (Real Map Data via D3 & TopoJSON) ---
        const canvas = document.createElement('canvas');
        canvas.width = 2048; // ワイヤーの解像度を向上
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        
        const mapTexture = new THREE.CanvasTexture(canvas);
        mapTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        function drawBaseGrid() {
            // 背景を完全に透明にする（紙の質感をなくし、ワイヤーのみにする）
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Lat/Lon Grid lines (細かい経緯度線 10度刻み)
            ctx.strokeStyle = 'rgba(71, 85, 105, 0.5)';
            ctx.lineWidth = 1.5;
            for(let i=0; i<=18; i++) { // 緯度
                ctx.beginPath(); ctx.moveTo(0, i*(canvas.height/18)); ctx.lineTo(canvas.width, i*(canvas.height/18)); ctx.stroke();
            }
            for(let i=0; i<=36; i++) { // 経度
                ctx.beginPath(); ctx.moveTo(i*(canvas.width/36), 0); ctx.lineTo(i*(canvas.width/36), canvas.height); ctx.stroke();
            }

            // Equator (Dashed)
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
            ctx.setLineDash([]); // Reset
            
            mapTexture.needsUpdate = true;
        }

        function loadRealMapData() {
            // 外部のTopoJSONデータ（50m解像度）を非同期で取得して描画
            fetch('https://unpkg.com/world-atlas@2.0.2/countries-50m.json')
                .then(response => response.json())
                .then(world => {
                    const geojson = topojson.feature(world, world.objects.countries);
                    
                    // 正距円筒図法でCanvasサイズに正確にマッピング
                    const projection = d3.geoEquirectangular()
                        .scale(canvas.width / (2 * Math.PI))
                        .translate([canvas.width / 2, canvas.height / 2]);
                        
                    const path = d3.geoPath()
                        .projection(projection)
                        .context(ctx);

                    // 精巧なワイヤーフレームとして描画
                    ctx.strokeStyle = '#38bdf8'; // ワイヤーフレームに映える明るい水色
                    ctx.lineWidth = 2.0;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    path(geojson);
                    ctx.stroke();

                    // テクスチャを更新してThree.jsに反映
                    mapTexture.needsUpdate = true;
                })
                .catch(err => console.error("Map data loading failed:", err));
        }

        // 初期グリッドを描画し、その後地図データを非同期ロード
        drawBaseGrid();
        loadRealMapData();

        // --- 3. Geometry Construction & Logic ---
        const N_GORES = 4; // Number of splits (matches the sketch)
        const GLOBE_RADIUS = 10;
        const SEGMENTS_X = 32; // High resolution for smooth bending
        const SEGMENTS_Y = 64; 

        const gores = [];
        const wireframeMaterials = [];

        // Materials
        // Solid face material (テクスチャの透過を有効にして線だけを残す)
        const faceMaterial = new THREE.MeshStandardMaterial({ 
            map: mapTexture, 
            side: THREE.DoubleSide,
            transparent: true,      // 透過を有効化
            depthWrite: false,      // 重なった線の描画を綺麗にするため
            roughness: 0.8,
            polygonOffset: true, 
            polygonOffsetFactor: 1, 
            polygonOffsetUnits: 1 
        });

        // Loop to create each gore (segment)
        for (let i = 0; i < N_GORES; i++) {
            // Create a flat plane for this segment
            const geometry = new THREE.PlaneGeometry(1, 1, SEGMENTS_X, SEGMENTS_Y);
            
            // Adjust UVs so the global map texture spans perfectly across the separated pieces
            const uvs = geometry.attributes.uv;
            for (let j = 0; j < uvs.count; j++) {
                const localU = uvs.getX(j); // 0.0 to 1.0 within this plane
                // Map to global texture U: e.g., if N=4, piece 0 gets U from 0.0 to 0.25
                uvs.setX(j, (i + localU) / N_GORES);
            }

            // Store the base coordinates (u: -0.5 to 0.5, v: -0.5 to 0.5) to calculate transformations
            geometry.userData.basePositions = new Float32Array(geometry.attributes.position.array);

            const mesh = new THREE.Mesh(geometry, faceMaterial);
            
            // Create corresponding wireframe
            const wireMat = new THREE.MeshBasicMaterial({ 
                color: 0x3b82f6, // Blue line color
                wireframe: true, 
                transparent: true, 
                opacity: 0.8 
            });
            wireframeMaterials.push(wireMat);
            const wireMesh = new THREE.Mesh(geometry, wireMat);
            
            mesh.add(wireMesh); // Group wireframe with the solid mesh
            scene.add(mesh);
            gores.push(geometry);
        }

        // --- 4. Mathematical Transformation Engine ---
        /**
         * Calculates the 3D position of a vertex based on the current state.
         * @param {number} state - 0(Mercator), 1(Split), 2(Fold), 3(Globe)
         * @param {number} i - Gore index (0 to 3)
         * @param {number} u - Local X coordinate (-0.5 to 0.5)
         * @param {number} v - Local Y coordinate (-1.0 to 1.0, where poles are ±1)
         */
        function getTargetPosition(state, i, u, v) {
            const R = GLOBE_RADIUS;
            const gap = 2.0; // Spacing between gores in flat split state
            
            const iOffset = i - (N_GORES - 1) / 2; // e.g., -1.5, -0.5, 0.5, 1.5
            const lambda0 = iOffset * (Math.PI * 2 / N_GORES); // Center longitude of this gore
            const deltaLambda = Math.PI * 2 / N_GORES; // Width of one gore in radians
            const lambda = lambda0 + u * deltaLambda; // Absolute longitude for this vertex
            const phi = v * (Math.PI / 2); // Absolute latitude (-PI/2 to PI/2)

            if (state === 0) {
                // 1. メルカトル (Mercator-ish Flat Map)
                return new THREE.Vector3(lambda * R, phi * R, 0);
            } 
            else if (state === 1) {
                // 2. 分割 (Split Spindles - Sinusoidal projection)
                // Width scales by cos(latitude) to form a spindle, and pieces are separated by 'gap'
                const x = lambda0 * R + iOffset * gap + (u * deltaLambda * Math.cos(phi)) * R;
                return new THREE.Vector3(x, phi * R, 0);
            } 
            else if (state === 2) {
                // 3. 折り畳み (Folding "Origami Petal" State)
                // Curve horizontally into a cylinder, but flare the poles outwards
                const flare = Math.pow(Math.abs(v), 2) * R * 0.6; // Outward bending at poles
                const r_local = R * Math.cos(phi) + flare; // Distance from Y-axis
                
                // Curve the petal itself
                const x_petal = r_local * Math.sin(u * deltaLambda);
                const z_petal = r_local * Math.cos(u * deltaLambda);
                
                // Construct vector facing +Z, then rotate into its proper circular position around Y axis
                const vec = new THREE.Vector3(x_petal, phi * R * 0.9, z_petal); // Slightly squash Y to emphasize fold
                vec.applyAxisAngle(new THREE.Vector3(0, 1, 0), lambda0);
                return vec;
            } 
            else {
                // 4. 立体！ (Completed Sphere)
                // Standard spherical coordinates
                const x = R * Math.cos(phi) * Math.sin(lambda);
                const y = R * Math.sin(phi);
                const z = R * Math.cos(phi) * Math.cos(lambda);
                return new THREE.Vector3(x, y, z);
            }
        }

        // --- 5. Animation State & Loop ---
        let currentProgress = 3.0; // Start at complete globe
        let targetProgress = 3.0;
        let isPlaying = false;
        const clock = new THREE.Clock();

        function updateGeometry(progress) {
            // Clamp progress between 0 and 3
            const p = Math.max(0, Math.min(3, progress));
            const stateFloor = Math.floor(p);
            const stateCeil = Math.min(stateFloor + 1, 3);
            const t = p - stateFloor; // Interpolation factor (0.0 to 1.0)

            for (let i = 0; i < N_GORES; i++) {
                const geometry = gores[i];
                const positions = geometry.attributes.position;
                const basePositions = geometry.userData.basePositions;

                for (let j = 0; j < positions.count; j++) {
                    const ux = basePositions[j * 3];     // -0.5 to 0.5
                    const vy = basePositions[j * 3 + 1]; // -0.5 to 0.5
                    const v = vy * 2.0;                  // -1.0 to 1.0

                    // Calculate positions for the two adjacent states
                    const pos1 = getTargetPosition(stateFloor, i, ux, v);
                    const pos2 = getTargetPosition(stateCeil, i, ux, v);

                    // Linear interpolation for smooth morphing
                    positions.setXYZ(j,
                        THREE.MathUtils.lerp(pos1.x, pos2.x, t),
                        THREE.MathUtils.lerp(pos1.y, pos2.y, t),
                        THREE.MathUtils.lerp(pos1.z, pos2.z, t)
                    );
                }
                
                positions.needsUpdate = true;
                geometry.computeVertexNormals(); // Recalculate lighting normals based on new curved shape
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update Progress
            if (isPlaying) {
                currentProgress += delta * 0.8; // Animation speed
                if (currentProgress >= 4.5) {
                    currentProgress = 0; // Wrap around after a brief pause at the end
                }
            } else {
                // Smooth ease towards target if manually clicked
                currentProgress += (targetProgress - currentProgress) * 0.1;
            }

            // Apply transformation
            updateGeometry(currentProgress);

            // Update UI Button Highlighting
            updateActiveButton(currentProgress);

            controls.update();
            renderer.render(scene, camera);
        }

        // --- 6. UI Interactions ---
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        const stateBtns = document.querySelectorAll('.state-btn');
        const opacitySlider = document.getElementById('wireframe-slider');

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.textContent = '⏸';
                playText.textContent = '一時停止';
                // If it was at the end, restart from beginning smoothly
                if(currentProgress >= 3.9) currentProgress = 0;
            } else {
                playIcon.textContent = '▶';
                playText.textContent = '再生';
                targetProgress = Math.round(currentProgress); // Snap to nearest state when paused
            }
        });

        stateBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                isPlaying = false;
                playIcon.textContent = '▶';
                playText.textContent = '再生';
                targetProgress = parseFloat(e.target.dataset.target);
            });
        });

        function updateActiveButton(progress) {
            // Find the closest state (0, 1, 2, 3) to highlight the correct button
            let activeState = Math.round(Math.max(0, Math.min(3, progress)));
            if (isPlaying && progress > 3.5) activeState = 3;

            stateBtns.forEach(btn => {
                if (parseInt(btn.dataset.target) === activeState) {
                    btn.classList.add('active-btn');
                } else {
                    btn.classList.remove('active-btn');
                }
            });
        }

        opacitySlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            wireframeMaterials.forEach(mat => {
                mat.opacity = val;
                mat.visible = val > 0.01; // Hide completely if 0
            });
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize transformation once before starting loop
        updateGeometry(currentProgress);
        updateActiveButton(currentProgress);
        
        // Start animation loop
        animate();

    </script>
</body>
</html>
