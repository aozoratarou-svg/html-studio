<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1730">
<title>ガラスのテトリス</title>
<style>
:root{
  --ink:#241f38;
  --paper:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.12);
  --glass-2:rgba(255,255,255,.20);
  --line:rgba(255,255,255,.34);
  --halo:#fff7ea;
  --shadow:0 10px 30px rgba(20,14,40,.28);
  --display:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  font-family:var(--display);color:#fff;background:#1b1730;
  -webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.10),transparent 60%),
             radial-gradient(120% 90% at 50% 100%,rgba(10,6,24,.42),transparent 62%)}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* ---------- shared glass chrome ---------- */
.pane{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn{
  font-family:var(--display);font-weight:700;color:#fff;font-size:16px;letter-spacing:.04em;
  padding:14px 20px;border-radius:999px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(18,12,36,.30), inset 0 1px 0 rgba(255,255,255,.55);
  cursor:pointer;transition:transform .12s cubic-bezier(.2,.9,.3,1.4),filter .12s;
}
.btn:active{transform:scale(.955);filter:brightness(1.12)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,241,225,.72));color:#2b2340;border-color:rgba(255,255,255,.8)}
.btn:focus-visible{outline:3px solid #ffe9a8;outline-offset:3px}
input{
  font-family:var(--display);font-size:16px;color:#fff;padding:12px 14px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.10);width:100%;
}
input::placeholder{color:rgba(255,255,255,.5)}
.lbl{font-size:11px;letter-spacing:.22em;opacity:.72;margin-bottom:6px;font-weight:700}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:16px;z-index:3}
.screen.on{display:flex}
.wrap{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}

/* title */
.logo{text-align:center;line-height:1;margin-bottom:4px}
.logo b{
  display:block;font-size:clamp(38px,12vw,60px);font-weight:800;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#ffe6f2 45%,#bfe9ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(255,255,255,.35));
}
.logo span{display:block;margin-top:10px;font-size:12px;letter-spacing:.42em;opacity:.75}
.menu{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;padding:11px 6px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.08);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;
}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.86);color:#2b2340;box-shadow:inset 0 1px 0 #fff}
.row{display:flex;gap:10px;align-items:center}
.note{font-size:12px;line-height:1.7;opacity:.78}
.note code{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.28);padding:2px 6px;border-radius:6px}

/* ---------- play ---------- */
#play{position:absolute;inset:0;display:none;flex-direction:column;z-index:3;padding:8px}
#play.on{display:flex}
.hud{display:flex;gap:8px;align-items:stretch;padding:6px 8px}
.slot{padding:6px 8px;border-radius:14px;min-width:66px;display:flex;flex-direction:column;gap:2px;align-items:center}
.slot .lbl{margin:0;font-size:9px;letter-spacing:.2em}
.slot canvas{display:block}
.slot.next{flex:1.15}
.stats{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;border-radius:14px}
.stats .k{font-size:9px;letter-spacing:.2em;opacity:.7;font-weight:700}
.stats .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.05}
.stats .sub{font-family:var(--mono);font-size:11px;opacity:.8}
/* ポーズは あそんでいる指から いちばん遠い、HUDの すみに置く */
.hudbtn{
  position:absolute;top:4px;right:5px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.06em;
  color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.07);cursor:pointer;
}
.hudbtn:active{background:rgba(255,255,255,.22);color:#fff}
.hudbtn:focus-visible{outline:3px solid #ffe9a8;outline-offset:2px}

.arena{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;perspective:1500px}
#boardWrap{position:relative;transform:rotateX(6deg);transform-style:preserve-3d;transition:transform .4s ease}
#board{display:block;border-radius:10px}
.frame{position:absolute;inset:-10px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  box-shadow:0 18px 44px rgba(12,8,28,.45), inset 0 1px 0 rgba(255,255,255,.4);pointer-events:none}
#danger{position:absolute;inset:-10px;border-radius:16px;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 40px rgba(255,86,120,.85), 0 0 34px rgba(255,86,120,.5);transition:opacity .2s}

/* opponent */
#oppBox{position:absolute;top:0;right:0;padding:8px;border-radius:14px;display:none;flex-direction:column;gap:4px;align-items:center}
#oppBox.on{display:flex}
#oppBox .who{font-size:11px;font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#oppBox .st{font-family:var(--mono);font-size:10px;opacity:.8}
#oppCv{display:block;border-radius:6px;background:rgba(10,6,24,.32)}

/* incoming garbage gauge */
#gauge{position:absolute;left:-20px;top:0;bottom:0;width:8px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden}
#gaugeFill{position:absolute;left:0;right:0;bottom:0;height:0%;border-radius:6px;
  background:linear-gradient(180deg,#ff9bb4,#ff5678);box-shadow:0 0 14px rgba(255,86,120,.8);transition:height .18s}

/* ---------- むかしながらの十字キー ---------- */
#pad{
  --dp:clamp(130px,40vw,170px);
  --ab:clamp(58px,18vw,76px);
  display:none;align-items:flex-end;justify-content:space-between;gap:8px;
  padding:6px 14px calc(6px + env(safe-area-inset-bottom));
}
#pad.on{display:flex}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}

/* 台座 + 4つのキー */
.dpad{
  position:relative;width:var(--dp);height:var(--dp);touch-action:none;border-radius:50%;
  background:radial-gradient(70% 70% at 38% 30%,rgba(255,255,255,.14),rgba(12,8,28,.30));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 26px rgba(14,9,32,.42), inset 0 1px 0 rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.dpad b{
  position:absolute;width:32%;height:32%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--dp)*.15);color:rgba(255,255,255,.92);border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.09));
  border:1px solid var(--line);
  box-shadow:0 5px 12px rgba(18,12,36,.34), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .08s,filter .08s;pointer-events:none;
}
.dpad b.on{transform:scale(.92);filter:brightness(1.45)}
.dpad .up{left:34%;top:2%}
.dpad .down{left:34%;top:66%}
.dpad .left{left:2%;top:34%}
.dpad .right{left:66%;top:34%}
.dpad .hub{
  position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;
  background:radial-gradient(60% 60% at 35% 30%,rgba(255,255,255,.42),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.28);pointer-events:none;
}

/* A / B / キープ */
.abs{position:relative;width:calc(var(--ab)*2.2);height:calc(var(--ab)*2);flex:none}
.ab{
  position:absolute;border-radius:50%;border:1px solid var(--line);color:#fff;cursor:pointer;
  font-family:var(--display);font-weight:800;font-size:calc(var(--ab)*.36);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 7px 18px rgba(18,12,36,.38), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -6px 12px rgba(20,10,40,.28);
  transition:transform .08s,filter .08s;
}
.ab small{font-size:calc(var(--ab)*.15);font-weight:700;opacity:.75;letter-spacing:.06em;margin-top:2px}
.ab:active{transform:scale(.93) translateY(2px);filter:brightness(1.2)}
.ab.a{width:var(--ab);height:var(--ab);right:0;top:calc(var(--ab)*.42);
  background:linear-gradient(180deg,rgba(255,175,196,.62),rgba(226,102,136,.42))}
.ab.b{width:var(--ab);height:var(--ab);left:calc(var(--ab)*.12);bottom:0;
  background:linear-gradient(180deg,rgba(168,186,255,.60),rgba(108,124,214,.42))}
.ab.keep{width:calc(var(--ab)*.78);height:calc(var(--ab)*.78);left:0;top:0;font-size:calc(var(--ab)*.17);
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08))}

/* toasts / banners */
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  font-size:clamp(24px,7vw,40px);font-weight:800;letter-spacing:.04em;opacity:0;text-align:center;
  text-shadow:0 4px 22px rgba(0,0,0,.5), 0 0 26px rgba(255,255,255,.5)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-72%) scale(1)}}
#toast.go{animation:pop 1.15s cubic-bezier(.2,.9,.3,1) forwards}

#overlay{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(14,9,30,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#overlay.on{display:flex}
.card{padding:24px;border-radius:24px;width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:30px;font-weight:800;letter-spacing:.04em}
.card .big{font-family:var(--mono);font-size:34px;font-weight:600}

/* 横画面：盤面のたかさを のこしたいので、コントローラーを下すみに おく */
@media (orientation:landscape){
  #pad{--dp:clamp(104px,25vh,152px);--ab:clamp(48px,11.5vh,70px);
       position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
  #pad .side{pointer-events:auto}
  .arena{padding-bottom:6px}
}
@media (orientation:landscape){
  .hud{padding:2px 10px;gap:6px}
  .slot{padding:4px 8px}
  .stats .v{font-size:16px}
}
@media (orientation:landscape) and (min-width:760px){
  .hud{padding:4px 16px}
  .slot.next{flex:none;min-width:190px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="veil"></div>

<div id="app">

  <!-- TITLE -->
  <section class="screen on" id="scTitle">
    <div class="wrap">
      <div class="logo"><b>ガラスのテトリス</b><span>G L A S S&nbsp; B L O C K S</span></div>
      <div class="menu">
        <button class="btn primary" data-go="solo">ひとりで あそぶ</button>
        <button class="btn" data-go="cpu">コンピュータと たいせん</button>
        <button class="btn" data-go="lobby">ふたりで たいせん</button>
      </div>
      <div class="pane" style="padding:14px;display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="lbl">スピード</div>
          <div class="seg" id="segSpeed">
            <button data-sp="0">ゆっくり</button>
            <button data-sp="1" aria-pressed="true">ふつう</button>
            <button data-sp="2">はやい</button>
          </div>
        </div>
        <div>
          <div class="lbl">おと</div>
          <div class="seg" id="segSound">
            <button data-sd="1" aria-pressed="true">おん</button>
            <button data-sd="0">おふ</button>
          </div>
        </div>
      </div>
      <div class="note" id="titleNote"></div>
    </div>
  </section>

  <!-- LOBBY -->
  <section class="screen" id="scLobby">
    <div class="wrap">
      <div class="logo" style="margin-bottom:2px"><b style="font-size:clamp(26px,8vw,36px)">ふたりで たいせん</b></div>
      <div class="pane" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <div><div class="lbl">なまえ</div><input id="inName" maxlength="10" placeholder="プレイヤー"></div>
        <div><div class="lbl">あいことば（おなじにする）</div><input id="inRoom" maxlength="16" placeholder="family"></div>
        <button class="btn primary" id="btnJoin">へやに はいる</button>
      </div>
      <div class="pane" id="roomPane" style="padding:16px;display:none;flex-direction:column;gap:12px">
        <div class="lbl">へやの ようす</div>
        <div id="roomList" class="note" style="font-size:14px;line-height:2"></div>
        <button class="btn primary" id="btnReady">じゅんび かんりょう</button>
      </div>
      <button class="btn" data-go="title">もどる</button>
      <div class="note" id="lobbyNote"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play">
    <div class="hud">
      <div class="slot pane"><div class="lbl">キープ</div><canvas id="holdCv" width="76" height="56"></canvas></div>
      <div class="stats pane">
        <div class="k">スコア</div><div class="v" id="stScore">0</div>
        <div class="sub"><span id="stLines">0</span> ライン ・ Lv <span id="stLevel">1</span></div>
        <div class="sub" id="stCombo" style="opacity:.9;color:#ffe7a1"></div>
        <button class="hudbtn" id="btnPause" aria-label="ポーズ">॥</button>
      </div>
      <div class="slot pane next"><div class="lbl">つぎ</div><canvas id="nextCv" width="150" height="46"></canvas></div>
    </div>

    <div class="arena">
      <div id="boardWrap">
        <div class="frame"></div>
        <canvas id="board"></canvas>
        <div id="danger"></div>
        <div id="gauge"><div id="gaugeFill"></div></div>
      </div>
      <div id="oppBox" class="pane">
        <div class="who" id="oppName">あいて</div>
        <canvas id="oppCv" width="80" height="160"></canvas>
        <div class="st" id="oppSt">-</div>
      </div>
      <div id="toast"></div>
    </div>

    <div id="pad">
      <div class="side">
        <div class="dpad" id="dpad">
          <span class="hub"></span>
          <b class="up">⤓</b><b class="left">◀</b><b class="right">▶</b><b class="down">▼</b>
        </div>
      </div>
      <div class="side">
        <div class="abs">
          <button class="ab keep" data-k="hold">キープ</button>
          <button class="ab b" data-k="rotL">B<small>ひだり</small></button>
          <button class="ab a" data-k="rotR">A<small>みぎ</small></button>
        </div>
      </div>
    </div>

    <div id="overlay"><div class="card pane" id="overlayCard"></div></div>
  </section>

</div>
<script>
/* ============================================================
   ガラスのテトリス — engine core
   ============================================================ */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- sound ---------------- */
const Snd = {
  ctx: null, on: true,
  boot() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  blip(freq, dur = .07, type = 'triangle', gain = .06, slide = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  },
  move() { this.blip(520, .035, 'square', .028); },
  rot() { this.blip(720, .05, 'triangle', .04, 120); },
  lock() { this.blip(200, .07, 'sine', .05, -60); },
  hold() { this.blip(880, .07, 'sine', .05, 220); },
  clear(n) { const base = [0, 620, 700, 800, 960][n] || 620; [0, 1, 2].forEach(i => setTimeout(() => this.blip(base * (1 + i * .26), .11, 'triangle', .055), i * 62)); },
  garbage() { this.blip(120, .18, 'sawtooth', .05, -50); },
  over() { [0, 1, 2, 3].forEach(i => setTimeout(() => this.blip(420 - i * 90, .2, 'sine', .06), i * 130)); },
  win() { [0, 1, 2, 3].forEach(i => setTimeout(() => this.blip(520 + i * 160, .16, 'triangle', .06), i * 110)); }
};

/* ---------------- pieces ---------------- */
const COLORS = {
  I: '#78E4F2', O: '#FFDF6B', T: '#C79CFF', S: '#88E6A6', Z: '#FF9CB6', J: '#8FA9FF', L: '#FFB579', G: '#B4B0C6'
};
const KEYS = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
const CHAR = { 0: '.', I: 'I', O: 'O', T: 'T', S: 'S', Z: 'Z', J: 'J', L: 'L', G: 'G' };

const SHAPES = {
  I: [[[0, 1], [1, 1], [2, 1], [3, 1]], [[2, 0], [2, 1], [2, 2], [2, 3]], [[0, 2], [1, 2], [2, 2], [3, 2]], [[1, 0], [1, 1], [1, 2], [1, 3]]],
  O: [[[1, 0], [2, 0], [1, 1], [2, 1]], [[1, 0], [2, 0], [1, 1], [2, 1]], [[1, 0], [2, 0], [1, 1], [2, 1]], [[1, 0], [2, 0], [1, 1], [2, 1]]],
  T: [[[1, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [1, 1], [2, 1], [1, 2]], [[0, 1], [1, 1], [2, 1], [1, 2]], [[1, 0], [0, 1], [1, 1], [1, 2]]],
  S: [[[1, 0], [2, 0], [0, 1], [1, 1]], [[1, 0], [1, 1], [2, 1], [2, 2]], [[1, 1], [2, 1], [0, 2], [1, 2]], [[0, 0], [0, 1], [1, 1], [1, 2]]],
  Z: [[[0, 0], [1, 0], [1, 1], [2, 1]], [[2, 0], [1, 1], [2, 1], [1, 2]], [[0, 1], [1, 1], [1, 2], [2, 2]], [[1, 0], [0, 1], [1, 1], [0, 2]]],
  J: [[[0, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [2, 0], [1, 1], [1, 2]], [[0, 1], [1, 1], [2, 1], [2, 2]], [[1, 0], [1, 1], [0, 2], [1, 2]]],
  L: [[[2, 0], [0, 1], [1, 1], [2, 1]], [[1, 0], [1, 1], [1, 2], [2, 2]], [[0, 1], [1, 1], [2, 1], [0, 2]], [[0, 0], [1, 0], [1, 1], [1, 2]]]
};

// SRS kicks — y は画面下方向を正に変換済み
const K_JLSTZ = {
  '01': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '10': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  '12': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  '21': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '23': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '32': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '30': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '03': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]]
};
const K_I = {
  '01': [[0, 0], [-2, 0], [1, 0], [-2, 1], [1, -2]],
  '10': [[0, 0], [2, 0], [-1, 0], [2, -1], [-1, 2]],
  '12': [[0, 0], [-1, 0], [2, 0], [-1, -2], [2, 1]],
  '21': [[0, 0], [1, 0], [-2, 0], [1, 2], [-2, -1]],
  '23': [[0, 0], [2, 0], [-1, 0], [2, -1], [-1, 2]],
  '32': [[0, 0], [-2, 0], [1, 0], [-2, 1], [1, -2]],
  '30': [[0, 0], [1, 0], [-2, 0], [1, 2], [-2, -1]],
  '03': [[0, 0], [-1, 0], [2, 0], [-1, -2], [2, 1]]
};

const COLS = 10, HIDDEN = 2, ROWS = 20, TOT = ROWS + HIDDEN;
const SPEEDS = [
  { g: 1.35, name: 'ゆっくり' },   // 倍率（大きいほど遅い）
  { g: 1.0, name: 'ふつう' },
  { g: 0.62, name: 'はやい' }
];

/* ---------------- game ---------------- */
class Game {
  constructor(opt = {}) {
    this.speedMul = opt.speedMul ?? 1;
    this.on = Object.assign({ attack() { }, clear() { }, lock() { }, over() { }, garbage() { } }, opt.on || {});
    this.reset(opt.seed ?? (Math.random() * 1e9) | 0);
  }
  reset(seed) {
    this.seed = seed >>> 0;
    this.rand = mulberry32(this.seed);
    this.grid = new Array(TOT * COLS).fill(0);
    this.bag = []; this.queue = [];
    for (let i = 0; i < 6; i++) this.queue.push(this.pull());
    this.hold = null; this.holdUsed = false;
    this.score = 0; this.lines = 0; this.level = 1;
    this.combo = -1; this.b2b = false;
    this.pending = 0;          // 受け待ちのお邪魔
    this.garbHole = (this.rand() * COLS) | 0;
    this.alive = true; this.paused = false;
    this.clearFx = null; this.shards = []; this.riseFx = 0;
    this.lastAction = null; this.lastKick = 0;
    this.dropTimer = 0; this.lockTimer = 0; this.lockResets = 0;
    this.startedAt = performance.now();
    this.spawn();
  }
  pull() {
    if (!this.bag.length) {
      this.bag = KEYS.slice();
      for (let i = this.bag.length - 1; i > 0; i--) { const j = (this.rand() * (i + 1)) | 0;[this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]]; }
    }
    return this.bag.pop();
  }
  gravityMs() {
    const l = this.level;
    const base = Math.pow(0.80 - (l - 1) * 0.007, l - 1) * 1000;
    return Math.max(28, base * this.speedMul);
  }
  cells(type, rot, x, y) { return SHAPES[type][rot].map(([cx, cy]) => [x + cx, y + cy]); }
  collide(type, rot, x, y) {
    for (const [cx, cy] of SHAPES[type][rot]) {
      const px = x + cx, py = y + cy;
      if (px < 0 || px >= COLS || py >= TOT) return true;
      if (py >= 0 && this.grid[py * COLS + px]) return true;
    }
    return false;
  }
  spawn(type) {
    this.cur = { type: type || this.queue.shift(), rot: 0, x: 3, y: 0 };
    while (this.queue.length < 6) this.queue.push(this.pull());
    this.holdUsed = false; this.lockTimer = 0; this.lockResets = 0; this.dropTimer = 0;
    this.lastAction = null;
    if (this.collide(this.cur.type, 0, this.cur.x, this.cur.y)) this.die();
  }
  die() { if (!this.alive) return; this.alive = false; Snd.over(); this.on.over(); }

  move(dx) {
    if (!this.alive || this.paused || this.clearFx) return false;
    const c = this.cur;
    if (!this.collide(c.type, c.rot, c.x + dx, c.y)) {
      c.x += dx; this.lastAction = 'move'; this.touchLock(); Snd.move(); return true;
    }
    return false;
  }
  rotate(dir) {
    if (!this.alive || this.paused || this.clearFx) return false;
    const c = this.cur;
    if (c.type === 'O') return false;
    const to = (c.rot + (dir > 0 ? 1 : 3)) % 4;
    const table = c.type === 'I' ? K_I : K_JLSTZ;
    const kicks = table['' + c.rot + to] || [[0, 0]];
    for (let i = 0; i < kicks.length; i++) {
      const [kx, ky] = kicks[i];
      if (!this.collide(c.type, to, c.x + kx, c.y + ky)) {
        c.rot = to; c.x += kx; c.y += ky;
        this.lastAction = 'rot'; this.lastKick = i;
        this.touchLock(); Snd.rot(); return true;
      }
    }
    return false;
  }
  touchLock() {
    const c = this.cur;
    if (this.collide(c.type, c.rot, c.x, c.y + 1) && this.lockResets < 15) { this.lockTimer = 0; this.lockResets++; }
  }
  softDrop() {
    if (!this.alive || this.paused || this.clearFx) return;
    const c = this.cur;
    if (!this.collide(c.type, c.rot, c.x, c.y + 1)) { c.y++; this.score += 1; this.dropTimer = 0; this.lastAction = 'move'; }
    else this.lockTimer = 999999;
  }
  hardDrop() {
    if (!this.alive || this.paused || this.clearFx) return;
    const c = this.cur; let d = 0;
    while (!this.collide(c.type, c.rot, c.x, c.y + 1)) { c.y++; d++; }
    this.score += d * 2; this.lastAction = 'move';
    this.lockPiece();
  }
  swapHold() {
    if (!this.alive || this.paused || this.holdUsed || this.clearFx) return;
    const t = this.cur.type;
    if (this.hold) { const h = this.hold; this.hold = t; this.spawn(h); }
    else { this.hold = t; this.spawn(); }
    this.holdUsed = true; Snd.hold();
  }
  ghostY() {
    const c = this.cur; let y = c.y;
    while (!this.collide(c.type, c.rot, c.x, y + 1)) y++;
    return y;
  }

  tspin() {
    const c = this.cur;
    if (c.type !== 'T' || this.lastAction !== 'rot') return 0;
    const cx = c.x + 1, cy = c.y + 1;
    const at = (x, y) => (x < 0 || x >= COLS || y >= TOT) ? 1 : (y < 0 ? 0 : (this.grid[y * COLS + x] ? 1 : 0));
    const corners = [at(cx - 1, cy - 1), at(cx + 1, cy - 1), at(cx - 1, cy + 1), at(cx + 1, cy + 1)];
    const n = corners.reduce((a, b) => a + b, 0);
    if (n < 3) return 0;
    // 前方の2つ（向きに応じて）が埋まっていれば full
    const front = [[0, 1], [1, 3], [3, 2], [2, 0]][c.rot];
    const full = corners[front[0]] && corners[front[1]];
    if (full || this.lastKick === 4) return 2; // full
    return 1; // mini
  }

  lockPiece() {
    const c = this.cur;
    const ts = this.tspin();
    for (const [px, py] of this.cells(c.type, c.rot, c.x, c.y)) {
      if (py >= 0) this.grid[py * COLS + px] = c.type;
    }
    Snd.lock(); this.on.lock();

    const rows = [];
    for (let y = 0; y < TOT; y++) {
      let full = true;
      for (let x = 0; x < COLS; x++) if (!this.grid[y * COLS + x]) { full = false; break; }
      if (full) rows.push(y);
    }
    const n = rows.length;

    if (n) {
      this.combo++;
      const hard = (n === 4) || (ts > 0);
      let atk = [0, 0, 1, 2, 4][n];
      let label = '', pts = [0, 100, 300, 500, 800][n] * this.level;
      if (ts === 2) { atk = [0, 2, 4, 6][n] || 6; pts = [0, 800, 1200, 1600][n] * this.level; label = ['', 'T-SPIN SINGLE', 'T-SPIN DOUBLE', 'T-SPIN TRIPLE'][n]; }
      else if (ts === 1) { atk = n >= 2 ? 1 : 0; pts = 200 * this.level; label = 'T-SPIN MINI'; }
      else label = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS'][n];
      if (this.b2b && hard) { atk += 1; pts = (pts * 1.5) | 0; label = 'B2B ' + label; }
      const cb = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4, 4, 5][Math.min(this.combo, 11)] || 0;
      atk += cb;
      // perfect clear
      let empty = true;
      for (let i = 0; i < TOT * COLS; i++) { if (this.grid[i] && rows.indexOf((i / COLS) | 0) < 0) { empty = false; break; } }
      if (empty) { atk += 10; pts += 2000 * this.level; label = 'PERFECT CLEAR'; }

      this.b2b = hard;
      this.score += pts;
      this.lines += n;
      this.level = 1 + ((this.lines / 10) | 0);

      // 相殺
      const cancel = Math.min(this.pending, atk);
      this.pending -= cancel; const out = atk - cancel;
      if (out > 0) this.on.attack(out);

      this.on.clear({ n, label, combo: this.combo, atk: out });
      Snd.clear(n);
      this.clearFx = { rows, t: 0 };
      this.makeShards(rows);
    } else {
      this.combo = -1;
      this.applyPending();
      this.spawn();
    }
  }
  finishClear() {
    const rows = this.clearFx.rows.slice().sort((a, b) => a - b);
    for (const y of rows) {
      for (let yy = y; yy > 0; yy--) for (let x = 0; x < COLS; x++) this.grid[yy * COLS + x] = this.grid[(yy - 1) * COLS + x];
      for (let x = 0; x < COLS; x++) this.grid[x] = 0;
    }
    this.clearFx = null;
    this.applyPending();
    this.spawn();
  }
  applyPending() {
    if (!this.pending) return;
    const n = Math.min(this.pending, 8);
    this.pending -= n;
    for (let k = 0; k < n; k++) {
      for (let y = 0; y < TOT - 1; y++) for (let x = 0; x < COLS; x++) this.grid[y * COLS + x] = this.grid[(y + 1) * COLS + x];
      if (this.rand() < 0.32) this.garbHole = (this.rand() * COLS) | 0;
      for (let x = 0; x < COLS; x++) this.grid[(TOT - 1) * COLS + x] = (x === this.garbHole) ? 0 : 'G';
    }
    this.riseFx = 1; Snd.garbage();
    // 押し出しで詰んだら終了
    if (this.collide(this.cur.type, this.cur.rot, this.cur.x, this.cur.y)) {
      if (!this.collide(this.cur.type, this.cur.rot, this.cur.x, this.cur.y - 1)) this.cur.y--;
      else this.die();
    }
  }
  addGarbage(n) { if (!this.alive) return; this.pending += n; }

  makeShards(rows) {
    if (REDUCED) return;
    for (const y of rows) for (let x = 0; x < COLS; x++) {
      const t = this.grid[y * COLS + x] || 'G';
      for (let i = 0; i < 2; i++) this.shards.push({
        x: x + Math.random(), y: y + Math.random(), vx: (Math.random() - .5) * .09,
        vy: -Math.random() * .06, life: 1, c: COLORS[t] || '#fff', s: .18 + Math.random() * .3
      });
    }
  }
  danger() {
    for (let y = HIDDEN; y < HIDDEN + 5; y++) for (let x = 0; x < COLS; x++) if (this.grid[y * COLS + x]) return true;
    return false;
  }
  serialize() {
    let s = '';
    const g = this.grid.slice();
    if (this.alive && this.cur) for (const [px, py] of this.cells(this.cur.type, this.cur.rot, this.cur.x, this.cur.y)) if (py >= 0) g[py * COLS + px] = this.cur.type;
    for (let i = HIDDEN * COLS; i < TOT * COLS; i++) s += CHAR[g[i]] || '.';
    return s;
  }
  update(dt) {
    if (!this.alive || this.paused) return;
    if (this.riseFx > 0) this.riseFx = Math.max(0, this.riseFx - dt / 260);
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const p = this.shards[i];
      p.vy += 0.00028 * dt; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.life -= dt / 620;
      if (p.life <= 0) this.shards.splice(i, 1);
    }
    if (this.clearFx) { this.clearFx.t += dt; if (this.clearFx.t > 250) this.finishClear(); return; }

    this.dropTimer += dt;
    const gms = this.gravityMs();
    while (this.dropTimer >= gms) {
      this.dropTimer -= gms;
      const c = this.cur;
      if (!this.collide(c.type, c.rot, c.x, c.y + 1)) { c.y++; this.lastAction = 'move'; }
      else break;
    }
    const c = this.cur;
    if (this.collide(c.type, c.rot, c.x, c.y + 1)) {
      this.lockTimer += dt;
      if (this.lockTimer >= 500) this.lockPiece();
    } else this.lockTimer = 0;
  }
}

/* ============================================================
   描画層 — ガラスブロック・盤面・背景ステージ
   ============================================================ */

/* ---------- 立体ガラスセル ---------- */
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (k > 0) { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  else { r *= (1 + k); g *= (1 + k); b *= (1 + k); }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* セル1つを「厚みのあるガラスの粒」として描く。
   光は左上から。奥行きは右下へ押し出す。
   グラデーションを毎フレーム作るとタブレットで重いので、
   色・サイズ・不透明度ごとにスプライトへ焼いて使い回す。 */
const _sprites = new Map();
function cellSprite(color, s, a, d) {
  const key = color + '|' + Math.round(s) + '|' + Math.round(a * 100) + '|' + Math.round(d);
  let sp = _sprites.get(key);
  if (sp) return sp;
  if (_sprites.size > 140) _sprites.clear();
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = s + d + 2;
  sp = document.createElement('canvas');
  sp.width = Math.ceil(W * dpr); sp.height = Math.ceil(W * dpr);
  const c = sp.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintGlass(c, 0, 0, s, color, a, d);
  sp._w = W;
  _sprites.set(key, sp);
  return sp;
}
function glassCell(ctx, px, py, s, color, opt = {}) {
  const a = opt.alpha ?? 0.66;
  const d = opt.depth ?? Math.max(2, s * 0.17);
  const sp = cellSprite(color, s, a, d);
  ctx.drawImage(sp, px, py, sp._w, sp._w);
}

function paintGlass(ctx, ox, oy, s, color, a, d) {
  const pad = s * 0.045;
  const x = ox + pad, y = oy + pad, w = s - pad * 2, h = s - pad * 2;
  const r = s * 0.24;

  // --- 押し出し側面（右 + 下）
  ctx.save();
  ctx.globalAlpha = a * 0.82;
  ctx.fillStyle = shade(color, -0.42);
  roundRect(ctx, x + d, y + d, w, h, r);
  ctx.fill();
  ctx.restore();

  // --- 天面（本体）
  ctx.save();
  ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, shade(color, .46));
  g.addColorStop(.42, color);
  g.addColorStop(1, shade(color, -.22));
  ctx.fillStyle = g;
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();

  // 内側の暗がり（右下）＝ガラスの肉厚
  const g2 = ctx.createLinearGradient(x + w * .35, y + h * .35, x + w, y + h);
  g2.addColorStop(0, 'rgba(0,0,0,0)');
  g2.addColorStop(1, 'rgba(20,10,40,.36)');
  ctx.fillStyle = g2; ctx.fill();
  ctx.restore();

  // --- ふち（屈折の線）
  ctx.save();
  ctx.globalAlpha = Math.min(1, a + .22);
  ctx.lineWidth = Math.max(1, s * 0.055);
  ctx.strokeStyle = shade(color, .62);
  roundRect(ctx, x, y, w, h, r);
  ctx.stroke();
  ctx.restore();

  // --- ハイライト（左上のツヤ）
  ctx.save();
  ctx.globalAlpha = a * .85;
  const hg = ctx.createLinearGradient(x, y, x, y + h * .58);
  hg.addColorStop(0, 'rgba(255,255,255,.85)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  roundRect(ctx, x + w * .12, y + h * .08, w * .76, h * .42, r * .8);
  ctx.fill();
  // 点の輝き
  ctx.globalAlpha = a * .9;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.ellipse(x + w * .27, y + h * .22, w * .10, h * .07, -0.5, 0, 7);
  ctx.fill();
  ctx.restore();
}

function ghostCell(ctx, px, py, s, color) {
  const pad = s * 0.14;
  ctx.save();
  ctx.globalAlpha = .30;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.2, s * 0.07);
  ctx.setLineDash([s * .22, s * .18]);
  roundRect(ctx, px + pad, py + pad, s - pad * 2, s - pad * 2, s * .2);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 盤面 ---------- */
function drawBoard(cv, game) {
  const ctx = cv.getContext('2d');
  const dpr = cv._dpr || 1;
  const W = cv.width / dpr, H = cv.height / dpr;
  const s = W / COLS;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 盤面の底（すりガラス）
  ctx.save();
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'rgba(10,6,26,.17)');
  bg.addColorStop(.55, 'rgba(10,6,26,.26)');
  bg.addColorStop(1, 'rgba(10,6,26,.38)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // グリッド
  ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 1; x < COLS; x++) { ctx.moveTo(x * s, 0); ctx.lineTo(x * s, H); }
  for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * s); ctx.lineTo(W, y * s); }
  ctx.stroke();
  ctx.restore();

  const flash = game.clearFx ? Math.max(0, 1 - game.clearFx.t / 250) : 0;

  // 固定ブロック
  for (let y = HIDDEN; y < TOT; y++) {
    const rowClearing = game.clearFx && game.clearFx.rows.indexOf(y) >= 0;
    for (let x = 0; x < COLS; x++) {
      const t = game.grid[y * COLS + x];
      if (!t) continue;
      const px = x * s, py = (y - HIDDEN) * s;
      if (rowClearing) {
        ctx.save();
        ctx.globalAlpha = flash;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff'; ctx.shadowBlur = s * .8;
        roundRect(ctx, px + s * .04, py + s * .04, s * .92, s * .92, s * .24);
        ctx.fill();
        ctx.restore();
      } else {
        glassCell(ctx, px, py, s, COLORS[t] || '#B4B0C6', { alpha: t === 'G' ? .46 : .62 });
      }
    }
  }

  // ゴースト + 現在のピース
  if (game.alive && game.cur && !game.clearFx) {
    const c = game.cur, col = COLORS[c.type];
    const gy = game.ghostY();
    if (gy !== c.y) for (const [x, y] of game.cells(c.type, c.rot, c.x, gy)) {
      if (y >= HIDDEN) ghostCell(ctx, x * s, (y - HIDDEN) * s, s, col);
    }
    for (const [x, y] of game.cells(c.type, c.rot, c.x, c.y)) {
      if (y >= HIDDEN) glassCell(ctx, x * s, (y - HIDDEN) * s, s, col, { alpha: .80 });
      else if (y >= 0) { ctx.save(); ctx.globalAlpha = .25; glassCell(ctx, x * s, -s * (HIDDEN - y) * 0.35, s, col, { alpha: .3 }); ctx.restore(); }
    }
  }

  // 破片
  for (const p of game.shards) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life) * .8;
    ctx.fillStyle = p.c;
    ctx.shadowColor = p.c; ctx.shadowBlur = s * .5;
    const w = s * p.s;
    roundRect(ctx, p.x * s, (p.y - HIDDEN) * s, w, w, w * .3);
    ctx.fill();
    ctx.restore();
  }

  // せり上がりの残光
  if (game.riseFx > 0) {
    ctx.save();
    const gg = ctx.createLinearGradient(0, H, 0, H * .55);
    gg.addColorStop(0, `rgba(255,86,120,${.42 * game.riseFx})`);
    gg.addColorStop(1, 'rgba(255,86,120,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // 上端のガラス反射
  ctx.save();
  const rg = ctx.createLinearGradient(0, 0, 0, H * .18);
  rg.addColorStop(0, 'rgba(255,255,255,.16)');

}

/* ---------- 小さいプレビュー ---------- */
function drawPiecePreview(cv, type, scale) {
  const ctx = cv.getContext('2d');
  const dpr = cv._dpr || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.clearRect(0, 0, W, H);
  if (!type) return;
  const cells = SHAPES[type][0];
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const bw = maxx - minx + 1, bh = maxy - miny + 1;
  const s = scale ?? Math.min(W / (bw + .6), H / (bh + .6));
  const ox = (W - bw * s) / 2, oy = (H - bh * s) / 2;
  for (const [cx, cy] of cells) glassCell(ctx, ox + (cx - minx) * s, oy + (cy - miny) * s, s, COLORS[type], { alpha: .78, depth: s * .15 });
}
function drawNext(cv, queue) {
  const ctx = cv.getContext('2d');
  const dpr = cv._dpr || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.clearRect(0, 0, W, H);
  const horiz = W > H;                       // たてがき／よこがき を自動でえらぶ
  const n = Math.min(horiz ? 3 : 4, queue.length);
  if (!n) return;
  const slotW = horiz ? W / n : W;
  const slotH = horiz ? H : H / n;
  for (let i = 0; i < n; i++) {
    const type = queue[i];
    const cells = SHAPES[type][0];
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const bw = maxx - minx + 1, bh = maxy - miny + 1;
    const grow = i === 0 ? 1 : .8;
    const s = Math.min(slotW / (bw + .7), slotH / (bh + .7)) * grow;
    const ox = (horiz ? i * slotW : 0) + (slotW - bw * s) / 2;
    const oy = (horiz ? 0 : i * slotH) + (slotH - bh * s) / 2;
    ctx.save(); ctx.globalAlpha = i === 0 ? 1 : .66;
    for (const [cx, cy] of cells) glassCell(ctx, ox + (cx - minx) * s, oy + (cy - miny) * s, s, COLORS[type], { alpha: .74, depth: s * .15 });
    ctx.restore();
  }
}
function drawMini(cv, str, alive) {
  const ctx = cv.getContext('2d');
  const dpr = cv._dpr || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10,6,24,.34)'; ctx.fillRect(0, 0, W, H);
  if (!str) return;
  const s = W / COLS;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i]; if (ch === '.') continue;
    const x = i % COLS, y = (i / COLS) | 0;
    const col = COLORS[ch] || '#B4B0C6';
    ctx.save();
    ctx.globalAlpha = alive ? .88 : .3;
    ctx.fillStyle = col;
    roundRect(ctx, x * s + .5, y * s + .5, s - 1, s - 1, Math.max(1, s * .25));
    ctx.fill();
    ctx.globalAlpha = alive ? .5 : .18;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    roundRect(ctx, x * s + .5, y * s + .5, s - 1, (s - 1) * .45, Math.max(1, s * .22));
    ctx.fill();
    ctx.restore();
  }
  if (!alive) {
    ctx.save(); ctx.fillStyle = 'rgba(12,8,28,.5)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

    this.rnd = Array.from({ length: 64 }, () => ({ a: Math.random(), b: Math.random(), c: Math.random() }));
    this.idx = (Math.random() * STAGES.length) | 0;
    this.resize();
    addEventListener('resize', () => this.resize());
  },
  resize() {
    this.dpr = Math.min(2, devicePixelRatio || 1);
    this.W = innerWidth; this.H = innerHeight;
    this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
  },
  go(i) { if (i === this.idx || this.next >= 0) return; this.next = i % STAGES.length; this.mix = 0; },
  cycle() { this.go((this.idx + 1) % STAGES.length); },
  sky(c, st) {
    const g = c.createLinearGradient(0, 0, 0, this.H);
    st.sky.forEach((col, i) => g.addColorStop(i / (st.sky.length - 1), col));
    c.fillStyle = g; c.fillRect(0, 0, this.W, this.H);
  },
  draw(t, dt) {
    const c = this.ctx;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.timer += dt;
    if (this.timer > 42000 && this.next < 0) { this.timer = 0; this.cycle(); }
    const cur = STAGES[this.idx];
    this.sky(c, cur); cur.paint(c, t, this.W, this.H, this.rnd);
    let dim = cur.dim || 0;
    if (this.next >= 0) {
      this.mix = Math.min(1, this.mix + dt / 1600);
      c.save(); c.globalAlpha = this.mix;
      const nx = STAGES[this.next];
      this.sky(c, nx); nx.paint(c, t, this.W, this.H, this.rnd);
      c.restore();
      dim = P(this.mix, dim, nx.dim || 0);
      if (this.mix >= 1) { this.idx = this.next; this.next = -1; this.timer = 0; }
    }
    // あかるいステージでも文字が読めるように、ひかえめに落とす
    if (dim > 0) { c.fillStyle = `rgba(20,14,40,${dim})`; c.fillRect(0, 0, this.W, this.H); }

/* ---------- CPU ---------- */
class Bot {
  constructor(level = 1) { this.level = level; this.plan = null; this.t = 0; this.think = 0; }
  evaluate(grid) {
    const h = new Array(COLS).fill(0);
    let holes = 0, agg = 0, bump = 0, wells = 0;
    for (let x = 0; x < COLS; x++) {
      let seen = false;
      for (let y = 0; y < TOT; y++) {
        if (grid[y * COLS + x]) { if (!seen) { seen = true; h[x] = TOT - y; } }
        else if (seen) holes++;
      }
      agg += h[x];
    }
    for (let x = 0; x < COLS - 1; x++) bump += Math.abs(h[x] - h[x + 1]);
    const maxh = Math.max(...h);
    return { agg, holes, bump, maxh, h };
  }
  best(game) {
    const t = game.cur.type;
    let best = null;
    const rots = t === 'O' ? 1 : (t === 'I' || t === 'S' || t === 'Z') ? 2 : 4;
    for (let r = 0; r < rots; r++) {
      for (let x = -2; x < COLS + 2; x++) {
        if (game.collide(t, r, x, 0)) continue;
        let y = 0;
        while (!game.collide(t, r, x, y + 1)) y++;
        const g = game.grid.slice();
        let ok = true;
        for (const [px, py] of game.cells(t, r, x, y)) { if (py < 0) { ok = false; break; } g[py * COLS + px] = t; }
        if (!ok) continue;
        let lines = 0;
        for (let yy = 0; yy < TOT; yy++) { let f = true; for (let xx = 0; xx < COLS; xx++) if (!g[yy * COLS + xx]) { f = false; break; } if (f) lines++; }
        const e = this.evaluate(g);
        let s = -0.52 * e.agg + 0.86 * lines * (lines >= 4 ? 1.9 : 1) - 0.42 * e.holes - 0.19 * e.bump - 0.28 * Math.max(0, e.maxh - 14);
        s += (Math.random() - .5) * (this.level === 0 ? 6 : this.level === 1 ? 2.2 : 0.5);
        if (!best || s > best.s) best = { s, r, x };
      }
    }
    return best;
  }
  step(game, dt) {
    if (!game.alive || game.clearFx || game.paused) { this.plan = null; return; }
    if (!this.plan) {
      this.plan = this.best(game);
      this.think = this.level === 0 ? 420 : this.level === 1 ? 210 : 90;
      return;
    }
    this.t += dt;
    const gap = this.level === 0 ? 150 : this.level === 1 ? 85 : 42;
    if (this.think > 0) { this.think -= dt; return; }
    if (this.t < gap) return;
    this.t = 0;
    const p = this.plan;
    if (game.cur.rot !== p.r) { game.rotate(1); return; }
    if (game.cur.x < p.x) { if (!game.move(1)) { this.plan = null; } return; }
    if (game.cur.x > p.x) { if (!game.move(-1)) { this.plan = null; } return; }
    game.hardDrop();
    this.plan = null;
  }
}

   つなぎかた
     https 配信（GitHub Pages など）→ WebRTC でちょくせつ
     http  配信（おうちの relay.py）→ リレーごし
     file://                        → たいせんなし
   ?link=p2p / ?link=relay で うわがきできる

const LINK_MODE = (() => {
  const q = new URLSearchParams(location.search).get('link');
  if (q === 'p2p' || q === 'relay') return q;
  if (location.protocol === 'https:') return 'p2p';
  if (location.protocol === 'http:') return 'relay';
  return null;                       // file:// は たいせん不可
})();

const PEERJS_CDN = [
  'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js',
  'https://unpkg.com/peerjs@1/dist/peerjs.min.js'
];
let peerjsPromise = null;
function loadPeerJS() {
  if (window.Peer) return Promise.resolve();
  if (peerjsPromise) return peerjsPromise;
  peerjsPromise = new Promise((res, rej) => {
    let i = 0;
    (function next() {
      if (i >= PEERJS_CDN.length) return rej(new Error('cdn'));
      const s = document.createElement('script');
      s.src = PEERJS_CDN[i++];
      s.onload = () => (window.Peer ? res() : next());
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
  return peerjsPromise;
}
// あいことばは そのままの形では ブローカーに ながさない
function roomKey(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return 'gt5' + (h >>> 0).toString(36);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- うわむきの まとめ役 ---------- */
const Link = {
  kind: null, room: '', name: '', ready: false, isHost: false, matchId: null, impl: null, peer: null,
  note(t) { const el = $('#lobbyNote'); if (el) el.textContent = t; },
  clearPeer() { this.peer = { name: 'あいて', ready: false, alive: true, state: null, present: false }; },
  start(room, name) {
    this.stop();
    this.kind = LINK_MODE; this.room = room; this.name = name;
    this.ready = false; this.matchId = null; this.isHost = false;
    this.clearPeer();
    this.impl = this.kind === 'p2p' ? P2PNet : RelayNet;
    this.impl.start(room, name);
  },
  stop() { if (this.impl) { try { this.impl.stop(); } catch (e) { } this.impl = null; } this.ready = false; this.clearPeer(); },
  setReady(v) { this.ready = v; if (this.impl) this.impl.ready(v); },
  attack(n) { if (this.impl) this.impl.attack(n); },
  pushDead() { if (this.impl) this.impl.dead(); },
  onGarbage(n) { if (n > 0 && UI.game && UI.screen === 'play') UI.game.addGarbage(n); },
  onMatch(m) {
    if (!m || m.id === this.matchId) return;
    this.matchId = m.id;
    this.ready = false; this.peer.ready = false; this.peer.alive = true; this.peer.state = null;
    startVersus(m);
  }
};
Link.clearPeer();

/* ---------- おうちの PC ごし（relay.py） ---------- */
const RelayNet = {
  id: 'p' + Math.random().toString(36).slice(2, 9),
  timer: null, out: 0, fails: 0, room: '', name: '',
  start(room, name) {
    this.room = room; this.name = name; this.out = 0; this.fails = 0;
    Link.note('おうちの PC ごしに つないでいます…');
    this.tick();
    this.timer = setInterval(() => this.tick(), 120);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  ready() { },                    // つぎの tick で いっしょに おくる
  attack(n) { this.out += n; },
  dead() { },                     // alive フラグで つたわる
  async tick() {
    const g = UI.game;
    const body = {
      room: this.room, id: this.id, name: this.name, ready: Link.ready,
      send: this.out, alive: g ? g.alive : true,
      state: (UI.screen === 'play' && g) ? { board: g.serialize(), lines: g.lines, level: g.level } : null
    };
    this.out = 0;
    try {
      const r = await fetch('api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('http');
      const res = await r.json();
      if (this.fails >= 6) Link.note('つながりました。');
      this.fails = 0;
      const o = (res.others || [])[0];
      if (o) {
        Link.peer.present = true; Link.peer.name = o.name || 'あいて';
        Link.peer.ready = !!o.ready; Link.peer.state = o.state;
        if (o.alive === false) Link.peer.alive = false;   // 生き返らせない
      }
      else Link.peer.present = false;
      Link.onGarbage(res.garbage || 0);
      Link.onMatch(res.match);
    } catch (e) {
      if (++this.fails === 6) Link.note('おうちの PC に つながりません。relay.py が うごいているか かくにんしてね。');
    }
  }
};

/* ---------- WebRTC でちょくせつ（PeerJS） ---------- */
const P2PNet = {
  peer: null, conn: null, timer: null, gen: 0, retries: 0, isHost: false, room: '', name: '',
  async start(room, name) {
    this.room = room; this.name = name; this.retries = 0;
    Link.note('つなぎに いく ぶひんを よみこんでいます…');
    try { await loadPeerJS(); }
    catch (e) { Link.note('ぶひんを よみこめませんでした。インターネットに つながっているか かくにんしてね。'); return; }
    this.claim();
  },
  // まず ホストとして 名のる。とられていたら ゲストに まわる
  claim() { this.mk(roomKey(this.room) + '-h', true); },
  mk(id, asHost) {
    const gen = ++this.gen;
    if (this.peer) { try { this.peer.destroy(); } catch (e) { } this.peer = null; }
    const p = new window.Peer(id || undefined, { debug: 0 });
    this.peer = p; this.isHost = asHost; Link.isHost = asHost;
    p.on('open', () => {
      if (gen !== this.gen) return;
      if (asHost) Link.note('あいてを まっています…');
      else { Link.note('あいてに つないでいます…'); this.bind(p.connect(roomKey(this.room) + '-h', { reliable: true })); }
    });
    p.on('connection', c => { if (gen !== this.gen) return; asHost ? this.bind(c) : c.close(); });
    p.on('disconnected', () => { if (gen === this.gen) { try { p.reconnect(); } catch (e) { } } });
    p.on('error', err => {
      if (gen !== this.gen) return;
      const t = err && err.type;
      if (asHost && t === 'unavailable-id') { this.mk(null, false); return; }
      if (!asHost && t === 'peer-unavailable') {
        // ホストが きえた／まだ いない → もういちど ホストを ねらう
        if (this.retries++ < 15) setTimeout(() => { if (gen === this.gen) this.claim(); }, 1200);
        else Link.note('あいてが みつかりません。あいことばが おなじか かくにんしてね。');
        return;
      }
      if (t === 'network' || t === 'server-error' || t === 'socket-error') {
        Link.note('よびだし サーバーに つながりません。しばらくして やりなおしてね。'); return;
      }
      Link.note('つなぐのに しっぱいしました（' + (t || '?') + '）');
    });
  },
  bind(c) {
    this.conn = c;
    c.on('open', () => {
      this.retries = 0;
      Link.peer.present = true;
      Link.note('つながりました。');
      this.send({ t: 'hello', name: this.name, ready: Link.ready });
      clearInterval(this.timer);
      this.timer = setInterval(() => this.pump(), 110);
    });
    c.on('data', d => this.recv(d));
    c.on('close', () => { Link.peer.present = false; clearInterval(this.timer); Link.note('あいてが きれました。'); });
    c.on('error', () => { });
  },
  send(o) { try { if (this.conn && this.conn.open) this.conn.send(o); } catch (e) { } },
  stop() {
    this.gen++;
    clearInterval(this.timer); this.timer = null;
    try { this.conn && this.conn.close(); } catch (e) { }
    try { this.peer && this.peer.destroy(); } catch (e) { }
    this.conn = null; this.peer = null;
  },
  ready(v) { this.send({ t: 'ready', v }); this.maybeStart(); },
  attack(n) { this.send({ t: 'atk', n }); },
  dead() { this.send({ t: 'dead' }); },
  pump() {
    const g = UI.game;
    if (UI.screen === 'play' && g) this.send({ t: 'st', b: g.serialize(), l: g.lines, lv: g.level, a: g.alive });
  },
  // 開始のあいずは ホストが 出す（シードも ホストが きめる）
  maybeStart() {
    if (!this.isHost || !this.conn || !this.conn.open) return;
    if (!(Link.ready && Link.peer.ready)) return;
    const m = { id: 'm' + Date.now(), seed: (Math.random() * 1e9) | 0 };
    this.send({ t: 'start', id: m.id, seed: m.seed });
    Link.onMatch(m);
  },
  recv(d) {
    if (!d || !d.t) return;
    switch (d.t) {
      case 'hello': Link.peer.present = true; Link.peer.name = d.name || 'あいて'; Link.peer.ready = !!d.ready; this.maybeStart(); break;
      case 'ready': Link.peer.ready = !!d.v; this.maybeStart(); break;
      case 'start': Link.onMatch({ id: d.id, seed: d.seed }); break;
      case 'st':
        Link.peer.state = { board: d.b, lines: d.l, level: d.lv };
        if (d.a === false) Link.peer.alive = false;       // 生き返らせない
        break;
      case 'atk': Link.onGarbage(d.n || 0); break;
      case 'dead': Link.peer.alive = false; break;
    }
  }
};

/* ---------- ゲーム開始 ---------- */
function makeGame(seed) {
  return new Game({
    seed, speedMul: SPEEDS[UI.speed].g,
    on: {
      attack(n) {
        if (UI.mode === 'cpu' && UI.cpu) UI.cpu.addGarbage(n);
        else if (UI.mode === 'net') Link.attack(n);
      },
      clear(info) {
        if (info.label && info.label !== 'SINGLE') toast(info.label, '#FFF2C6');
        else if (info.combo >= 2) toast(info.combo + ' れんさ！', '#BFF0FF');
      },
      over() { endGame(false); }
    }
  });
}

function startSolo(mode) {
  UI.mode = mode; UI.over = false;
  const seed = (Math.random() * 1e9) | 0;
  UI.game = makeGame(seed);
  if (mode === 'cpu') {
    UI.cpu = new Game({
      seed: seed + 1, speedMul: SPEEDS[UI.speed].g,
      on: { attack(n) { if (UI.game) UI.game.addGarbage(n); }, over() { endGame(true); } }
    });
    UI.cpuBrain = new Bot(UI.speed);
    $('#oppBox').classList.add('on');
    $('#oppName').textContent = 'コンピュータ';
  } else {
    UI.cpu = null; UI.cpuBrain = null;
    $('#oppBox').classList.remove('on');
  }
  $('#overlay').classList.remove('on');
  show('play');
  toast('スタート！', '#fff');
}

function startVersus(m) {
  UI.mode = 'net'; UI.over = false;
  UI.cpu = null; UI.cpuBrain = null;
  UI.game = makeGame(m.seed);
  UI.game.paused = true;
  $('#oppBox').classList.add('on');
  $('#oppName').textContent = Link.peer.name;
  $('#overlay').classList.remove('on');
  show('play');
  let k = 3;
  toast('3', '#fff');
  const iv = setInterval(() => {
    k--;
    if (k > 0) toast(String(k), '#fff');
    else {
      clearInterval(iv);
      toast('スタート！', '#FFF2C6');
      if (UI.game) { UI.game.paused = false; UI.game.startedAt = performance.now(); }
    }
  }, 800);
}

function endGame(win, reason) {
  if (UI.over) return;
  UI.over = true;
  const g = UI.game;
  if (UI.mode === 'net' && !win && reason !== 'disc') Link.pushDead();
  if (win) Snd.win();
  let title = 'ゲームオーバー', sub = 'また あそんでね';
  if (reason === 'disc') { title = 'ちゅうだん'; sub = 'あいてとの せつぞくが きれました'; }
  else if (UI.mode !== 'solo') { title = win ? 'かち！ 🎉' : 'まけ…'; sub = win ? 'つよい！' : 'つぎは いける'; }
  $('#overlayCard').innerHTML = `
    <h2>${title}</h2>
    <div class="big">${g.score.toLocaleString()}</div>
    <div class="note" style="font-size:13px">${g.lines} ライン ・ Lv ${g.level}<br>${sub}</div>
    <button class="btn primary" id="btnAgain">もういちど</button>
    <button class="btn" id="btnHome">メニューに もどる</button>`;
  $('#overlay').classList.add('on');
  $('#btnAgain').onclick = () => {
    if (UI.mode === 'net') { $('#overlay').classList.remove('on'); show('lobby'); Link.setReady(true); }
    else startSolo(UI.mode);
  };
  $('#btnHome').onclick = () => { if (UI.mode === 'net') Link.stop(); $('#overlay').classList.remove('on'); show('title'); };
}

/* ---------- 入力 ---------- */
const Keys = {
  das: 150, arr: 40,
  held: {}, timers: {},
  press(k) {
    const g = UI.game; if (!g) return;
    if (k === 'left') g.move(-1);
    else if (k === 'right') g.move(1);
    else if (k === 'down') g.softDrop();
    else if (k === 'drop') g.hardDrop();
    else if (k === 'rotR') g.rotate(1);
    else if (k === 'rotL') g.rotate(-1);
    else if (k === 'hold') g.swapHold();
    else if (k === 'pause') togglePause();
  },
  down(k, repeatable) {
    if (this.held[k]) return;
    this.held[k] = true;
    this.press(k);
    if (!repeatable) return;
    this.timers[k] = setTimeout(() => {
      this.timers[k] = setInterval(() => this.press(k), k === 'down' ? 32 : this.arr);
    }, this.das);
  },
  up(k) {
    this.held[k] = false;
    clearTimeout(this.timers[k]); clearInterval(this.timers[k]); this.timers[k] = null;
  },
  clearAll() { for (const k in this.timers) this.up(k); }
};
function togglePause() {
  const g = UI.game; if (!g || UI.over) return;
  if (UI.mode === 'net') { toast('たいせんちゅうは ポーズできません', '#FFD3D8'); return; }
  g.paused = !g.paused;
  if (UI.cpu) UI.cpu.paused = g.paused;
  Keys.clearAll();
  if (!g.paused) { $('#overlay').classList.remove('on'); toast('さいかい', '#fff'); return; }
  const card = $('#overlayCard');
  card.innerHTML = `
    <h2>ポーズちゅう</h2>
    <div class="note" style="font-size:13px">${g.score.toLocaleString()} てん ・ ${g.lines} ライン</div>
    <button class="btn primary" id="btnResume">つづける</button>
    <button class="btn" id="btnQuit">やめて メニューへ</button>`;
  $('#overlay').classList.add('on');
  $('#btnResume').onclick = () => togglePause();
  $('#btnQuit').onclick = () => {
    $('#overlay').classList.remove('on');
    g.paused = false; if (UI.cpu) UI.cpu.paused = false;
    show('title');
  };
}

const KEYMAP = {

};

// 十字キー ── 指を置いたまま すべらせて 方向を かえられる
(function dpad() {
  const dp = $('#dpad'); if (!dp) return;
  const arm = { left: $('.left', dp), right: $('.right', dp), down: $('.down', dp), up: $('.up', dp) };
  const KEY = { left: 'left', right: 'right', down: 'down', up: 'drop' };
  let active = null, first = null, pid = null;

  function dirAt(e) {
    const r = dp.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width / 2);
    const y = e.clientY - (r.top + r.height / 2);
    const dead = r.width * 0.15;
    if (Math.abs(x) < dead && Math.abs(y) < dead) return null;
    return Math.abs(x) >= Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
  }
  function set(dir) {
    if (dir === active) return;
    if (active) { Keys.up(KEY[active]); arm[active].classList.remove('on'); }
    active = dir;
    if (!dir) return;
    arm[dir].classList.add('on');
    // ハードドロップは すべって入るのを ふせぐ（さいしょに押した方向のときだけ）
    if (dir === 'up') { if (first === 'up') Keys.down('drop', false); }
    else Keys.down(dir, true);
  }
  dp.addEventListener('pointerdown', e => {
    e.preventDefault(); Snd.boot(); pid = e.pointerId;
    try { dp.setPointerCapture(pid); } catch (_) { }
    first = dirAt(e); set(first);
  });
  dp.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    e.preventDefault();
    const d = dirAt(e);
    set(d === 'up' && first !== 'up' ? null : d);
  });
  const end = e => { if (pid !== null && e.pointerId !== pid) return; set(null); first = null; pid = null; };
  dp.addEventListener('pointerup', end);
  dp.addEventListener('pointercancel', end);
  dp.addEventListener('lostpointercapture', end);
  dp.addEventListener('contextmenu', e => e.preventDefault());
})();

// 盤面スワイプ（おまけ）
(() => {
  const el = $('.arena');
  let sx = 0, sy = 0, st = 0, moved = 0, cell = 0;
  const padOn = () => $('#pad').classList.contains('on');
  el.addEventListener('pointerdown', e => {
    if (padOn() || e.target.closest('#pad')) return;
    sx = e.clientX; sy = e.clientY; st = performance.now(); moved = 0;
    cell = ($('#board').clientWidth || 300) / COLS;
  });
  el.addEventListener('pointermove', e => {
    if (!st || !UI.game || padOn()) return;
    const dx = e.clientX - sx;
    while (Math.abs(dx - moved) >= cell) {
      const dir = dx > moved ? 1 : -1;
      UI.game.move(dir); moved += dir * cell;
    }
  });
  el.addEventListener('pointerup', e => {
    if (!st || !UI.game || padOn()) { st = 0; return; }
    const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18 && dt < 260) UI.game.rotate(1);
    else if (dy > 70 && Math.abs(dx) < 60 && dt < 320) UI.game.hardDrop();
    else if (dy < -70 && Math.abs(dx) < 60 && dt < 320) UI.game.swapHold();
    st = 0;
  });
})();

    drawMini($('#oppCv'), UI.cpu.serialize(), UI.cpu.alive);
    $('#oppSt').textContent = UI.cpu.lines + ' ライン';
  } else if (UI.mode === 'net') {
    const p = Link.peer;
    $('#oppName').textContent = p.name;
    drawMini($('#oppCv'), p.state && p.state.board, p.alive);
    $('#oppSt').textContent = p.present ? (p.state ? p.state.lines + ' ライン' : 'まちうけ') : 'せつだん…';
    const running = performance.now() - g.startedAt > 1500;
    if (running && !UI.over) {
      if (!p.present) endGame(false, 'disc');
      else if (!p.alive && g.alive) endGame(true);
    }
  }
}

/* ---------- メインループ ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(64, now - last); last = now;
  Bg.draw(now, dt);
  if (UI.screen === 'play' && UI.game) {
    UI.game.update(dt);
    if (UI.cpu) { UI.cpuBrain.step(UI.cpu, dt); UI.cpu.update(dt); }
    drawBoard($('#board'), UI.game);
    updateHud();
    // レベルで背景をきりかえる
    const want = (UI.game.level - 1) % STAGES.length;
    if (Bg.idx !== want && Bg.next < 0) Bg.go(want);
  }
  requestAnimationFrame(loop);
}

/* ---------- 起動 ---------- */
(function boot() {
  Bg.init($('#bg'));
  // 復元
  const sp = localStorage.getItem('gt_speed'); if (sp !== null) { UI.speed = +sp; $$('#segSpeed button').forEach(x => x.setAttribute('aria-pressed', x.dataset.sp === sp)); }
  const sd = localStorage.getItem('gt_snd'); if (sd !== null) { Snd.on = sd === '1'; $$('#segSound button').forEach(x => x.setAttribute('aria-pressed', x.dataset.sd === sd)); }
  $('#inName').value = localStorage.getItem('gt_name') || '';
  $('#inRoom').value = localStorage.getItem('gt_room') || 'family';

  const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  $('#pad').classList.toggle('on', touch);

  $('#titleNote').innerHTML =
    LINK_MODE === 'p2p' ? 'たいせんは たんまつどうしを ちょくせつ つなぎます。おなじ あいことばで へやに はいってね。'
    : LINK_MODE === 'relay' ? 'おうちの PC ごしに たいせんします。おなじ あいことばで へやに はいってね。'
    : 'いまは 1人用モードです。たいせんするには、こうかいした https の アドレスで ひらくか、PCで <code>python3 relay.py</code> を うごかしてください。';
  setInterval(renderLobby, 200);

  addEventListener('resize', () => setTimeout(layout, 60));
  addEventListener('orientationchange', () => setTimeout(layout, 220));
  document.addEventListener('pointerdown', () => Snd.boot(), { once: true });
  layout();
  requestAnimationFrame(loop);
})();


</script>
</body>
